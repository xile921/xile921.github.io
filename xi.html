<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TF排班">
<title>TF排班与出勤</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231f2937'/%3E%3Cpath d='M42 22h16v20h20v16H58v20H42V58H22V42h20V22z' fill='%23f9fafb'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%231f2937'/%3E%3Cpath d='M42 22h16v20h20v16H58v20H42V58H22V42h20V22z' fill='%23f9fafb'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f4f6; --card:#fff; --ink:#111827; --sub:#6b7280; --line:#e5e7eb;
  --brand:#1f2937; --ok:#059669; --warn:#d97706; --bad:#dc2626; --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.5;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  overscroll-behavior-y:contain;
}
.hide{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:12px}
.topbar{
  position:sticky;top:0;z-index:30;
  background:rgba(243,244,246,.94);backdrop-filter:blur(10px);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  border-bottom:1px solid var(--line);
}
.topbar h1{margin:0;font-size:17px;display:flex;align-items:center;gap:8px}
.topbar .sub{color:var(--sub);font-size:12px;margin-top:2px}
.cross{width:22px;height:22px;flex:none}
.card{background:var(--card);border-radius:var(--radius);padding:14px;margin:10px 0;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.04)}
.card h2{margin:0 0 10px;font-size:15px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.card h3{margin:16px 0 8px;font-size:13.5px;color:var(--brand)}
label{display:block;font-size:12.5px;color:var(--sub);margin:8px 0 4px}
input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=tel],input[type=date],input[type=number],select,textarea{
  width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fbfbfd;outline:none}
input:focus,select:focus,textarea:focus{border-color:#9ca3af;background:#fff}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px}
.row>*{flex:1;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:11px;
  padding:11px 14px;background:var(--brand);color:#fff;font-weight:600;font-size:14px;cursor:pointer;
  transition:transform .06s ease,opacity .15s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--brand);border:1px solid var(--line)}
.btn.soft{background:#eef2ff;color:#3730a3}
.btn.ok{background:var(--ok)} .btn.warn{background:var(--warn)} .btn.bad{background:var(--bad)}
.btn.sm{padding:8px 11px;font-size:12.5px;border-radius:9px}
.btn.block{width:100%}
.btn:disabled{opacity:.4;pointer-events:none}
.hint{font-size:12px;color:var(--sub);margin-top:6px}
.pill{display:inline-flex;align-items:center;gap:4px;background:#eef2ff;color:#3730a3;
  border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.empty{text-align:center;color:var(--sub);padding:22px 8px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--sub);font-weight:600;font-size:11.5px;background:#fafafa}
tr:last-child td{border-bottom:none}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tag{display:inline-block;border-radius:6px;padding:1px 6px;font-size:11px;font-weight:700}
.tag.ok{background:#d1fae5;color:#065f46}
.tag.warn{background:#fef3c7;color:#92400e}
.tag.bad{background:#fecaca;color:#7f1d1d}
.tag.gray{background:#eef0f3;color:#6b7280}
.muted{color:var(--sub);font-size:11px}
.person-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.person-row:last-child{border-bottom:none}
.person-row .name{font-weight:600}
.person-row .meta{font-size:11.5px;color:var(--sub)}
.seg{display:flex;background:#eef0f3;border-radius:10px;padding:3px;gap:3px}
.tabs{display:flex;gap:6px;margin:4px 0 10px}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 4px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
  background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom));gap:6px}
.bottomnav button{flex:1;border:none;background:transparent;border-radius:12px;padding:7px 4px;
  display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--sub);font-size:11px;font-weight:600;cursor:pointer}
.bottomnav button .ic{font-size:18px;line-height:1}
.bottomnav button.on{color:var(--brand);background:#f1f3f6}
.modal-mask{position:fixed;inset:0;background:rgba(17,24,39,.45);z-index:60;display:flex;
  align-items:flex-end;justify-content:center;animation:fade .16s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;
  padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;
  animation:up .2s cubic-bezier(.2,.8,.2,1)}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:translateY(0);opacity:1}}
.modal h3{margin:0 0 4px;font-size:16px}
.modal .m-sub{color:var(--sub);font-size:12.5px;margin-bottom:12px}
.modal .acts{display:flex;gap:8px;margin-top:16px}
.modal .acts>*{flex:1}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:rgba(17,24,39,.94);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:80;
  max-width:88vw;text-align:center;animation:fade .15s ease}
.divider{height:1px;background:var(--line);margin:12px 0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;font-size:13px}
.kv .k{color:var(--sub)}
.kv .v{font-weight:600;text-align:right;word-break:break-all}
.week-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.week-title{text-align:center;font-size:13px;font-weight:600;line-height:1.3}
.att-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.att-row:last-child{border-bottom:none}
.att-row .who{flex:1;min-width:0}
.att-row .who .n{font-weight:600;font-size:13.5px}
.att-row .who .m{font-size:11.5px;color:var(--sub)}
.att-btns{display:flex;gap:4px;flex:none}
.att-summary{font-size:12.5px;color:var(--sub);margin:6px 0 4px}
.month-card{border:1px solid var(--line);border-radius:12px;margin:8px 0;background:#fff;overflow:hidden}
.month-card summary{padding:12px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:600;font-size:13.5px;list-style:none}
.month-card summary::-webkit-details-marker{display:none}
.month-card summary .meta{font-size:11.5px;color:var(--sub);font-weight:500}
.month-body{padding:0 12px 12px}
.week-detail{padding:10px 0;border-top:1px dashed var(--line)}
.week-detail-title{font-size:12px;color:var(--sub);margin-bottom:6px}
.att-mini-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:13px}
.att-mini-btns{display:flex;gap:4px}
.mini{border:1px solid var(--line);background:#fff;border-radius:7px;padding:4px 9px;font-size:11.5px;cursor:pointer}
.mini.on-ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.mini.on-bad{background:var(--bad);color:#fff;border-color:var(--bad)}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:8px}
.stat{background:#fafafa;border:1px solid var(--line);border-radius:11px;padding:10px}
.stat .k{font-size:11.5px;color:var(--sub)}
.stat .v{font-size:19px;font-weight:700;margin-top:1px}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px;padding:8px 4px;background:#fafafa;border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.bar-col{flex:1;min-width:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar-fill{width:100%;max-width:22px;border-radius:4px 4px 0 0;min-height:2px;transition:height .3s}
.bar-label{font-size:9.5px;color:var(--sub);margin-top:4px}
.person-stat{padding:9px 0;border-bottom:1px solid var(--line)}
.person-stat:last-child{border-bottom:none}
.ps-name{font-weight:600;font-size:13.5px}
.ps-detail{font-size:11.5px;color:var(--sub);margin-top:1px}
.ps-note{font-size:11.5px;color:#92400e;margin-top:2px}
</style>
</head>
<body>

<header class="topbar">
  <h1>
    <svg class="cross" viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#1f2937"/><path d="M42 22h16v20h20v16H58v20H42V58H22V42h20V22z" fill="#f9fafb"/></svg>
    <span>TF 排班与出勤</span>
  </h1>
  <div class="sub" id="topSub">本地存储 · 仅此手机</div>
</header>

<main class="wrap">

  <!-- ============ 排班 ============ -->
  <section id="viewPlan">

    <div id="planSetup">
      <div class="card">
        <h2>参与人 <span class="pill" id="peopleCount"></span></h2>
        <button class="btn block" onclick="openPersonForm()">＋ 添加参与人</button>
        <div id="personList" style="margin-top:10px"></div>
      </div>

      <div class="card">
        <h2>学期与可预约时段</h2>
        <button class="btn ghost block" onclick="openTermForm()">设置学期区间与可预约时段</button>
        <div id="termSummary" style="margin-top:10px"></div>
      </div>

      <div class="card">
        <button class="btn ok block" onclick="generatePlan()">生成排班</button>
        <p class="hint">规则：整学期按周均摊，每周内尽量分散到不同天；同一人同一天最多一场；全天优先。</p>
      </div>
    </div>

    <div id="planResult" class="hide">
      <div class="card">
        <h2>排班表 <span class="pill" id="planMeta"></span></h2>
        <div class="tabs" id="planTabs">
          <button data-tab="week" class="on" onclick="switchPlanTab('week')">周</button>
          <button data-tab="month" onclick="switchPlanTab('month')">月</button>
          <button data-tab="term" onclick="switchPlanTab('term')">学期</button>
        </div>
        <div id="planViewBody"></div>
        <div class="divider"></div>
        <h3 style="margin-top:0">保存为图片</h3>
        <div class="row">
          <button class="btn ghost sm" onclick="savePlanImage('week')">本周</button>
          <button class="btn ghost sm" onclick="savePlanImage('month')">本月</button>
          <button class="btn ghost sm" onclick="savePlanImage('term')">整学期</button>
        </div>
        <div class="row" style="margin-top:10px">
          <button class="btn soft sm" onclick="backToSetup()">修改设置</button>
          <button class="btn soft sm" onclick="regeneratePlan()">重新生成</button>
        </div>
        <p class="hint">点击表格中的状态按钮可标记「已完成 / 未完成 / 待完成」。标记未完成会询问重排方式。</p>
      </div>
    </div>

  </section>

  <!-- ============ 出勤 ============ -->
  <section id="viewAtt" class="hide">
    <div class="card">
      <h2>出勤记录 <span class="pill" id="attTermPill">—</span></h2>
      <div class="tabs" id="attTabs">
        <button data-tab="week" class="on" onclick="switchAttTab('week')">周</button>
        <button data-tab="month" onclick="switchAttTab('month')">月</button>
        <button data-tab="term" onclick="switchAttTab('term')">学期</button>
      </div>
      <div id="attBody"></div>
      <p class="hint">严重程度只统计已标记的日期，未标记不计入分母。未出勤率 ≥50% 注意，≥80% 严重。</p>
    </div>
  </section>

  <!-- ============ 数据 ============ -->
  <section id="viewData" class="hide">
    <div class="card">
      <h2>数据与备份</h2>
      <p class="hint" style="margin-top:0">数据保存在本机浏览器。建议定期生成备份码另存。</p>
      <div class="row">
        <button class="btn block" onclick="exportCode()">生成备份码</button>
        <button class="btn ghost block" onclick="openImport()">粘贴恢复</button>
      </div>
      <div id="codeOut" class="hide" style="margin-top:12px">
        <label>备份码（长按全选复制）</label>
        <textarea id="codeText" readonly style="min-height:110px;font-family:ui-monospace,Menlo,monospace;font-size:11.5px"></textarea>
        <div class="row" style="margin-top:8px">
          <button class="btn soft sm" onclick="copyCode()">复制</button>
          <button class="btn ghost sm" onclick="document.getElementById('codeOut').classList.add('hide')">收起</button>
        </div>
      </div>
      <div class="divider"></div>
      <h3 style="margin-top:0">添加到主屏幕</h3>
      <p class="hint" style="margin-top:0">iOS 用 Safari 打开 → 分享 → 添加到主屏幕；Android 用 Chrome → 菜单 → 添加到主屏幕。图标为十字架。</p>
      <button class="btn ghost block" onclick="installTip()">查看安装指引</button>
      <div class="divider"></div>
      <button class="btn bad block" onclick="clearAll()">清空本机全部数据</button>
    </div>
  </section>

</main>

<nav class="bottomnav">
  <button class="on" id="navPlan" onclick="switchView('plan')"><span class="ic">📅</span>排班</button>
  <button id="navAtt" onclick="switchView('att')"><span class="ic">✅</span>出勤</button>
  <button id="navData" onclick="switchView('data')"><span class="ic">💾</span>数据</button>
</nav>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* =========================================================
   常量与工具
   ========================================================= */
const LS_KEY = 'tf_sched_att_v2';
const WEEK_CN = ['周日','周一','周二','周三','周四','周五','周六'];
const PERIODS = [
  {k:'all', label:'全天', rank:0},
  {k:'am',  label:'上午', rank:1},
  {k:'pm',  label:'下午', rank:2},
  {k:'eve', label:'晚上', rank:3},
];
const PERIOD_LABEL = Object.fromEntries(PERIODS.map(p=>[p.k,p.label]));
const PERIOD_RANK = Object.fromEntries(PERIODS.map(p=>[p.k,p.rank]));

const $ = s => document.querySelector(s);
function uid(){ return Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseDate(s){ const [y,m,d] = s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function dayDiff(a,b){ return Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate()) - new Date(a.getFullYear(),a.getMonth(),a.getDate()))/86400000); }
function startOfWeek(d){ const x = new Date(d.getFullYear(),d.getMonth(),d.getDate()); const w = (x.getDay()+6)%7; return addDays(x,-w); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, ms=2200){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  $('#toastRoot').appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .3s'; setTimeout(()=>t.remove(),320); }, ms);
}
function confirmModal(title, sub, okText='确定', cancelText='取消'){
  return new Promise(resolve=>{
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML = `<div class="modal">
      <h3>${esc(title)}</h3>
      ${sub?`<div class="m-sub">${sub}</div>`:''}
      <div class="acts">
        <button class="btn ghost" data-act="cancel">${esc(cancelText)}</button>
        <button class="btn" data-act="ok">${esc(okText)}</button>
      </div></div>`;
    mask.addEventListener('click', e=>{
      const act = e.target.closest('[data-act]');
      if(!act) return;
      mask.remove();
      resolve(act.dataset.act === 'ok');
    });
    $('#modalRoot').appendChild(mask);
  });
}
function choiceModal(title, sub, options){
  return new Promise(resolve=>{
    const mask = document.createElement('div');
    mask.className = 'modal-mask';
    mask.innerHTML = `<div class="modal">
      <h3>${esc(title)}</h3>
      ${sub?`<div class="m-sub">${esc(sub)}</div>`:''}
      <div style="display:flex;flex-direction:column;gap:8px">
        ${options.map((o,i)=>`<button class="btn ${o.cls||'ghost'} block" data-i="${i}">${esc(o.label)}</button>`).join('')}
      </div>
      <div class="acts"><button class="btn ghost" data-i="-1">取消</button></div>
    </div>`;
    mask.addEventListener('click', e=>{
      const b = e.target.closest('[data-i]');
      if(!b) return;
      mask.remove();
      const i = Number(b.dataset.i);
      resolve(i>=0 ? options[i].value : null);
    });
    $('#modalRoot').appendChild(mask);
  });
}
function pickEvenly(arr, k){
  if(k<=0 || !arr.length) return [];
  if(k>=arr.length) return arr.slice();
  const out = [];
  for(let i=0;i<k;i++){
    const idx = Math.floor((i + 0.5) * arr.length / k);
    out.push(arr[Math.min(idx, arr.length-1)]);
  }
  return out;
}
function cmpPlan(a,b){
  if(a.date!==b.date) return a.date < b.date ? -1 : 1;
  return (PERIOD_RANK[a.period]??9) - (PERIOD_RANK[b.period]??9);
}

/* =========================================================
   状态
   ========================================================= */
function emptyState(){
  return {
    version:2,
    people:[],
    term:null,
    plan:[],
    attendance:{},   // key -> 'present' | 'absent'
    attTerm:null,
    meta:{updatedAt:0}
  };
}
let state = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return emptyState();
    const s = JSON.parse(raw);
    const base = emptyState();
    const merged = Object.assign(base, s);
    // 迁移旧版 attendance(true) -> 'present'
    if(merged.attendance){
      Object.keys(merged.attendance).forEach(k=>{
        if(merged.attendance[k] === true) merged.attendance[k] = 'present';
        if(merged.attendance[k] === false) delete merged.attendance[k];
      });
    }
    // 旧版状态 void 迁移为 miss
    if(Array.isArray(merged.plan)){
      merged.plan.forEach(x=>{ if(x.status==='void') x.status='miss'; });
    }
    return merged;
  }catch(e){ return emptyState(); }
}
function save(){
  state.meta.updatedAt = Date.now();
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
  catch(e){ toast('保存失败：存储空间可能已满'); }
}
async function requestPersist(){
  try{ if(navigator.storage && navigator.storage.persist) await navigator.storage.persist(); }catch(e){}
}
requestPersist();

/* =========================================================
   周计算
   ========================================================= */
function weeksInRange(startStr, endStr){
  const weeks = [];
  if(!startStr || !endStr) return weeks;
  let cur = startOfWeek(parseDate(startStr));
  const end = parseDate(endStr);
  let idx = 0;
  while(cur <= end){
    weeks.push({idx, start:fmtDate(cur), end:fmtDate(addDays(cur,6))});
    cur = addDays(cur,7); idx++;
  }
  return weeks;
}
function defaultWeekIdx(startStr, endStr){
  const weeks = weeksInRange(startStr, endStr);
  const now = new Date();
  for(let i=0;i<weeks.length;i++){
    if(now >= parseDate(weeks[i].start) && now <= parseDate(weeks[i].end)) return i;
  }
  return 0;
}

/* =========================================================
   排班生成：整学期按周均摊
   ========================================================= */
function buildSlots(){
  if(!state.term) return [];
  const {start,end,days} = state.term;
  const slots = [];
  let d = parseDate(start), last = parseDate(end);
  if(isNaN(d) || isNaN(last)) return [];
  while(d <= last){
    const wd = d.getDay();
    const chosen = days[wd] || [];
    const list = chosen.includes('all') ? ['all'] : chosen.filter(k=>k!=='all');
    list.forEach(pk=> slots.push({date:fmtDate(d), period:pk}));
    d = addDays(d,1);
  }
  return slots.sort((a,b)=>{
    if(a.date!==b.date) return a.date < b.date ? -1 : 1;
    return PERIOD_RANK[a.period] - PERIOD_RANK[b.period];
  });
}
function assignToSlots(people, slots, remaining, fixedDays, weeks){
  const plan = [];
  let remainingWeeks = weeks.length;
  for(const w of weeks){
    let remainingNeed = 0;
    for(const p of people) remainingNeed += remaining[p.id];
    if(remainingNeed === 0) break;
    const weekSlots = slots.filter(s => s.date >= w.start && s.date <= w.end);
    if(!weekSlots.length){ remainingWeeks--; continue; }
    const target = Math.ceil(remainingNeed / Math.max(1, remainingWeeks));
    const picked = pickEvenly(weekSlots, Math.min(target, weekSlots.length));
    for(const slot of picked){
      let cands = people.filter(p => remaining[p.id] > 0 && !(fixedDays[slot.date] && fixedDays[slot.date].has(p.id)));
      if(!cands.length) continue;
      const maxRem = Math.max(...cands.map(p => remaining[p.id]));
      cands = cands.filter(p => remaining[p.id] === maxRem);
      const pick = cands[0];
      plan.push({id:uid(), date:slot.date, period:slot.period, personId:pick.id, status:'todo'});
      remaining[pick.id]--;
      if(!fixedDays[slot.date]) fixedDays[slot.date] = new Set();
      fixedDays[slot.date].add(pick.id);
    }
    remainingWeeks--;
  }
  return plan;
}
let showSetup = false;
function generatePlan(){
  if(!state.term){ toast('请先设置学期区间'); return; }
  const people = state.people.filter(p=>p.active!==false);
  if(!people.length){ toast('请先添加参与人'); return; }
  const slots = buildSlots();
  if(!slots.length){ toast('当前设置下没有可预约时段'); return; }
  const weeks = weeksInRange(state.term.start, state.term.end);
  const remaining = {};
  people.forEach(p => remaining[p.id] = state.term.expect);
  const fixedDays = {};
  const plan = assignToSlots(people, slots, remaining, fixedDays, weeks);
  state.plan = plan.sort(cmpPlan);
  const leftover = Object.values(remaining).reduce((a,b)=>a+b,0);
  showSetup = false;
  save(); renderPlan(); renderTopSub();
  toast(leftover > 0 ? `已生成 ${plan.length} 场，仍有 ${leftover} 场因时段不足未排` : `已生成 ${plan.length} 场排班`);
}

/* =========================================================
   状态标记与重排
   ========================================================= */
async function openStatus(planId){
  const item = state.plan.find(x=>x.id===planId);
  if(!item) return;
  const v = await choiceModal('标记场次', `${item.date} ${PERIOD_LABEL[item.period]} · ${personName(item.personId)}`, [
    {label:'已完成', value:'done', cls:'ok'},
    {label:'未完成', value:'miss', cls:'bad'},
    {label:'待完成', value:'todo', cls:'ghost'},
  ]);
  if(!v) return;
  item.status = v;
  save(); renderPlanView(); renderTopSub();
  if(v==='miss'){
    const how = await choiceModal('该场未完成，如何重排？',
      '请选择一种方式：',
      [
        {label:'只把这一场移到最近可去的日期（其他计划不动）', value:'move', cls:'soft'},
        {label:'该场次及之后全部重新平均分配', value:'reflow', cls:'soft'},
        {label:'暂不处理', value:null, cls:'ghost'},
      ]);
    if(how==='move') moveOnePlan(item);
    else if(how==='reflow') reflowFrom(item.date);
  }
}
function moveOnePlan(item){
  const personId = item.personId;
  const usedDays = new Set(
    state.plan.filter(x=> x.personId===personId && x.id!==item.id && x.status!=='miss').map(x=>x.date)
  );
  const slots = buildSlots().filter(s=> s.date > item.date && !usedDays.has(s.date));
  if(!slots.length){ toast('该日期之后没有可用日期'); return; }
  const pick = slots[0];
  item.date = pick.date;
  item.period = pick.period;
  item.status = 'todo';
  save(); renderPlanView(); renderTopSub();
  toast(`已移到 ${pick.date} ${PERIOD_LABEL[pick.period]}`);
}
function reflowFrom(fromDate){
  const before = state.plan.filter(x=> x.date < fromDate);
  const after = state.plan.filter(x=> x.date >= fromDate);
  const doneAfter = after.filter(x=> x.status==='done');
  const kept = before.concat(doneAfter);
  const people = state.people.filter(p=>p.active!==false);
  const fixedByPerson = {};
  kept.forEach(x=> fixedByPerson[x.personId] = (fixedByPerson[x.personId]||0)+1);
  const remaining = {};
  people.forEach(p=> remaining[p.id] = Math.max(0, state.term.expect - (fixedByPerson[p.id]||0)));
  const fixedDays = {};
  kept.forEach(x=>{
    if(!fixedDays[x.date]) fixedDays[x.date] = new Set();
    fixedDays[x.date].add(x.personId);
  });
  const slots = buildSlots().filter(s=> s.date >= fromDate);
  const weeks = weeksInRange(fromDate, state.term.end);
  const newPlan = assignToSlots(people, slots, remaining, fixedDays, weeks);
  state.plan = kept.concat(newPlan).sort(cmpPlan);
  save(); renderPlanView(); renderTopSub();
  toast(`已重排，新增 ${newPlan.length} 场`);
}

/* =========================================================
   保存图片
   ========================================================= */
function savePlanImage(scope){
  if(!state.plan.length){ toast('暂无排班'); return; }
  let list = state.plan.slice();
  const today = new Date();
  if(scope==='week'){
    const s = startOfWeek(today), e = addDays(s,6);
    list = list.filter(x=> parseDate(x.date)>=s && parseDate(x.date)<=e);
  } else if(scope==='month'){
    const y = today.getFullYear(), m = today.getMonth();
    list = list.filter(x=>{ const d = parseDate(x.date); return d.getFullYear()===y && d.getMonth()===m; });
  }
  if(!list.length){ toast('该范围内没有排班'); return; }
  list.sort(cmpPlan);

  const rowH = 34, headH = 54, padX = 16, W = 720;
  const H = headH + list.length*rowH + 28;
  const cvs = document.createElement('canvas');
  const dpr = Math.min(window.devicePixelRatio||2, 3);
  cvs.width = W*dpr; cvs.height = H*dpr;
  const ctx = cvs.getContext('2d');
  ctx.scale(dpr,dpr);
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,W,H);

  ctx.fillStyle = '#111827';
  ctx.font = 'bold 20px -apple-system, "PingFang SC", sans-serif';
  const title = scope==='week' ? '本周排班' : scope==='month' ? '本月排班' : '整学期排班';
  ctx.fillText(title, padX, 32);
  ctx.font = '12px -apple-system, "PingFang SC", sans-serif';
  ctx.fillStyle = '#6b7280';
  ctx.fillText(`${state.term.start} 至 ${state.term.end} · 共 ${list.length} 场`, padX, 50);

  const cols = [
    {t:'日期', x:padX, w:130},
    {t:'时段', x:padX+130, w:90},
    {t:'人员', x:padX+220, w:W-padX*2-220-120},
    {t:'状态', x:W-padX-120, w:120}
  ];
  ctx.fillStyle = '#f3f4f6'; ctx.fillRect(padX, headH, W-padX*2, 30);
  ctx.fillStyle = '#374151'; ctx.font = 'bold 13px -apple-system, "PingFang SC", sans-serif';
  cols.forEach(c=>ctx.fillText(c.t, c.x+6, headH+20));

  let y = headH+30;
  list.forEach((x,i)=>{
    if(i%2===1){ ctx.fillStyle = '#fafafa'; ctx.fillRect(padX, y, W-padX*2, rowH); }
    ctx.strokeStyle = '#e5e7eb'; ctx.beginPath(); ctx.moveTo(padX,y+rowH); ctx.lineTo(W-padX,y+rowH); ctx.stroke();
    ctx.fillStyle = '#111827'; ctx.font = '13px -apple-system, "PingFang SC", sans-serif';
    const d = parseDate(x.date);
    ctx.fillText(`${x.date.slice(5)} ${WEEK_CN[d.getDay()]}`, cols[0].x+6, y+22);
    ctx.fillText(PERIOD_LABEL[x.period], cols[1].x+6, y+22);
    ctx.fillText(personName(x.personId), cols[2].x+6, y+22);
    ctx.fillStyle = x.status==='done'?'#059669':x.status==='miss'?'#dc2626':'#6b7280';
    ctx.fillText(statusText(x.status), cols[3].x+6, y+22);
    y += rowH;
  });

  const a = document.createElement('a');
  a.download = `排班_${scope}_${fmtDate(new Date())}.png`;
  a.href = cvs.toDataURL('image/png');
  a.click();
  toast('图片已生成');
}

/* =========================================================
   出勤
   ========================================================= */
let attTab = 'week';
let attWeekIdx = 0;

function ensureAttTerm(){
  if(!state.attTerm && state.term) state.attTerm = {start:state.term.start, end:state.term.end};
}
function attKey(weekIdx, personId){
  return `${state.attTerm.start}_${weekIdx}_${personId}`;
}
function setAtt(weekIdx, personId, val){
  const k = attKey(weekIdx, personId);
  if(state.attendance[k] === val) delete state.attendance[k];
  else state.attendance[k] = val;
  save(); renderAttView();
}
function personAttStats(personId, weeks){
  let present = 0, absent = 0;
  weeks.forEach(w=>{
    const v = state.attendance[attKey(w.idx, personId)];
    if(v==='present') present++;
    else if(v==='absent') absent++;
  });
  const marked = present + absent;
  return {present, absent, marked, missRate: marked ? absent/marked : null};
}
function overallAttStats(weeks){
  let present = 0, absent = 0;
  const people = state.people.filter(p=>p.active!==false);
  weeks.forEach(w=>{
    people.forEach(p=>{
      const v = state.attendance[attKey(w.idx, p.id)];
      if(v==='present') present++;
      else if(v==='absent') absent++;
    });
  });
  const marked = present + absent;
  return {present, absent, marked, missRate: marked ? absent/marked : null};
}
function severityTag(rate){
  if(rate===null) return '<span class="tag gray">暂无记录</span>';
  if(rate>=0.8) return '<span class="tag bad">严重</span>';
  if(rate>=0.5) return '<span class="tag warn">注意</span>';
  return '<span class="tag ok">正常</span>';
}
function switchAttTab(tab){
  attTab = tab;
  ensureAttTerm();
  if(tab==='week' && state.attTerm) attWeekIdx = defaultWeekIdx(state.attTerm.start, state.attTerm.end);
  document.querySelectorAll('#attTabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
  renderAttView();
}
