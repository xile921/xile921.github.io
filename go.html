<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="同行">
<meta name="format-detection" content="telephone=no,email=no,address=no">
<title>同行 · 团契关怀</title>
<style>
:root{
  --bg:#f5f6f2;--card:#fff;--ink:#26332b;--muted:#849087;--line:#e7ebe5;
  --green:#285c46;--green-bg:#e8f1e9;--red:#b94d43;--orange:#a87835;--radius:17px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);touch-action:manipulation;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:var(--ink)}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid #83aa91;outline-offset:2px}
#app{max-width:560px;margin:auto;min-height:100dvh;padding-bottom:90px}
.top{position:sticky;top:0;z-index:5;background:#f5f6f2ed;backdrop-filter:blur(14px);padding:12px 17px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:36px;height:36px;border-radius:12px;background:var(--green);color:white;display:grid;place-items:center;font-size:19px;font-weight:750}
.brand-name{font-size:19px;font-weight:800;letter-spacing:.5px}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:1.5px}
.date-now{font-size:12px;color:var(--muted)}
main{padding:7px 15px 22px}
h1{font-size:25px;line-height:1.3;margin:0 0 5px;letter-spacing:-.4px}
h2{font-size:18px;margin:0}
h3{font-size:14px;margin:0 0 10px}
p{margin:0 0 9px}
.muted{font-size:12px;color:var(--muted)}
.small{font-size:12px}
.section{margin-top:23px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.card{background:var(--card);border:1px solid #26332b08;border-radius:var(--radius);padding:15px;margin-bottom:10px}
.hero{background:var(--green);color:white;border-radius:22px;padding:21px;margin:7px 0 12px}
.hero .muted{color:#ffffffb9}
.big{font-size:35px;font-weight:800;line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.metric{background:white;border-radius:16px;padding:15px;min-width:0}
.metric-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.metric-value{font-size:25px;font-weight:800;line-height:1.2}
.metric-foot{font-size:11px;color:var(--muted);margin-top:7px}
.progress{height:6px;border-radius:8px;background:#e9ede7;overflow:hidden;margin:12px 0}
.progress div{height:100%;background:#7eaa8d;border-radius:8px}
.hero .progress{background:#ffffff2b}
.hero .progress div{background:#d7eadb}
.btn{border:0;border-radius:11px;padding:10px 14px;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.primary{background:var(--green);color:white}
.soft{background:var(--green-bg);color:var(--green)}
.plain{background:#f0f2ee;color:var(--ink)}
.danger{background:#fbecea;color:var(--red)}
.mini{padding:7px 9px;font-size:12px;border-radius:9px}
.block{width:100%}
.text-btn{border:0;background:none;color:var(--ink);font-weight:700;font-size:13px;padding:6px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.flex1{flex:1;min-width:0}
.badge{font-size:11px;background:#eff2ed;color:#68756a;padding:4px 7px;border-radius:7px;white-space:nowrap}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.orange{background:#f7efe1;color:var(--orange)}
.badge.red{background:#fbecea;color:var(--red)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick button{background:white;border:1px solid var(--line);border-radius:15px;padding:13px 3px;color:var(--ink)}
.quick-icon{font-size:22px;color:var(--green);margin-bottom:4px}
.quick-label{font-size:12px;font-weight:700}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item-content{flex:1;min-width:0}
.name{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.desc{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.avatar{width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:17px;font-weight:750}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty-icon{font-size:28px;margin-bottom:7px;color:#9bb19e}
.empty p{font-size:12px}
label.field{display:block;font-size:12px;color:#59665c;margin-bottom:13px}
input,select,textarea{display:block;width:100%;min-width:0;margin-top:6px;padding:11px 12px;border:1px solid #e1e7df;border-radius:11px;background:white;color:var(--ink);font-size:16px}
textarea{min-height:90px;resize:vertical;line-height:1.6}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.search{position:relative;margin:12px 0}
.search input{padding-left:36px}
.search:before{content:"⌕";position:absolute;left:12px;top:7px;font-size:23px;color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:white;color:#687268;border-radius:10px;padding:7px 11px;font-size:12px}
.chip.active{background:var(--green);border-color:var(--green);color:white}
.statuses{display:flex;gap:5px;margin-top:9px}
.status{flex:1;border:1px solid var(--line);background:white;color:#7a847b;border-radius:8px;padding:8px 1px;font-size:12px}
.status.active{background:var(--green-bg);border-color:#bed5c4;color:var(--green);font-weight:750}
.status.absent.active{background:#fbecea;color:var(--red);border-color:#efc6c0}
details{border:1px solid var(--line);border-radius:13px;background:white;margin-bottom:9px;overflow:hidden}
summary{cursor:pointer;list-style:none;padding:13px}
summary::-webkit-details-marker{display:none}
details[open]>summary{border-bottom:1px solid var(--line)}
.details-body{padding:12px}
.scroll-body{max-height:360px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.week{margin-top:9px;background:#fafbf9}
.week>summary{padding:12px}
.week-form{border-top:1px solid var(--line);padding-top:13px;margin-top:12px}
.month-head{display:flex;justify-content:space-between;gap:10px;font-weight:750}
.week-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px}
.check-chip{display:inline-flex;align-items:center;gap:6px;background:#f5f6f2;border-radius:9px;padding:8px 10px;font-size:12px}
.check-chip input{width:17px;height:17px;margin:0;accent-color:var(--green)}
.notice{background:#edf2ec;color:#596c5d;padding:11px 12px;border-radius:11px;font-size:12px;line-height:1.7;margin-bottom:12px}
.notice.warn{background:#fbf0dd;color:#8a6420}
.bottom{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr);background:#fffffffa;backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom))}
.nav{border:0;background:transparent;color:#8b948a;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;padding:3px 0}
.nav-icon{font-size:21px;line-height:1.25}
.nav.active{color:var(--green);font-weight:750}
.nav.active .nav-icon{background:var(--green-bg);border-radius:9px;padding:2px 12px}
.modal-root{display:none;position:fixed;inset:0;z-index:30;align-items:flex-end;justify-content:center}
.modal-root.open{display:flex}
.modal-overlay{position:absolute;inset:0;background:#18271e66}
.sheet{position:relative;z-index:1;width:100%;max-width:560px;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:23px 23px 0 0;padding:10px 16px calc(22px + env(safe-area-inset-bottom))}
.handle{width:35px;height:4px;background:#d6dcd4;border-radius:6px;margin:2px auto 15px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}
.sheet-head h2{margin:0}
.close{width:34px;height:34px;border:0;border-radius:50%;background:#e9ece7;font-size:20px}
.rule{border:0;border-top:1px solid var(--line);margin:16px 0}
.toast{position:fixed;z-index:60;bottom:calc(83px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:90vw;background:#263a2d;color:white;padding:11px 16px;border-radius:11px;font-size:13px}

.folded .fold-full{display:none}
.folded.open .fold-full{display:inline}
.folded .fold-more{color:var(--ink);font-weight:700;padding:0 2px}
.folded.open .fold-more{display:none}

.seg{display:flex;background:#ecefe9;border-radius:12px;padding:3px;margin:12px 0}
.seg-btn{flex:1;border:0;background:transparent;padding:8px;border-radius:9px;font-size:13px;font-weight:700;color:#77827a}
.seg-btn.active{background:white;color:var(--green);box-shadow:0 1px 3px #26332b14}

.chart-bars{display:flex;align-items:flex-end;gap:6px;height:168px;padding:24px 2px 0;overflow-x:auto;border-bottom:1px solid var(--line)}
.bar-col{flex:1 0 38px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
.bar{width:100%;max-width:26px;background:linear-gradient(#3f7a5f,#285c46);border-radius:5px 5px 0 0;position:relative;min-height:2px}
.bar.empty{background:#dfe5de}
.bar-val{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;color:#4a5a4f;white-space:nowrap}
.bar-x{font-size:9px;color:var(--muted);margin-top:6px;white-space:nowrap}
.hbar{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.hbar-name{width:66px;font-size:12px;flex:0 0 66px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar-track{flex:1;height:10px;background:#ecefe9;border-radius:6px;overflow:hidden}
.hbar-fill{height:100%;background:var(--green);border-radius:6px}
.hbar-fill.low{background:#c08a4a}
.hbar-val{width:48px;text-align:right;font-size:11px;font-weight:700;flex:0 0 48px}
.ring{width:64px;height:64px;flex:0 0 64px}
.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px;vertical-align:middle}

.pulse-card{border:1px solid var(--line);border-radius:16px;padding:13px;background:#fff;min-width:0}
.pulse-card.bad{background:#fdf1ef;border-color:#efc6c0}
.pulse-card.good{background:#eef5ef;border-color:#cfe2d5}
.pulse-title{font-size:12px;color:var(--muted);margin-bottom:6px;display:flex;justify-content:space-between;gap:6px}
.pulse-num{font-size:24px;font-weight:800;line-height:1.15}
.pulse-num span{font-size:12px;font-weight:600;color:var(--muted)}
.pulse-card .progress{margin:9px 0 0}
.pulse-card.bad .progress div{background:#c96a5f}
.pulse-card.good .progress div{background:#4f8a68}
.pulse-tag{font-size:11px;font-weight:700;margin-top:8px}
.pulse-card.bad .pulse-tag{color:var(--red)}
.pulse-card.good .pulse-tag{color:var(--green)}

.pick-list{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:12px;background:#fff;margin-top:8px}
.pick-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;text-align:left;color:var(--ink)}
.pick-item .name{color:var(--ink)}
.pick-item:last-child{border-bottom:0}
.pick-item.on{background:#f2f7f3}
.pick-item[disabled]{opacity:.55}

#tour-mask{position:fixed;inset:0;z-index:1000;background:rgba(20,30,24,.55);display:none}
body.touring #tour-mask{display:block}
.tour-hl{position:relative;z-index:1001;box-shadow:0 0 0 3px #fff,0 0 0 6px var(--green);border-radius:12px;background:var(--card)}
#tour-bubble{position:fixed;z-index:1002;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));width:calc(100% - 30px);max-width:520px;background:white;border-radius:16px;padding:15px;box-shadow:0 10px 40px #18271e33;display:none}
body.touring #tour-bubble{display:block}
#tour-bubble h3{margin:0 0 6px;font-size:16px;color:var(--green)}
#tour-bubble p{margin:0 0 12px;font-size:13px;line-height:1.65;color:#4a5a4f}
.tour-actions{display:flex;gap:8px;justify-content:space-between;align-items:center}
.tour-step{font-size:11px;color:var(--muted)}

@media(min-width:561px){
  body{padding:15px 0}
  #app{min-height:calc(100dvh - 30px);border-radius:23px;overflow:hidden;box-shadow:0 5px 40px #2030240a}
  .bottom{bottom:15px;border-radius:0 0 23px 23px}
  .sheet{border-radius:23px;margin-bottom:15px}
  .modal-root{align-items:center;padding:15px}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="logo">同</div>
      <div><div class="brand-name">同行</div><div class="brand-sub">CARE &amp; FELLOWSHIP</div></div>
    </div>
    <div class="row">
      <span class="date-now" id="today"></span>
      <button type="button" class="btn plain mini" data-action="settings">设置</button>
    </div>
  </header>
  <main id="screen"></main>
  <nav class="bottom">
    <button type="button" class="nav" data-action="nav" data-tab="home"><span class="nav-icon">⌂</span>首页</button>
    <button type="button" class="nav" data-action="nav" data-tab="visits"><span class="nav-icon">♡</span>探访</button>
    <button type="button" class="nav" data-action="nav" data-tab="attendance"><span class="nav-icon">✓</span>出勤</button>
    <button type="button" class="nav" data-action="nav" data-tab="members"><span class="nav-icon">♙</span>成员</button>
    <button type="button" class="nav" data-action="nav" data-tab="weekly"><span class="nav-icon">≡</span>周报</button>
  </nav>
</div>
<div class="modal-root" id="modal"></div>
<div id="toast-root"></div>
<div id="tour-mask"></div>
<div id="tour-bubble"></div>

<script>
'use strict';

const $ = s => document.querySelector(s);
const KEY = 'tongxing_care_v3';
const OLD_KEY = 'tongxing_care_v2';

/* ---------- 工具 ---------- */
function uid(){
  return globalThis.crypto?.randomUUID
    ? crypto.randomUUID()
    : Date.now().toString(36)+Math.random().toString(36).slice(2);
}
function today(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateObj(s){return new Date((s||today())+'T12:00:00')}
function addDays(s,n){const d=dateObj(s);d.setDate(d.getDate()+n);return iso(d)}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function shortDate(s){if(!s)return '';const d=dateObj(s);return `${d.getMonth()+1}/${d.getDate()}`}
function dateText(s){if(!s)return '';const d=dateObj(s);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rangeOK(r){return !!r?.start&&!!r?.end&&r.start<=r.end}
function inside(d,r){return !!d&&rangeOK(r)&&d>=r.start&&d<=r.end}
function daysIn(r){return rangeOK(r)?Math.max(1,Math.round((dateObj(r.end)-dateObj(r.start))/86400000)+1):1}
function weeksIn(r){return Math.max(1,Math.ceil(daysIn(r)/7))}
function weekStartSunday(s){
  const d=dateObj(s);
  return addDays(s, -d.getDay());
}
function round1(x){return Math.round(x*10)/10}
function pctText(n,d){return d>0 ? (n/d*100).toFixed(1)+'%' : '—'}
function fold(txt,limit=20){
  const s=String(txt||'');
  if(!s)return '';
  if(s.length<=limit)return esc(s);
  return `<span class="folded" data-action="toggle-text">${esc(s.slice(0,limit))}<span class="fold-more">…展开</span><span class="fold-full">${esc(s.slice(limit))}</span></span>`;
}

/* ---------- 数据 ---------- */
function fresh(){
  const start=today();
  return {
    version:3,
    settings:{
      configured:false,semesterName:'本学期',startDate:start,
      endDate:addDays(start,111),defaultTarget:2,
      activeAttendanceWeek:'',deletedAttendanceWeeks:[],
      lastBackupAt:'',tutorialDone:false,dismissBackupReminder:''
    },
    categories:[{id:'uncategorized',name:'未分类',virtual:true,target:null}],
    members:[],visits:[],meetings:[],weeklyLogs:[]
  };
}
function normalize(raw){
  const d=fresh();
  if(!raw||typeof raw!=='object')return d;
  const s={...d};
  s.settings={...d.settings,...(raw.settings||{})};
  s.settings.deletedAttendanceWeeks=Array.isArray(s.settings.deletedAttendanceWeeks)?s.settings.deletedAttendanceWeeks:[];
  if(typeof s.settings.lastBackupAt!=='string')s.settings.lastBackupAt='';
  if(typeof s.settings.tutorialDone!=='boolean')s.settings.tutorialDone=false;
  if(typeof s.settings.dismissBackupReminder!=='string')s.settings.dismissBackupReminder='';

  let cats=Array.isArray(raw.categories)&&raw.categories.length?raw.categories.map(c=>({...c})):[];
  cats=cats.filter(c=>c&&c.id);
  if(!cats.some(c=>c.id==='uncategorized'))cats.unshift({id:'uncategorized',name:'未分类',virtual:true,target:null});
  cats.forEach(c=>{
    if(c.id==='uncategorized'){c.virtual=true;c.name='未分类'}
    if(c.target===undefined)c.target=null;
  });
  s.categories=cats;

  s.members=(Array.isArray(raw.members)?raw.members:[]).map(m=>{
    const mm={...m};
    const ids=Array.isArray(m.categoryIds)?m.categoryIds:(m.categoryId?[m.categoryId]:[]);
    mm.categoryIds=ids.filter(id=>id!=='uncategorized'&&s.categories.some(c=>c.id===id&&!c.virtual));
    mm.targetOverride=(m.targetOverride===null||m.targetOverride===undefined||m.targetOverride==='')?null:Number(m.targetOverride);
    mm.targetCategoryId=m.targetCategoryId||null;
    mm.archived=!!m.archived;
    return mm;
  });
  s.visits=(Array.isArray(raw.visits)?raw.visits:[]).map(v=>({...v}));
  s.meetings=(Array.isArray(raw.meetings)?raw.meetings:[]).map(mt=>{
    const x={...mt};
    x.records=x.records&&typeof x.records==='object'?{...x.records}:{};
    Object.keys(x.records).forEach(k=>{if(x.records[k]==='leave')x.records[k]='absent'});
    x.label='聚会';
    return x;
  });
  s.weeklyLogs=(Array.isArray(raw.weeklyLogs)?raw.weeklyLogs:[]).map(l=>({...l}));
  s.version=3;
  return s;
}

let state;
let migrated=false;
try{
  let raw=JSON.parse(localStorage.getItem(KEY)||'null');
  if(!raw){
    raw=JSON.parse(localStorage.getItem(OLD_KEY)||'null');
    if(raw)migrated=true;
  }
  state=normalize(raw);
}catch{state=fresh()}

let tab=state.settings.configured?'home':'settings';
let query='';
let categoryFilter='all';
let archivedFilter=false;
let attView='register';
let analysisRange={start:'',end:''};
let memberSort='default';
let memberSortDir='desc';
let expandedGroups=new Set();
let selectedPick=new Set();
let starsExpanded=false;
let visitsExpanded=false;
let perRateExpanded=false;
let pickFromManage=false;
let toastTimer;

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}
  catch{say('本地保存失败，请立即导出备份码')}
}
function say(s){
  $('#toast-root').innerHTML=`<div class="toast">${esc(s)}</div>`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$('#toast-root').innerHTML='',2500);
}
function activeMembers(){return state.members.filter(m=>!m.archived)}
function realCats(){return state.categories.filter(c=>!c.virtual)}
function hasAnyCat(m){return (m.categoryIds||[]).some(id=>state.categories.some(c=>c.id===id&&!c.virtual))}
function categoryNames(m){
  const ids=(m.categoryIds||[]).filter(id=>state.categories.some(c=>c.id===id&&!c.virtual));
  const names=ids.map(id=>state.categories.find(c=>c.id===id)?.name).filter(Boolean);
  return names.length?names.join('、'):'未分类';
}
function memberCats(m){
  const ids=(m.categoryIds||[]).filter(id=>state.categories.some(c=>c.id===id&&!c.virtual));
  return ids.map(id=>state.categories.find(c=>c.id===id)).filter(Boolean);
}
function targetInfo(m){
  if(m.targetOverride!=null&&m.targetOverride!==''){
    return {value:Math.max(0,Number(m.targetOverride)||0),source:'个人设置'};
  }
  const cats=(m.categoryIds||[])
    .map(id=>state.categories.find(c=>c.id===id))
    .filter(c=>c&&!c.virtual&&c.target!=null&&c.target!=='');
  if(!cats.length){
    return {value:Math.max(0,Number(state.settings.defaultTarget)||0),source:'学期默认'};
  }
  if(m.targetCategoryId){
    const c=cats.find(c=>c.id===m.targetCategoryId);
    if(c)return {value:Math.max(0,Number(c.target)||0),source:'分类「'+c.name+'」'};
  }
  if(cats.length===1){
    return {value:Math.max(0,Number(cats[0].target)||0),source:'分类「'+cats[0].name+'」'};
  }
  const uniq=[...new Set(cats.map(c=>Number(c.target)||0))];
  if(uniq.length===1)return {value:uniq[0],source:'多个分类（目标一致）'};
  return {value:Math.max(0,Number(cats[0].target)||0),source:'分类「'+cats[0].name+'」（未确认）',conflict:true};
}
function targetFor(m){return targetInfo(m).value}
function semester(){return {start:state.settings.startDate,end:state.settings.endDate}}
function semesterVisits(){return state.visits.filter(v=>inside(v.date,semester()))}
function memberVisits(id){return semesterVisits().filter(v=>v.memberId===id)}
function latestVisit(id){return state.visits.filter(v=>v.memberId===id).sort((a,b)=>b.date.localeCompare(a.date))[0]||null}
function memberName(id){return state.members.find(m=>m.id===id)?.name||'已删除成员'}
function initials(s){return String(s||'?').trim().slice(0,1)}

function stats(){
  let total=0,done=0,actual=0;
  activeMembers().forEach(m=>{
    const t=targetFor(m);
    const n=memberVisits(m.id).length;
    total+=t;done+=Math.min(t,n);actual+=n;
  });
  const r=semester();
  return {
    total,done,remaining:Math.max(0,total-done),actual,
    progress:total?Math.min(100,done/total*100):0,
    perWeek:total/weeksIn(r),
    perMonth:total*30.4375/daysIn(r),
    people:activeMembers().length
  };
}

function weekStarts(r){
  if(!rangeOK(r))return [];
  const out=[];
  for(let w=weekStartSunday(r.start); w<=r.end && out.length<200; w=addDays(w,7))out.push(w);
  return out;
}
function buildWeeks(r){
  return weekStarts(r).map(start=>({start,end:addDays(start,6)}));
}
function syncWeeks(){
  const r=semester();
  if(!rangeOK(r))return;
  for(const w of weekStarts(r)){
    if(state.settings.deletedAttendanceWeeks.includes(w))continue;
    if(state.meetings.some(m=>(m.weekStart||m.date)===w))continue;
    state.meetings.push({id:uid(),weekStart:w,date:w,label:'聚会',records:{}});
  }
  save();
}
function attendanceWeeks(){
  const r=semester();
  return state.meetings.filter(m=>{
    const ws=m.weekStart||m.date;
    const we=addDays(ws,6);
    return ws<=r.end && we>=r.start;
  }).sort((a,b)=>(a.weekStart||a.date).localeCompare(b.weekStart||b.date));
}
function currentWeekStart(){return weekStartSunday(today())}
function selectedMeeting(){
  const ms=attendanceWeeks();
  return ms.find(m=>m.weekStart===state.settings.activeAttendanceWeek)
    ||ms.find(m=>m.weekStart===currentWeekStart())
    ||ms[ms.length-1]||ms[0]||null;
}
function currentWeekRange(){
  const s=weekStartSunday(today());
  return {start:s,end:addDays(s,6)};
}
function attendanceStats(){
  let p=0,a=0,un=0;
  attendanceWeeks().forEach(mt=>activeMembers().forEach(m=>{
    const v=mt.records?.[m.id];
    if(v==='present')p++;
    else if(v==='absent')a++;
    else un++;
  }));
  return {p,a,un,meetings:attendanceWeeks().length,rate:(p+a)?p/(p+a)*100:null};
}
function memberAttendance(id){
  let p=0,a=0,un=0;
  attendanceWeeks().forEach(mt=>{
    const v=mt.records?.[id];
    if(v==='present')p++;
    else if(v==='absent')a++;
    else un++;
  });
  return {p,a,un,rate:(p+a)?p/(p+a)*100:null,total:p+a};
}
function analysisData(start,end){
  const ms=state.meetings.filter(m=>{
    const ws=m.weekStart||m.date;
    const we=addDays(ws,6);
    return ws<=end && we>=start;
  }).sort((a,b)=>(a.weekStart||a.date).localeCompare(b.weekStart||b.date));
  const members=activeMembers();
  let P=0,A=0,U=0;
  const per=members.map(m=>{
    let p=0,a=0,u=0;
    ms.forEach(mt=>{
      const v=mt.records?.[m.id];
      if(v==='present')p++;
      else if(v==='absent')a++;
      else u++;
    });
    P+=p;A+=a;U+=u;
    return {m,p,a,u,rate:(p+a)?p/(p+a)*100:null};
  });
  const weeks=ms.map(mt=>{
    let p=0,a=0,u=0;
    members.forEach(m=>{
      const v=mt.records?.[m.id];
      if(v==='present')p++;
      else if(v==='absent')a++;
      else u++;
    });
    return {label:shortDate(mt.weekStart||mt.date),p,a,u,rate:(p+a)?p/(p+a)*100:null};
  });
  return {ms,per,P,A,U,rate:(P+A)?P/(P+A)*100:null,weeks};
}
function analysisGroups(d){
  const groups=realCats().map(c=>({
    id:c.id,name:c.name,
    members:d.per.filter(x=>(x.m.categoryIds||[]).includes(c.id))
  })).filter(g=>g.members.length);
  const un=d.per.filter(x=>!hasAnyCat(x.m));
  if(un.length)groups.push({id:'uncat',name:'未分类',members:un});
  return groups.map(g=>{
    let P=0,A=0,U=0;
    g.members.forEach(x=>{P+=x.p;A+=x.a;U+=x.u});
    return {id:g.id,name:g.name,members:g.members,P,A,U,rate:(P+A)?P/(P+A)*100:null};
  });
}
function memberTrend(id,n=12){
  const weeks=attendanceWeeks().slice(-n);
  return weeks.map(mt=>{
    const v=mt.records?.[id];
    return {label:shortDate(mt.weekStart||mt.date),value:v==='present'?100:v==='absent'?0:null};
  });
}

function visitCountsByMember(){
  const c={};
  state.visits.forEach(v=>{c[v.memberId]=(c[v.memberId]||0)+1});
  return c;
}
function latestByMember(){
  const c={};
  state.visits.forEach(v=>{
    if(!c[v.memberId]||v.date>c[v.memberId])c[v.memberId]=v.date;
  });
  return c;
}
function visitorCounts(){
  const c={};
  state.visits.forEach(v=>{
    String(v.visitor||'').split(/[、,，]/).map(x=>x.trim()).filter(Boolean).forEach(n=>{
      c[n]=(c[n]||0)+1;
    });
  });
  return c;
}

function resetExpanded(){
  expandedGroups.clear();
  starsExpanded=false;
  visitsExpanded=false;
  perRateExpanded=false;
}

/* ---------- 渲染 ---------- */
function render(){
  if(tab==='attendance'&&attView==='register')syncWeeks();
  const pages={home:homePage,visits:visitsPage,attendance:attendancePage,members:membersPage,weekly:weeklyPage,settings:settingsPage};
  $('#screen').innerHTML=(pages[tab]||homePage)();
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  $('#today').textContent=shortDate(today());
  maybeStartTour();
}
function backupReminder(){
  if(!state.settings.configured)return '';
  if(state.settings.dismissBackupReminder===today())return '';
  const last=state.settings.lastBackupAt;
  let due=false,msg='';
  if(!last){due=true;msg='还没有导出过备份码。资料只存在本机浏览器，清理数据后会永久丢失。'}
  else{
    const diff=Math.floor((dateObj(today())-dateObj(last))/86400000);
    if(diff>=7){due=true;msg=`上次备份是 ${diff} 天前。资料只存在本机，建议现在导出备份码。`}
  }
  if(!due)return '';
  return `<div class="notice warn">
    <div style="font-weight:700;margin-bottom:4px">⚠ 备份提醒</div>
    ${esc(msg)}
    <div class="row" style="margin-top:9px">
      <button type="button" class="btn soft mini" data-action="settings">去备份</button>
      <button type="button" class="btn plain mini" data-action="dismiss-backup">今天不再提醒</button>
    </div>
  </div>`;
}
function recentVisits(n=4){
  const vs=state.visits.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n);
  if(!vs.length)return `<div class="card empty"><div class="empty-icon">♡</div><p>还没有探访记录</p><button type="button" class="btn soft" data-action="new-visit">记录第一次探访</button></div>`;
  return `<div class="card list">${vs.map(v=>`
    <div class="item"><div class="avatar">${v.star?'★':'♡'}</div>
      <div class="item-content"><div class="name">${esc(memberName(v.memberId))}${v.star?' ★':''}</div>
      <div class="desc">${esc(shortDate(v.date))} · ${esc(v.visitor||'未填写同工')}</div>
      ${v.log?`<div class="desc">${fold(v.log)}</div>`:''}</div>
      <button type="button" class="btn plain mini" data-action="edit-visit" data-id="${esc(v.id)}">编辑</button>
    </div>`).join('')}</div>`;
}
function homePage(){
  const s=stats(),a=attendanceStats(),week=currentWeekRange();
  const weekVisits=semesterVisits().filter(v=>inside(v.date,week)).length;
  const needs=activeMembers().map(m=>{
    const last=latestVisit(m.id),att=memberAttendance(m.id);
    const days=last?Math.floor((dateObj(today())-dateObj(last.date))/86400000):999;
    const score=(!last?4:days>=28?3:days>=14?1:0)+((att.p+att.a)>=3&&(att.rate??100)<50?2:0);
    return {m,last,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,4);

  return `
    ${backupReminder()}
    ${!state.settings.configured?`<div class="notice">先设置学期日期与每人探访目标，再添加成员。</div>`:''}
    <div class="hero">
      <div class="muted">${esc(state.settings.semesterName)} · 探访目标</div>
      <div class="between" style="margin-top:13px">
        <div><div class="muted">完成率</div><div class="big">${Math.round(s.progress)}%</div></div>
        <div style="text-align:right"><div class="muted">已完成 / 总目标</div><div style="font-size:22px;font-weight:800">${s.done} / ${s.total}</div></div>
      </div>
      <div class="progress"><div style="width:${s.progress}%"></div></div>
      <div class="between muted"><span>还需 ${s.remaining} 次</span><span>${esc(shortDate(semester().start))}—${esc(shortDate(semester().end))}</span></div>
    </div>
    <div class="grid">
      <div class="metric"><div class="metric-label">本周探访</div><div class="metric-value">${weekVisits} 次</div><div class="metric-foot">平均每周 ${s.perWeek.toFixed(1)} 次</div></div>
      <div class="metric"><div class="metric-label">整体出勤率</div><div class="metric-value">${a.meetings?pctText(a.p,a.p+a.a):'—'}</div><div class="metric-foot">${a.meetings} 场 · ${a.p} 人次出席</div></div>
    </div>
    <section class="section">
      <div class="head"><h2>快速记录</h2></div>
      <div class="quick">
        <button type="button" data-action="new-visit"><div class="quick-icon">＋♡</div><div class="quick-label">记探访</div></button>
        <button type="button" data-action="nav" data-tab="attendance"><div class="quick-icon">✓</div><div class="quick-label">登记出勤</div></button>
        <button type="button" data-action="current-week"><div class="quick-icon">＋≡</div><div class="quick-label">写周报</div></button>
      </div>
    </section>
    <section class="section">
      <div class="head"><h2>需要留意</h2><span class="badge">${needs.length} 位</span></div>
      ${needs.length?`<div class="card list">${needs.map(({m,last,score})=>`
        <button type="button" class="item" style="width:100%;text-align:left;background:white;border:0" data-action="profile" data-id="${esc(m.id)}">
          <div class="avatar">${esc(initials(m.name))}</div>
          <div class="item-content"><div class="name">${esc(m.name)} ${score>=4?'<span class="badge orange">待关怀</span>':''}</div>
          <div class="desc">${last?'上次探访 '+esc(shortDate(last.date)):'尚无探访记录'}</div></div><span>›</span>
        </button>`).join('')}</div>`:`<div class="card empty"><p>暂无明显的待跟进提醒</p></div>`}
    </section>
    <section class="section"><div class="head"><h2>最近探访</h2><button type="button" class="text-btn" data-action="nav" data-tab="visits">全部 ›</button></div>${recentVisits(3)}</section>
  `;
}

/* ---------- 探访 ---------- */
function visitPulse(s){
  if(!s.total)return `<div class="notice" data-tour="visit-pulse">还没有成员或探访目标，设置后再来看本周 / 本月提醒。</div>`;
  const week=currentWeekRange();
  const weekActual=state.visits.filter(v=>inside(v.date,week)).length;
  const weekTarget=round1(s.perWeek);
  const t=dateObj(today());
  const mS=iso(new Date(t.getFullYear(),t.getMonth(),1));
  const mE=iso(new Date(t.getFullYear(),t.getMonth()+1,0));
  const monthActual=state.visits.filter(v=>inside(v.date,{start:mS,end:mE})).length;
  const monthTarget=round1(s.perMonth);
  return `<div class="grid" style="margin-bottom:10px" data-tour="visit-pulse">
    ${pulseCard('本周探访',weekActual,weekTarget,shortDate(week.start)+'—'+shortDate(week.end))}
    ${pulseCard('本月探访',monthActual,monthTarget,shortDate(mS)+'—'+shortDate(mE))}
  </div>`;
}
function pulseCard(title,actual,target,range){
  const ok=target>0&&actual+1e-9>=target;
  const w=target>0?Math.min(100,actual/target*100):0;
  const cls=target<=0?'':(ok?'good':'bad');
  let tag='暂无目标';
  if(target>0){
    tag=ok?(actual>target?`✓ 已达标（超出 ${round1(actual-target)} 次）`:'✓ 已达标'):`✕ 未达标 · 还差 ${round1(target-actual)} 次`;
  }
  return `<div class="pulse-card ${cls}">
    <div class="pulse-title"><span>${esc(title)}</span><span>${esc(range)}</span></div>
    <div class="pulse-num">${actual}<span> / ${target} 次</span></div>
    <div class="progress"><div style="width:${w}%"></div></div>
    <div class="pulse-tag">${tag}</div>
  </div>`;
}
function visitGroups(){
  const groups=realCats().map(c=>({
    id:c.id,name:c.name,
    members:activeMembers().filter(m=>(m.categoryIds||[]).includes(c.id))
  })).filter(g=>g.members.length);
  const un=activeMembers().filter(m=>!hasAnyCat(m));
  if(un.length)groups.push({id:'uncat',name:'未分类',members:un});
  return groups;
}
function memberProgressRow(m){
  const t=targetFor(m),n=memberVisits(m.id).length,done=Math.min(t,n);
  return `<div class="item"><div class="avatar">${esc(initials(m.name))}</div>
    <div class="item-content"><div class="name">${esc(m.name)}</div><div class="desc">实际 ${n} 次</div>
    <div class="progress"><div style="width:${t?done/t*100:0}%"></div></div></div>
    <div style="font-weight:750">${done}/${t}</div>
    <button type="button" class="btn plain mini" data-action="new-visit" data-member="${esc(m.id)}">探访</button></div>`;
}
function visitsPage(){
  const s=stats(),vs=semesterVisits().slice().sort((a,b)=>b.date.localeCompare(a.date));
  const stars=vs.filter(v=>v.star);
  const groups=visitGroups();
  const shownStars=starsExpanded?stars:stars.slice(0,3);
  const shownVisits=visitsExpanded?vs:vs.slice(0,3);
  return `
    <div class="head" style="margin-top:7px"><div><h1>探访计划</h1><div class="muted">${esc(state.settings.semesterName)}</div></div><button type="button" class="btn primary" data-action="new-visit" data-tour="new-visit">＋ 记录</button></div>
    ${visitPulse(s)}
    <div class="card">
      <div class="between"><span class="muted">目标完成</span><span class="badge green">${Math.round(s.progress)}%</span></div>
      <div style="font-size:29px;font-weight:800;margin-top:5px">${s.done}<span class="muted"> / ${s.total} 次</span></div>
      <div class="progress"><div style="width:${s.progress}%"></div></div>
      <div class="grid">
        <div><div class="muted">尚需完成</div><div style="font-size:21px;font-weight:800">${s.remaining}</div></div>
        <div><div class="muted">平均每周 / 每月</div><div style="font-weight:750">${s.perWeek.toFixed(1)} / ${s.perMonth.toFixed(1)} 次</div></div>
      </div>
      <div class="muted" style="margin-top:12px">目标优先级：个人设置 &gt; 指定分类 &gt; 唯一分类 &gt; 学期默认。</div>
      <button type="button" class="text-btn" data-action="settings">修改默认目标 ›</button>
    </div>
    <section class="section">
      <div class="head"><h2>成员进度</h2><span class="muted">按分类 · ${activeMembers().length} 位</span></div>
      ${groups.length?groups.map(g=>{
        const total=g.members.reduce((n,m)=>n+targetFor(m),0);
        const done=g.members.reduce((n,m)=>n+Math.min(targetFor(m),memberVisits(m.id).length),0);
        const pct=total?Math.round(done/total*100):0;
        const isOpen=expandedGroups.has(g.id);
        const shown=isOpen?g.members:g.members.slice(0,6);
        const more=g.members.length-shown.length;
        return `<details class="week" style="background:#fff">
          <summary>
            <div class="week-head">
              <div><b>${esc(g.name)}</b><div class="desc">${g.members.length} 位 · 完成 ${done}/${total}</div></div>
              <span class="muted">${pct}%　⌄</span>
            </div>
            <div class="progress" style="margin:8px 0 0"><div style="width:${pct}%"></div></div>
          </summary>
          <div class="details-body">
            ${shown.map(memberProgressRow).join('')}
            ${more>0?`<button type="button" class="text-btn" data-action="expand-group" data-id="${esc(g.id)}">展开全部 ${g.members.length} 位 ›</button>`:''}
            ${isOpen&&g.members.length>6?`<button type="button" class="text-btn" data-action="collapse-group" data-id="${esc(g.id)}">收起 ›</button>`:''}
          </div>
        </details>`;
      }).join(''):`<div class="card empty"><p>先添加成员并设置目标</p><button type="button" class="btn soft" data-action="nav" data-tab="members">添加成员</button></div>`}
      <div class="muted">成员可同时属于多个分类，因此可能出现在多个分组中。</div>
    </section>
    <section class="section"><div class="head"><h2>重点跟进</h2><span class="badge orange">${stars.length}</span></div>
      ${stars.length?`<div class="card list">${shownStars.map(v=>visitItem(v)).join('')}</div>
        ${stars.length>3?`<div style="text-align:center;margin-top:6px"><button type="button" class="text-btn" data-action="toggle-stars">${starsExpanded?'收起':'展开全部 '+stars.length+' 条 ›'}</button></div>`:''}`
      :`<div class="card empty"><p>点亮探访记录的星标，即可在这里查看</p></div>`}
    </section>
    <section class="section"><div class="head"><h2>探访记录</h2><span class="muted">${vs.length} 条</span></div>
      ${vs.length?`<div class="card list">${shownVisits.map(v=>visitItem(v)).join('')}</div>
        ${vs.length>3?`<div style="text-align:center;margin-top:6px"><button type="button" class="text-btn" data-action="toggle-visits">${visitsExpanded?'收起':'展开全部 '+vs.length+' 条 ›'}</button></div>`:''}`
      :`<div class="card empty"><p>尚无探访记录</p></div>`}
    </section>`;
}
function visitItem(v){
  return `<div class="item"><div class="avatar">${v.star?'★':'♡'}</div><div class="item-content">
    <div class="name">${esc(memberName(v.memberId))} ${v.star?'<span style="color:#ad813b">★</span>':''}</div>
    <div class="desc">${esc(dateText(v.date))} · ${esc(v.visitor||'未填写同工')}</div>
    ${v.log?`<div class="desc">${fold(v.log)}</div>`:''}</div>
    <button type="button" class="btn plain mini" data-action="edit-visit" data-id="${esc(v.id)}">编辑</button>
    <button type="button" class="btn plain mini" data-action="star-visit" data-id="${esc(v.id)}">${v.star?'取消星标':'☆'}</button>
  </div>`;
}

function attendanceRegister(){
  const meetings=attendanceWeeks(),a=attendanceStats(),active=selectedMeeting(),all=activeMembers();

/* ---------- 成员 ---------- */
function filteredMembers(){
  let list=state.members.filter(m=>archivedFilter?m.archived:!m.archived);
  if(categoryFilter!=='all'){
    if(categoryFilter==='uncategorized'){
      list=list.filter(m=>!hasAnyCat(m));
    }else{
      list=list.filter(m=>(m.categoryIds||[]).includes(categoryFilter));
    }
  }
  const q=query.trim().toLowerCase();
  if(q)list=list.filter(m=>[m.name,m.phone,m.school,m.className,m.dorm,m.note,categoryNames(m)].some(v=>String(v||'').toLowerCase().includes(q)));
  const dir=memberSortDir==='asc'?1:-1;
  const rateOf=m=>{const x=memberAttendance(m.id);return x.rate==null?-1:x.rate};
  const visited=m=>memberVisits(m.id).length;
  const targetRate=m=>{const t=targetFor(m);return t?Math.min(t,visited(m))/t*100:0};
  const latest=m=>latestVisit(m.id)?.date||'';
  list=list.slice().sort((a,b)=>{
    let r=0;
    switch(memberSort){
      case 'visits':r=visited(a)-visited(b);break;
      case 'visitRate':r=targetRate(a)-targetRate(b);break;
      case 'attendRate':r=rateOf(a)-rateOf(b);break;
      case 'present':r=memberAttendance(a.id).p-memberAttendance(b.id).p;break;
      case 'recent':r=(latest(a)||'').localeCompare(latest(b)||'');break;
      default:r=0;
    }
    if(r!==0)return r*dir;
    return a.name.localeCompare(b.name,'zh');
  });
  return list;
}
function memberListHTML(){
  const list=filteredMembers();
  if(!list.length){
    const hasQuery=query.trim().length>0;
    if(hasQuery){
      return `<div class="card empty"><div class="empty-icon">♙</div><p>没有找到匹配成员</p><button type="button" class="btn soft" data-action="new-member">添加成员</button></div>`;
    }
    const isEmptyCat=categoryFilter!=='all'&&categoryFilter!=='uncategorized'&&!archivedFilter;
    if(isEmptyCat&&state.members.some(m=>!m.archived)){
      return `<div class="card empty"><div class="empty-icon">♙</div><p>这个分类还没有成员</p><button type="button" class="btn soft" data-action="pick-members-from-page" data-id="${esc(categoryFilter)}">选择成员</button></div>`;
    }
    return `<div class="card empty"><div class="empty-icon">♙</div><p>还没有成员档案</p><button type="button" class="btn soft" data-action="new-member">添加成员</button></div>`;
  }
  return `<div class="card list">${list.map(m=>{
    const t=targetFor(m),n=memberVisits(m.id).length,a=memberAttendance(m.id),last=latestVisit(m.id);
    return `<button type="button" class="item" style="width:100%;text-align:left;background:white;border:0" data-action="profile" data-id="${esc(m.id)}">
      <div class="avatar">${esc(initials(m.name))}</div><div class="item-content">
      <div class="name">${esc(m.name)} ${m.archived?'<span class="badge">已归档</span>':''}</div>
      <div class="desc">${esc(categoryNames(m))}</div>
      <div class="desc">探访 ${Math.min(t,n)}/${t}（实际 ${n}） · 出勤 ${a.p+a.a?pctText(a.p,a.p+a.a):'—'} · ${last?esc(shortDate(last.date)):'暂无探访'}</div>

    </button>`;
  }).join('')}</div>`;
}

/* ---------- 周报 ---------- */
function weeklyPage(){
  const weeks=buildWeeks(semester()),todayStr=today();
  const groups={};
  weeks.forEach(w=>{const k=w.start.slice(0,7);(groups[k]||(groups[k]=[])).push(w)});
  const cur=weeks.find(w=>inside(todayStr,w));
  const curMonth=cur?.start.slice(0,7);
  return `
    <div class="head" style="margin-top:7px"><div><h1>每周日志</h1><div class="muted">自动汇总探访与聚会记录</div></div><button type="button" class="btn soft" data-action="current-week">本周</button></div>
    <div data-tour="weekly">
    ${Object.keys(groups).length?Object.entries(groups).map(([month,ws])=>`
      <details>
        <summary ${month===curMonth?'style="background:#eef5ef"':''}><div class="month-head"><span>${Number(month.slice(5,7))} 月 ${month===curMonth?'<span class="badge green">本周</span>':''}</span><span class="muted">${ws.length} 周　⌄</span></div></summary>
        <div class="details-body">
          ${ws.map(w=>{
            const log=state.weeklyLogs.find(l=>l.weekStart===w.start)||{};
            const vs=state.visits.filter(v=>inside(v.date,w));
            const ms=state.meetings.filter(m=>inside(m.weekStart||m.date,w));
            const active=inside(todayStr,w);
            return `<details class="week">
              <summary><div class="week-head"><div><b>${esc(shortDate(w.start))}—${esc(shortDate(w.end))}</b> ${active?'<span class="badge green">本周</span>':''}<div class="desc">探访 ${vs.length} 次 · 聚会 ${ms.length} 场</div></div><span class="muted">${log.summary?'已记录':'待填写'}　⌄</span></div></summary>
              <div class="details-body">
                ${vs.length?`<div class="muted">本周探访</div>${vs.map(v=>`<div class="item"><div class="avatar">${v.star?'★':'♡'}</div><div class="item-content"><div class="name">${esc(memberName(v.memberId))}</div><div class="desc">${esc(shortDate(v.date))} · ${esc(v.visitor||'')}</div></div></div>`).join('')}`:`<div class="muted">本周尚无探访记录</div>`}
                ${ms.length?`<div class="muted" style="margin-top:10px">本周聚会</div>${ms.map(m=>`<div class="desc">${esc(shortDate(m.date))} · ${esc(m.label||'聚会')}</div>`).join('')}`:''}
                <form data-form="save-week" data-start="${esc(w.start)}" class="week-form">
                  <label class="field">工作总结<textarea name="summary" placeholder="本周完成了什么？">${esc(log.summary||'')}</textarea></label>
                  <label class="field">需要跟进<textarea name="concerns" placeholder="哪些成员需要继续关怀？">${esc(log.concerns||'')}</textarea></label>
                  <label class="field">下周计划<textarea name="next" placeholder="下一步行动">${esc(log.next||'')}</textarea></label>
                  <button type="submit" class="btn primary block">保存周报</button>
                </form>
              </div>
            </details>`;
          }).join('')}
        </div>
      </details>
    `).join(''):`<div class="card empty"><p>请先设置学期日期</p><button type="button" class="btn soft" data-action="settings">设置日期</button></div>`}
    </div>`;
}

function updateTargetPreview(form){
  const box=form.querySelector('#target-preview');
  if(!box)return;
  const ids=[...form.querySelectorAll('input[name="categoryIds"]:checked')].map(x=>x.value);
  const overrideVal=form.querySelector('[name="targetOverride"]').value;
  const defaultTarget=Math.max(0,Number(state.settings.defaultTarget)||0);
  const cats=ids.map(id=>state.categories.find(c=>c.id===id)).filter(c=>c&&c.target!=null&&c.target!=='');
  let html='';
  if(overrideVal!==''){
    html=`生效目标：<b>${Math.max(0,Number(overrideVal)||0)} 次</b>（个人设置）`;
  }else if(!cats.length){
    html=`生效目标：<b>${defaultTarget} 次</b>（学期默认）`;
  }else if(cats.length===1){
    html=`生效目标：<b>${Math.max(0,Number(cats[0].target)||0)} 次</b>（分类「${esc(cats[0].name)}」）`;
  }else{
    const uniq=[...new Set(cats.map(c=>Number(c.target)||0))];
    if(uniq.length===1){
      html=`生效目标：<b>${uniq[0]} 次</b>（多个分类，目标一致）`;
    }else{
      const oldSel=form.querySelector('[name="targetCategoryId"]')?.value||'';
      html=`<div style="margin-bottom:6px">多个分类目标不同，请选择以哪个分类为准：</div>
        <select name="targetCategoryId">
          ${cats.map(c=>`<option value="${esc(c.id)}" ${oldSel===c.id?'selected':''}>分类「${esc(c.name)}」 → ${Math.max(0,Number(c.target)||0)} 次</option>`).join('')}
        </select>`;
    }
  }
  box.innerHTML=html;
}

function visitorPickerHTML(q){
  const s=(q||'').trim().toLowerCase();

    .filter(m=>!s||[m.name,m.phone,m.school].some(v=>String(v||'').toLowerCase().includes(s)))
    .sort((a,b)=>{
      const ca=counts[a.name]||0,cb=counts[b.name]||0;

      return a.name.localeCompare(b.name,'zh');

function ringSVG(rate,size=64){
  const r=(size-10)/2, c=2*Math.PI*r;
  const v=rate==null?0:Math.max(0,Math.min(100,rate));
  const off=c*(1-v/100);
  return `<svg class="ring" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#ecefe9" stroke-width="7"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#285c46" stroke-width="7"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
      transform="rotate(-90 ${size/2} ${size/2})"/>
    <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#285c46">${rate==null?'—':rate.toFixed(1)+'%'}</text>
  </svg>`;
}
function profile(id){
  const m=state.members.find(x=>x.id===id);
  if(!m)return;
  const vs=memberVisits(m.id).sort((a,b)=>b.date.localeCompare(a.date));
  const a=memberAttendance(m.id),ti=targetInfo(m),t=ti.value;
  const trend=memberTrend(m.id,12);
  const done=Math.min(t,vs.length);
  const remain=t>0?Math.max(0,t-vs.length):0;
  const over=t>0&&vs.length>t?vs.length-t:0;
  return openModal(`
    <div class="sheet-head"><h2>成员档案</h2><button type="button" class="close" data-action="close">×</button></div>
    <div class="card"><div class="row"><div class="avatar" style="width:50px;height:50px">${esc(initials(m.name))}</div><div class="flex1"><div style="font-size:20px;font-weight:800">${esc(m.name)}</div><div class="muted">${esc(categoryNames(m))}</div></div><button type="button" class="btn soft mini" data-action="edit-member" data-id="${esc(m.id)}">编辑</button></div>
      <hr>
      <div class="grid">
        <div><div class="muted">探访完成</div><b style="font-size:22px">${done}/${t}</b><div class="muted" style="font-size:10px">实际 ${vs.length} 次 · ${esc(ti.source)}</div></div>
        <div style="display:flex;align-items:center;gap:10px">${ringSVG(a.rate)}<div><div class="muted">出勤率</div><div class="muted" style="font-size:10px">出席 ${a.p} · 未出席 ${a.a}</div></div></div>
      </div>
    </div>
    <div class="card"><h3>近期出勤趋势</h3>
      ${trend.length?`<div class="chart-bars" style="height:120px;padding-top:20px">
        ${trend.map(w=>{
          const h=w.value==null?2:w.value;
          return `<div class="bar-col"><div class="bar ${w.value==null?'empty':''}" style="height:${Math.max(2,h)}%"><span class="bar-val">${w.value==null?'—':w.value}</span></div><div class="bar-x">${esc(w.label)}</div></div>`;
        }).join('')}
      </div><div class="legend"><span><i style="background:#285c46"></i>100=出席</span><span><i style="background:#dfe5de"></i>无记录</span></div>`
      :'<div class="muted">暂无出勤记录</div>'}
    </div>
    <div class="card"><h3>基本资料</h3>${[['电话',m.phone],['学校',m.school],['班级',m.className],['寝室',m.dorm],['受洗',m.baptized==='yes'?'已受洗':m.baptized==='no'?'未受洗':'未记录'],['恩赐',m.gifts],['备注',m.note]].filter(x=>x[1]).map(x=>`<div class="item"><span class="muted" style="width:55px">${esc(x[0])}</span><span class="flex1">${fold(x[1])}</span></div>`).join('')||'<div class="muted">暂无其他资料</div>'}</div>
    <div class="head"><h3>探访记录</h3><button type="button" class="btn soft mini" data-action="new-visit" data-member="${esc(m.id)}">＋ 探访</button></div>
    <div class="card" style="margin-bottom:10px">
      <div class="between"><span class="muted">探访目标进度</span><b>${done}/${t}</b></div>
      <div class="progress" style="margin:8px 0 4px"><div style="width:${t?done/t*100:0}%"></div></div>
      <div class="muted" style="font-size:11px">${t===0?'未设置目标':(over>0?`已达标，超出 ${over} 次`:(remain>0?`还差 ${remain} 次`:'已达标'))}</div>
    </div>
    <div class="card list">${vs.length?vs.slice(0,8).map(v=>`<div class="item"><div class="avatar">${v.star?'★':'♡'}</div><div class="item-content"><div class="name">${esc(dateText(v.date))} ${v.star?'★':''}</div><div class="desc">${esc(v.visitor||'')}</div><div class="desc">${fold(v.log)}</div></div></div>`).join(''):'<div class="empty"><p>尚无探访记录</p></div>'}</div>
    <div class="card"><h3>出勤统计</h3><div class="muted">出席 ${a.p} 次 · 未出席 ${a.a} 次 · 未标记 ${a.un} 次</div><div class="progress"><div style="width:${a.rate==null?0:a.rate}%"></div></div></div>
    <div class="row">
      <button type="button" class="btn plain flex1" data-action="${m.archived?'restore-member':'archive-member'}" data-id="${esc(m.id)}">${m.archived?'恢复成员':'归档成员'}</button>

    </div>
    <p class="muted" style="margin-top:10px">归档保留历史；彻底删除会移除关联记录。</p>
  `);
}

document.addEventListener('click',e=>{
  const pv=e.target.closest('[data-pick-visitor]');
  if(pv){
    const name=pv.dataset.pickVisitor;
    const input=document.querySelector('form[data-form="visit"] [name="visitor"]');
    if(input){
      const cur=input.value.split(/[、,，]/).map(s=>s.trim()).filter(Boolean);
      if(cur.includes(name)){say('该同工已在列表中')}
      else{cur.push(name);input.value=cur.join('、');say('已加入 '+name)}
    }
    return;
  }
  const pm=e.target.closest('[data-pick-member]');
  if(pm){
    if(pm.disabled)return;
    const id=pm.dataset.pickMember;
    if(selectedPick.has(id))selectedPick.delete(id);
    else selectedPick.add(id);
    const list=$('#pick-list');
    if(list)list.innerHTML=pickListHTML(document.querySelector('[data-action="save-pick"]')?.dataset.id||'', $('#pick-search')?.value||'');
    return;
  }
  const pvm=e.target.closest('[data-pick-visit-member]');
  if(pvm){
    const id=pvm.dataset.pickVisitMember;
    const input=$('#visit-member-id');
    if(input)input.value=id;
    const list=$('#visit-member-list');
    if(list)list.innerHTML=visitMemberListHTML($('#visit-member-search')?.value||'',id);
    updatePickedMemberHint();
    return;
  }

  const b=e.target.closest('[data-action]');
  if(!b)return;
  const a=b.dataset.action,id=b.dataset.id||'';

  if(a==='toggle-text'){b.classList.toggle('open');e.preventDefault();return}
  if(a==='nav'){tab=b.dataset.tab;resetExpanded();closeModal();render();window.scrollTo(0,0);return}
  if(a==='settings'){tab='settings';resetExpanded();closeModal();render();window.scrollTo(0,0);return}
  if(a==='close'){closeModal();return}
  if(a==='dismiss-backup'){state.settings.dismissBackupReminder=today();save();render();return}
  if(a==='att-view'){attView=b.dataset.view;render();return}
  if(a==='analysis-quick'){
    const r=b.dataset.range;
    if(r==='week'){const w=currentWeekRange();analysisRange={start:w.start,end:w.end}}
    else if(r==='month'){const t=dateObj(today());const s=iso(new Date(t.getFullYear(),t.getMonth(),1));const en=iso(new Date(t.getFullYear(),t.getMonth()+1,0));analysisRange={start:s,end:en}}
    else{analysisRange={start:semester().start,end:semester().end}}
    render();return;
  }
  if(a==='toggle-sort-dir'){memberSortDir=memberSortDir==='desc'?'asc':'desc';render();return}
  if(a==='toggle-stars'){starsExpanded=!starsExpanded;render();return}
  if(a==='toggle-visits'){visitsExpanded=!visitsExpanded;render();return}
  if(a==='toggle-per-rate'){perRateExpanded=!perRateExpanded;render();return}
  if(a==='expand-group'){expandedGroups.add(id);render();return}
  if(a==='collapse-group'){expandedGroups.delete(id);render();return}
  if(a==='manage-categories'){pickFromManage=false;categoryManage();return}
  if(a==='pick-members'){pickFromManage=true;pickMembersForCategory(id);return}
  if(a==='pick-members-from-page'){pickFromManage=false;pickMembersForCategory(id);return}
  if(a==='clear-visit-member'){
    const input=$('#visit-member-id');
    if(input)input.value='';
    const list=$('#visit-member-list');
    if(list)list.innerHTML=visitMemberListHTML($('#visit-member-search')?.value||'','');
    updatePickedMemberHint();
    return;
  }
  if(a==='save-pick'){
    const c=state.categories.find(x=>x.id===id);
    if(!c){say('分类不存在');return}
    let added=0,skipped=0;
    [...selectedPick].forEach(mid=>{
      const m=state.members.find(x=>x.id===mid);
      if(!m)return;
      if((m.categoryIds||[]).includes(id)){skipped++;return}
      m.categoryIds=[...(m.categoryIds||[]),id];
      added++;
    });
    save();
    say(`已加入 ${added} 位${skipped?`，跳过 ${skipped} 位已在分类中的成员`:''}`);
    if(!added&&!skipped)say('没有选择成员');
    if(pickFromManage){pickFromManage=false;categoryManage();}
    else{closeModal();render();}
    return;
  }
  if(a==='new-member'){memberForm();return}
  if(a==='edit-member'){memberForm(id);return}
  if(a==='profile'){profile(id);return}
  if(a==='new-visit'){visitForm(b.dataset.member||'');return}
  if(a==='edit-visit'){visitForm('',id);return}
  if(a==='new-category'){categoryForm();return}
  if(a==='edit-category'){categoryForm(id);return}
  if(a==='category-filter'){categoryFilter=id;render();return}
  if(a==='archived'){archivedFilter=!archivedFilter;render();return}
  if(a==='current-week'){
    tab='weekly';render();
    const target=[...document.querySelectorAll('.week')].find(x=>x.open);
    if(target)target.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  if(a==='toggle-visitor-picker'){
    const box=$('#visitor-picker');
    if(!box)return;
    const show=box.style.display==='none';
    box.style.display=show?'block':'none';
    if(show){const list=$('#visitor-list');if(list)list.innerHTML=visitorPickerHTML('')}
    return;
  }
  if(a==='star-visit'){
    const v=state.visits.find(x=>x.id===id);
    if(v){v.star=!v.star;save();render();say(v.star?'已标记跟进':'已取消星标')}
    return;
  }
  if(a==='attendance-status'){
    const mt=state.meetings.find(x=>x.id===b.dataset.meeting);
    if(mt){
      mt.records=mt.records||{};
      if(b.dataset.status)mt.records[b.dataset.member]=b.dataset.status;
      else delete mt.records[b.dataset.member];
      save();render();
    }
    return;
  }
  if(a==='delete-meeting'){
    const mt=state.meetings.find(x=>x.id===id);
    if(!mt)return;
    if(confirm('删除本周出勤场次？该场的出勤记录也会删除。')){
      state.settings.deletedAttendanceWeeks.push(mt.weekStart||mt.date);
      state.meetings=state.meetings.filter(x=>x.id!==id);
      state.settings.activeAttendanceWeek='';
      save();render();say('本场已删除');
    }
    return;
  }
  if(a==='archive-member'||a==='restore-member'){
    const m=state.members.find(x=>x.id===id);
    if(m){m.archived=a==='archive-member';save();closeModal();render();say(m.archived?'已归档':'已恢复')}
    return;
  }
  if(a==='delete-member'){
    const m=state.members.find(x=>x.id===id);
    if(!m)return;
    if(confirm(`彻底删除「${m.name}」及其探访和出勤记录？此操作不可撤销。`)){
      state.members=state.members.filter(x=>x.id!==id);
      state.visits=state.visits.filter(v=>v.memberId!==id);
      state.meetings.forEach(mt=>{if(mt.records)delete mt.records[id]});
      save();closeModal();render();say('成员已删除');
    }
    return;
  }
  if(a==='delete-category'){
    const c=state.categories.find(x=>x.id===id);
    if(!c||c.virtual)return;
    if(confirm(`删除分类「${c.name}」？使用该分类目标的成员将回落到学期默认目标。成员档案和历史记录会保留。`)){
      state.categories=state.categories.filter(x=>x.id!==id);
      state.members.forEach(m=>{
        m.categoryIds=(m.categoryIds||[]).filter(x=>x!==id);
        if(m.targetCategoryId===id)m.targetCategoryId=null;
      });
      if(categoryFilter===id)categoryFilter='all';
      save();
      if($('#modal').classList.contains('open'))categoryManage();
      else render();
      say('分类已删除');
    }
    return;
  }
  if(a==='export'){exportBackup();return}
  if(a==='import'){importBackup();return}
  if(a==='start-tour'){closeModal();startTour();return}
});

document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');
  if(!f)return;
  e.preventDefault();
  const fd=new FormData(f);
  const d=Object.fromEntries(fd.entries());

  if(f.dataset.form==='settings'){
    if(!d.start||!d.end||d.start>d.end){say('请检查学期日期');return}
    state.settings.semesterName=(d.semesterName||'本学期').trim();
    state.settings.startDate=d.start;
    state.settings.endDate=d.end;
    state.settings.defaultTarget=Math.max(0,Number(d.defaultTarget)||0);
    state.settings.configured=true;
    save();
    tab=activeMembers().length?'home':'members';
    render();window.scrollTo(0,0);say('设置已保存');return;
  }

  if(f.dataset.form==='member'){
    const id=f.dataset.id;
    const old=state.members.find(m=>m.id===id);
    const name=(d.name||'').trim();
    if(!name){say('请填写姓名');return}
    const dup=state.members.some(x=>x.id!==id&&!x.archived&&x.name===name);
    if(dup&&!confirm(`已存在同名成员「${name}」，仍要保存吗？`))return;
    let categoryIds=fd.getAll('categoryIds').filter(cid=>state.categories.some(c=>c.id===cid&&!c.virtual));
    const m={
      ...(old||{}),id:id||uid(),name,categoryIds,
      targetOverride:d.targetOverride===''?null:Math.max(0,Number(d.targetOverride)),
      targetCategoryId:d.targetCategoryId||null,
      phone:(d.phone||'').trim(),school:(d.school||'').trim(),
      className:(d.className||'').trim(),dorm:(d.dorm||'').trim(),
      baptized:d.baptized||'unknown',gifts:(d.gifts||'').trim(),
      note:(d.note||'').trim(),archived:old?.archived||false
    };
    if(old)state.members=state.members.map(x=>x.id===id?m:x);
    else state.members.push(m);
    state.settings.configured=true;
    save();closeModal();render();say(old?'成员已更新':'成员已添加');return;
  }

  if(f.dataset.form==='visit'){
    if(!d.memberId){say('请选择被探访成员');return}
    const id=f.dataset.id;
    const old=state.visits.find(v=>v.id===id);
    const v={
      ...(old||{}),id:id||uid(),date:d.date||today(),
      memberId:d.memberId,visitor:(d.visitor||'').trim(),
      log:(d.log||'').trim(),star:fd.has('star')
    };
    if(old)state.visits=state.visits.map(x=>x.id===id?v:x);
    else state.visits.push(v);
    save();closeModal();render();say('探访记录已保存');return;
  }

  if(f.dataset.form==='category'){
    const name=(d.name||'').trim();
    if(!name){say('请填写分类名称');return}
    const id=f.dataset.id;
    const target=d.target===''?null:Math.max(0,Number(d.target)||0);
    const c=state.categories.find(x=>x.id===id);
    if(c){c.name=name;c.target=target}
    else state.categories.push({id:uid(),name,target,virtual:false});
    save();
    if($('#modal').classList.contains('open'))categoryManage();
    else render();
    say('分类已保存');
    return;
  }

  if(f.dataset.form==='save-week'){
    const start=f.dataset.start;
    const old=state.weeklyLogs.find(x=>x.weekStart===start);
    const log={
      ...(old||{}),id:old?.id||uid(),weekStart:start,
      summary:(d.summary||'').trim(),concerns:(d.concerns||'').trim(),
      next:(d.next||'').trim(),updatedAt:new Date().toISOString()
    };
    if(old)state.weeklyLogs=state.weeklyLogs.map(x=>x.weekStart===start?log:x);
    else state.weeklyLogs.push(log);
    save();render();say('周报已保存');return;
  }
});

document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.field==='active-week'){state.settings.activeAttendanceWeek=el.value;save();render();return}
  if(el.dataset.field==='meeting-date'){
    const m=state.meetings.find(x=>x.id===el.dataset.id);
    if(m&&el.value){m.date=el.value;save();render();say('日期已更新')}
    return;
  }
  if(el.dataset.field==='cat-target'){
    const c=state.categories.find(x=>x.id===el.dataset.id);
    if(c){
      c.target=el.value===''?null:Math.max(0,Number(el.value)||0);
      save();render();say('分类目标已保存');
    }
    return;
  }
  if(el.dataset.field==='analysis-start'){analysisRange.start=el.value;render();return}
  if(el.dataset.field==='analysis-end'){analysisRange.end=el.value;render();return}
  if(el.dataset.field==='member-sort'){
    memberSort=el.value;
    const box=document.getElementById('member-list');
    if(box)box.innerHTML=memberListHTML();
    return;
  }
});

  if(e.target.dataset.field==='search'){

    if(list)list.innerHTML=visitMemberListHTML(e.target.value, $('#visit-member-id')?.value||'');
  }
});

async function exportBackup(){
  try{
    state.settings.lastBackupAt=today();
    save();
    const bytes=new TextEncoder().encode(JSON.stringify(state));
    let bin='';
    for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
    const code='TXCARE3.'+btoa(bin);
    const area=$('#backup');
    if(area){area.value=code;area.focus();area.select()}
    try{await navigator.clipboard.writeText(code);say('备份码已复制，请妥善保存')}
    catch{say('备份码已生成，请长按文本复制')}
    render();
  }catch{say('生成备份码失败')}
}
function importBackup(){
  const code=($('#backup')?.value||'').trim();
  let body='';
  if(code.startsWith('TXCARE3.'))body=code.slice(8);
  else if(code.startsWith('TXCARE2.'))body=code.slice(8);
  else{say('备份码格式不正确');return}
  if(!confirm('恢复将覆盖当前设备的全部资料。建议先导出当前备份，确定继续吗？'))return;
  try{
    const bin=atob(body);
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const parsed=JSON.parse(new TextDecoder().decode(bytes));
    if(!parsed||!Array.isArray(parsed.members)||!Array.isArray(parsed.visits)||!Array.isArray(parsed.categories))throw Error();
    state=normalize(parsed);
    save();closeModal();tab='home';render();say('数据恢复成功');
  }catch{say('恢复失败，请检查备份码是否完整')}
}

/* ---------- 新手教程 ---------- */
const TOUR=[
  {tab:'settings',sel:'[data-tour="semester"]',title:'① 设置学期',text:'填写学期名称与起止日期，设定每人默认探访目标，然后点下方「保存设置」。这是所有统计的基础。'},
  {tab:'settings',sel:'[data-tour="categories"]',title:'② 分类与分类目标',text:'每个分类可以设置自己的探访目标。成员属于多个分类且目标不同时，编辑成员时会让你选择以哪个分类为准。'},
  {tab:'members',sel:'[data-tour="add-member"]',title:'③ 添加成员',text:'点击这里添加成员，可多选分类。没有加入任何分类的成员会自动归入「未分类」。'},
  {tab:'members',sel:'[data-tour="member-tools"]',title:'④ 管理分类',text:'「⚙ 管理分类」可以批量选择已有成员加入某个分类；已在该分类的成员会显示「已加入」，不会重复添加。'},
  {tab:'visits',sel:'[data-tour="visit-pulse"]',title:'⑤ 本周 / 本月目标提醒',text:'这里实时显示本周和本月探访是否达标。未达标会变红，并提示还差几次；达标变绿。'},
  {tab:'visits',sel:'[data-tour="new-visit"]',title:'⑥ 记录探访',text:'点击「＋ 记录」登记探访。成员和同工都支持搜索，最近高频的会排在前面。日志超过 20 字会自动折叠。'},
  {tab:'attendance',view:'register',sel:'[data-tour="att-week"]',title:'⑦ 选择周次',text:'每周以周日为起点自动生成一场。在这里切换要登记的那一周。'},
  {tab:'attendance',view:'register',sel:'[data-tour="att-list"]',title:'⑧ 登记出勤',text:'每位成员只有「出席 / 未出席」两个有效状态；「未标记」不计入出勤率分母。'},
  {tab:'attendance',view:'analysis',sel:'[data-tour="att-view"]',title:'⑨ 区间出勤分析',text:'切换到「区间分析」，自选起止日期或点本周/本月/本学期，查看趋势、每人出勤率与按分类的明细。'},
  {tab:'weekly',sel:'[data-tour="weekly"]',title:'⑩ 每周日志',text:'按月份与周次折叠，探访与聚会记录自动汇总。当前月份会显示「本周」标记，点击展开填写。'},
  {tab:'settings',sel:'[data-tour="backup"]',title:'⑪ 重要 · 备份',text:'资料完全保存在本机浏览器，不会上传服务器。清理浏览器数据或换设备会导致资料永久丢失且无法找回。请定期「生成并复制备份码」。'}
];
let tourIndex=-1,tourActive=false;
function startTour(){
  tourIndex=0;tourActive=true;
  document.body.classList.add('touring');
  renderTourStep();
}
function endTour(done){
  tourActive=false;
  document.body.classList.remove('touring');
  document.querySelectorAll('.tour-hl').forEach(el=>el.classList.remove('tour-hl'));
  $('#tour-bubble').style.display='none';
  if(done){state.settings.tutorialDone=true;save()}
}
function clearTourHL(){document.querySelectorAll('.tour-hl').forEach(el=>el.classList.remove('tour-hl'))}
function renderTourStep(){
  clearTourHL();
  if(!tourActive)return;
  if(tourIndex<0||tourIndex>=TOUR.length){endTour(true);say('教程完成');return}
  const step=TOUR[tourIndex];
  let needRender=false;
  if(tab!==step.tab){tab=step.tab;needRender=true}
  if(step.tab==='attendance'&&step.view&&attView!==step.view){attView=step.view;needRender=true}
  if(needRender)render();
  requestAnimationFrame(()=>{
    const el=document.querySelector(step.sel);
    const bubble=$('#tour-bubble');
    bubble.style.display='block';
    if(!el){
      bubble.style.top='auto';
      bubble.style.bottom='calc(96px + env(safe-area-inset-bottom))';
      bubble.innerHTML=`
        <h3>${esc(step.title)}</h3>
        <p>这一步需要先完成前面的设置或添加数据。可以先跳过，完成后再从设置页重新观看教程。</p>
        <div class="tour-actions">
          <span class="tour-step">${tourIndex+1} / ${TOUR.length}</span>
          <div class="row">
            <button type="button" class="btn plain mini" data-tour-nav="skip">跳过</button>
            <button type="button" class="btn primary mini" data-tour-nav="next">${tourIndex===TOUR.length-1?'完成':'下一步'}</button>
          </div>
        </div>`;
      return;
    }
    el.scrollIntoView({behavior:'auto',block:'center'});
    el.classList.add('tour-hl');
    const rect=el.getBoundingClientRect();
    if(rect.top>window.innerHeight*0.55){
      bubble.style.bottom='auto';
      bubble.style.top='calc(12px + env(safe-area-inset-top))';
    }else{
      bubble.style.top='auto';
      bubble.style.bottom='calc(96px + env(safe-area-inset-bottom))';
    }
    bubble.innerHTML=`
      <h3>${esc(step.title)}</h3>
      <p>${esc(step.text)}</p>
      <div class="tour-actions">
        <span class="tour-step">${tourIndex+1} / ${TOUR.length}</span>
        <div class="row">
          <button type="button" class="btn plain mini" data-tour-nav="skip">跳过</button>
          ${tourIndex>0?'<button type="button" class="btn plain mini" data-tour-nav="prev">上一步</button>':''}
          <button type="button" class="btn primary mini" data-tour-nav="next">${tourIndex===TOUR.length-1?'完成':'下一步'}</button>
        </div>
      </div>`;
  });
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-tour-nav]');
  if(!b)return;
  e.stopPropagation();
  const n=b.dataset.tourNav;
  if(n==='skip'){endTour(true);return}
  if(n==='prev'){tourIndex=Math.max(0,tourIndex-1);renderTourStep();return}
  if(n==='next'){
    if(tourIndex>=TOUR.length-1){endTour(true);say('教程完成');return}
    tourIndex++;renderTourStep();return;
  }
});
function maybeStartTour(){
  if(tourActive)return;
  if(state.settings.tutorialDone)return;
  if(!state.settings.configured&&tab!=='settings')return;
  setTimeout(()=>{if(!tourActive&&!state.settings.tutorialDone)startTour()},600);
}

render();
if(migrated)say('已从旧版本升级，建议先导出备份码');
setInterval(()=>{$('#today').textContent=shortDate(today())},60000);
