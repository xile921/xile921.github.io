<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="同行">
<title>同行 · 团契关怀</title>
<style>
:root {
  --bg:#f5f6f2;
  --card:#fff;
  --ink:#26332b;
  --muted:#849087;
  --line:#e7ebe5;
  --green:#285c46;
  --green-bg:#e8f1e9;
  --red:#b94d43;
  --orange:#a87835;
  --radius:17px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",
  "PingFang SC","Microsoft YaHei",sans-serif;
}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{
  outline:2px solid #83aa91;outline-offset:2px
}
#app{max-width:560px;margin:auto;min-height:100dvh;padding-bottom:90px}
.top{
  position:sticky;top:0;z-index:5;background:#f5f6f2ed;
  backdrop-filter:blur(14px);padding:12px 17px;
  display:flex;align-items:center;justify-content:space-between
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:36px;height:36px;border-radius:12px;background:var(--green);
  color:white;display:grid;place-items:center;font-size:19px;font-weight:750
}
.brand-name{font-size:19px;font-weight:800;letter-spacing:.5px}
.brand-sub{font-size:9px;color:var(--muted);letter-spacing:1.5px}
.date-now{font-size:12px;color:var(--muted)}
main{padding:7px 15px 22px}
h1{font-size:25px;line-height:1.3;margin:0 0 5px;letter-spacing:-.4px}
h2{font-size:18px;margin:0}
h3{font-size:14px;margin:0 0 10px}
p{margin:0 0 9px}
.muted{font-size:12px;color:var(--muted)}
.small{font-size:12px}
.section{margin-top:23px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}
.card{background:var(--card);border:1px solid #26332b08;border-radius:var(--radius);padding:15px;margin-bottom:10px}
.hero{background:var(--green);color:white;border-radius:22px;padding:21px;margin:7px 0 12px}
.hero .muted{color:#ffffffb9}
.big{font-size:35px;font-weight:800;line-height:1.2}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.metric{background:white;border-radius:16px;padding:15px;min-width:0}
.metric-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.metric-value{font-size:25px;font-weight:800;line-height:1.2}
.metric-foot{font-size:11px;color:var(--muted);margin-top:7px}
.progress{height:6px;border-radius:8px;background:#e9ede7;overflow:hidden;margin:12px 0}
.progress div{height:100%;background:#7eaa8d;border-radius:8px}
.hero .progress{background:#ffffff2b}
.hero .progress div{background:#d7eadb}
.btn{
  border:0;border-radius:11px;padding:10px 14px;font-size:13px;
  font-weight:700;display:inline-flex;align-items:center;
  justify-content:center;gap:5px
}
.primary{background:var(--green);color:white}
.soft{background:var(--green-bg);color:var(--green)}
.plain{background:#f0f2ee;color:var(--ink)}
.danger{background:#fbecea;color:var(--red)}
.mini{padding:7px 9px;font-size:12px;border-radius:9px}
.block{width:100%}
.text-btn{border:0;background:none;color:var(--green);font-weight:700;font-size:13px;padding:6px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.flex1{flex:1;min-width:0}
.badge{font-size:11px;background:#eff2ed;color:#68756a;padding:4px 7px;border-radius:7px;white-space:nowrap}
.badge.green{background:var(--green-bg);color:var(--green)}
.badge.orange{background:#f7efe1;color:var(--orange)}
.badge.red{background:#fbecea;color:var(--red)}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.quick button{background:white;border:1px solid var(--line);border-radius:15px;padding:13px 3px;color:var(--ink)}
.quick-icon{font-size:22px;color:var(--green);margin-bottom:4px}
.quick-label{font-size:12px;font-weight:700}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item-content{flex:1;min-width:0}
.name{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.desc{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.avatar{width:42px;height:42px;flex:0 0 42px;border-radius:13px;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:17px;font-weight:750}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty-icon{font-size:28px;margin-bottom:7px;color:#9bb19e}
.empty p{font-size:12px}
label.field{display:block;font-size:12px;color:#59665c;margin-bottom:13px}
input,select,textarea{
  display:block;width:100%;min-width:0;margin-top:6px;
  padding:11px 12px;border:1px solid #e1e7df;border-radius:11px;
  background:white;color:var(--ink);font-size:16px
}
textarea{min-height:90px;resize:vertical;line-height:1.6}
.field-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.search{position:relative;margin:12px 0}
.search input{padding-left:36px}
.search:before{content:"⌕";position:absolute;left:12px;top:7px;font-size:23px;color:var(--muted)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.chip{flex-shrink:0;border:1px solid var(--line);background:white;color:#687268;border-radius:10px;padding:7px 11px;font-size:12px}
.chip.active{background:var(--green);border-color:var(--green);color:white}
.statuses{display:flex;gap:5px;margin-top:9px}
.status{
  flex:1;border:1px solid var(--line);background:white;color:#7a847b;
  border-radius:8px;padding:8px 1px;font-size:12px
}
.status.active{background:var(--green-bg);border-color:#bed5c4;color:var(--green);font-weight:750}
.status.absent.active{background:#fbecea;color:var(--red);border-color:#efc6c0}
.status.leave.active{background:#f7efe1;color:var(--orange);border-color:#ead8b8}
details{border:1px solid var(--line);border-radius:13px;background:white;margin-bottom:9px;overflow:hidden}
summary{cursor:pointer;list-style:none;padding:13px}
summary::-webkit-details-marker{display:none}
details[open]>summary{border-bottom:1px solid var(--line)}
.details-body{padding:12px}
.week{margin-top:9px;background:#fafbf9}
.week>summary{padding:12px}
.week-form{border-top:1px solid var(--line);padding-top:13px;margin-top:12px}
.month-head{display:flex;justify-content:space-between;gap:10px;font-weight:750}
.week-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:7px}
.check-chip{display:inline-flex;align-items:center;gap:6px;background:#f5f6f2;border-radius:9px;padding:8px 10px;font-size:12px}
.check-chip input{width:17px;height:17px;margin:0;accent-color:var(--green)}
.notice{background:#edf2ec;color:#596c5d;padding:11px 12px;border-radius:11px;font-size:12px;line-height:1.7;margin-bottom:12px}
.bottom{
  position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);
  width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,1fr);
  background:#fffffffa;backdrop-filter:blur(14px);border-top:1px solid var(--line);
  padding:8px 5px calc(8px + env(safe-area-inset-bottom))
}
.nav{border:0;background:transparent;color:#8b948a;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;padding:3px 0}
.nav-icon{font-size:21px;line-height:1.25}
.nav.active{color:var(--green);font-weight:750}
.nav.active .nav-icon{background:var(--green-bg);border-radius:9px;padding:2px 12px}
.modal-root{display:none;position:fixed;inset:0;z-index:30;align-items:flex-end;justify-content:center}
.modal-root.open{display:flex}
.modal-overlay{position:absolute;inset:0;background:#18271e66}
.sheet{
  position:relative;z-index:1;width:100%;max-width:560px;max-height:92dvh;
  overflow-y:auto;background:var(--bg);border-radius:23px 23px 0 0;
  padding:10px 16px calc(22px + env(safe-area-inset-bottom))
}
.handle{width:35px;height:4px;background:#d6dcd4;border-radius:6px;margin:2px auto 15px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:17px}
.sheet-head h2{margin:0}
.close{width:34px;height:34px;border:0;border-radius:50%;background:#e9ece7;font-size:20px}
.rule{border:0;border-top:1px solid var(--line);margin:16px 0}
.toast{position:fixed;z-index:60;bottom:calc(83px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:90vw;background:#263a2d;color:white;padding:11px 16px;border-radius:11px;font-size:13px}
@media(min-width:561px){
  body{padding:15px 0}
  #app{min-height:calc(100dvh - 30px);border-radius:23px;overflow:hidden;box-shadow:0 5px 40px #2030240a}
  .bottom{bottom:15px;border-radius:0 0 23px 23px}
  .sheet{border-radius:23px;margin-bottom:15px}
  .modal-root{align-items:center;padding:15px}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand">
      <div class="logo">同</div>
      <div><div class="brand-name">同行</div><div class="brand-sub">CARE & FELLOWSHIP</div></div>
    </div>
    <div class="row">
      <span class="date-now" id="today"></span>
      <button type="button" class="btn plain mini" data-action="settings">设置</button>
    </div>
  </header>
  <main id="screen"></main>
  <nav class="bottom">
    <button type="button" class="nav" data-action="nav" data-tab="home"><span class="nav-icon">⌂</span>首页</button>
    <button type="button" class="nav" data-action="nav" data-tab="visits"><span class="nav-icon">♡</span>探访</button>
    <button type="button" class="nav" data-action="nav" data-tab="attendance"><span class="nav-icon">✓</span>出勤</button>
    <button type="button" class="nav" data-action="nav" data-tab="members"><span class="nav-icon">♙</span>成员</button>
    <button type="button" class="nav" data-action="nav" data-tab="weekly"><span class="nav-icon">≡</span>周报</button>
  </nav>
</div>
<div class="modal-root" id="modal"></div>
<div id="toast-root"></div>

<script>
'use strict';

const $ = s => document.querySelector(s);
const KEY = 'tongxing_care_v2';

function uid(){
  return globalThis.crypto?.randomUUID
    ? crypto.randomUUID()
    : Date.now().toString(36)+Math.random().toString(36).slice(2);
}
function today(){
  const d=new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function dateObj(s){return new Date((s||today())+'T12:00:00')}
function addDays(s,n){const d=dateObj(s);d.setDate(d.getDate()+n);return iso(d)}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function shortDate(s){if(!s)return '';const d=dateObj(s);return `${d.getMonth()+1}/${d.getDate()}`}
function dateText(s){if(!s)return '';const d=dateObj(s);return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function rangeOK(r){return !!r?.start&&!!r?.end&&r.start<=r.end}
function inside(d,r){return !!d&&rangeOK(r)&&d>=r.start&&d<=r.end}
function daysIn(r){return rangeOK(r)?Math.max(1,Math.round((dateObj(r.end)-dateObj(r.start))/86400000)+1):1}
function weeksIn(r){return Math.max(1,Math.ceil(daysIn(r)/7))}
function weekStarts(r){
  if(!rangeOK(r))return [];
  const out=[];
  for(let d=r.start;d<=r.end&&out.length<100;d=addDays(d,7))out.push(d);
  return out;
}
function fresh(){
  const start=today();
  return {
    version:2,
    settings:{
      configured:false,semesterName:'本学期',startDate:start,
      endDate:addDays(start,111),defaultTarget:2,
      activeAttendanceWeek:'',deletedAttendanceWeeks:[]
    },
    categories:[{id:'uncategorized',name:'未分类'}],
    members:[],visits:[],meetings:[],weeklyLogs:[]
  };
}
function normalize(x){
  const d=fresh();
  if(!x||typeof x!=='object')return d;
  const s={...d,...x};
  s.settings={...d.settings,...(x.settings||{})};
  s.settings.deletedAttendanceWeeks=Array.isArray(s.settings.deletedAttendanceWeeks)?s.settings.deletedAttendanceWeeks:[];
  s.categories=Array.isArray(x.categories)&&x.categories.length?x.categories:d.categories;
  if(!s.categories.some(c=>c.id==='uncategorized'))s.categories.unshift({id:'uncategorized',name:'未分类'});
  s.members=Array.isArray(x.members)?x.members:[];
  s.visits=Array.isArray(x.visits)?x.visits:[];
  s.meetings=Array.isArray(x.meetings)?x.meetings:[];
  s.weeklyLogs=Array.isArray(x.weeklyLogs)?x.weeklyLogs:[];
  s.members.forEach(m=>{if(!Array.isArray(m.categoryIds))m.categoryIds=m.categoryId?[m.categoryId]:['uncategorized']});
  return s;
}
let state;
try{state=normalize(JSON.parse(localStorage.getItem(KEY)||'null'))}catch{state=fresh()}
let tab=state.settings.configured?'home':'settings';
let query='';
let categoryFilter='all';
let archivedFilter=false;
let toastTimer;

function save(){
  try{localStorage.setItem(KEY,JSON.stringify(state))}
  catch{say('本地保存失败，请立即导出备份码')}
}
function say(s){
  $('#toast-root').innerHTML=`<div class="toast">${esc(s)}</div>`;
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>$('#toast-root').innerHTML='',2500);
}
function activeMembers(){return state.members.filter(m=>!m.archived)}
function categoryNames(m){
  const ids=m.categoryIds?.length?m.categoryIds:['uncategorized'];
  return ids.map(id=>state.categories.find(c=>c.id===id)?.name).filter(Boolean).join('、')||'未分类';
}
function targetFor(m){
  const v=m.targetOverride;
  return v!==null&&v!==undefined&&v!==''?Math.max(0,Number(v)||0):Math.max(0,Number(state.settings.defaultTarget)||0);
}
function semester(){return {start:state.settings.startDate,end:state.settings.endDate}}
function moduleRange(){return semester()}
function semesterVisits(){return state.visits.filter(v=>inside(v.date,semester()))}
function memberVisits(id){return semesterVisits().filter(v=>v.memberId===id)}
function latestVisit(id){return state.visits.filter(v=>v.memberId===id).sort((a,b)=>b.date.localeCompare(a.date))[0]||null}
function memberName(id){return state.members.find(m=>m.id===id)?.name||'已删除成员'}
function initials(s){return String(s||'?').trim().slice(0,1)}
function stats(){
  let total=0,done=0;
  activeMembers().forEach(m=>{
    const t=targetFor(m);
    total+=t;
    done+=Math.min(t,memberVisits(m.id).length);
  });
  const r=semester();
  return {
    total,done,remaining:Math.max(0,total-done),
    actual:semesterVisits().length,
    progress:total?Math.min(100,done/total*100):0,
    perWeek:total/weeksIn(r),
    perMonth:total*30.4375/daysIn(r),
    people:activeMembers().length,
    peoplePerWeek:activeMembers().length/weeksIn(r)
  };
}
function attendanceWeeks(){
  return state.meetings.filter(m=>inside(m.weekStart||m.date,semester()))
    .sort((a,b)=>(a.weekStart||a.date).localeCompare(b.weekStart||b.date));
}
function syncWeeks(){
  const range=semester();
  if(!rangeOK(range))return;
  for(const start of weekStarts(range)){
    if(state.settings.deletedAttendanceWeeks.includes(start))continue;
    if(state.meetings.some(m=>(m.weekStart||m.date)===start))continue;
    state.meetings.push({
      id:uid(),weekStart:start,date:start,label:'团契聚会',records:{}
    });
  }
  save();
}
function currentWeekStart(){
  const t=today(),r=semester();
  if(inside(t,r)){
    const n=Math.floor((dateObj(t)-dateObj(r.start))/86400000/7);
    return addDays(r.start,n*7);
  }
  return r.start;
}
function selectedMeeting(){
  const meetings=attendanceWeeks();
  return meetings.find(m=>m.weekStart===state.settings.activeAttendanceWeek)
    ||meetings.find(m=>m.weekStart===currentWeekStart())
    ||meetings[0]||null;
}
function attendanceStats(){
  let p=0,a=0,l=0,un=0;
  const meetings=attendanceWeeks();
  meetings.forEach(mt=>activeMembers().forEach(m=>{
    const v=mt.records?.[m.id]||'unmarked';
    if(v==='present')p++;
    else if(v==='absent')a++;
    else if(v==='leave')l++;
    else un++;
  }));
  return {p,a,l,un,meetings:meetings.length,rate:p+a?p/(p+a)*100:0};
}
function memberAttendance(id){
  let p=0,a=0,l=0;
  attendanceWeeks().forEach(mt=>{
    const v=mt.records?.[id]||'unmarked';
    if(v==='present')p++;
    if(v==='absent')a++;
    if(v==='leave')l++;
  });
  return {p,a,l,rate:p+a?p/(p+a)*100:0,total:p+a+l};
}
function currentWeekRange(){
  const r=semester(),t=today();
  if(inside(t,r)){
    const i=Math.floor((dateObj(t)-dateObj(r.start))/86400000/7);
    const start=addDays(r.start,i*7);
    return {start,end:addDays(start,Math.min(6,Math.round((dateObj(r.end)-dateObj(start))/86400000)) )};
  }
  const d=dateObj(t);
  const offset=(d.getDay()+6)%7;
  return {start:addDays(t,-offset),end:addDays(t,6-offset)};
}
function buildWeeks(r){
  return weekStarts(r).map(start=>({
    start,end:addDays(start,Math.min(6,Math.round((dateObj(r.end)-dateObj(start))/86400000)))
  }));
}

/* 页面 */
function render(){
  if(tab==='attendance')syncWeeks();
  const pages={home:homePage,visits:visitsPage,attendance:attendancePage,members:membersPage,weekly:weeklyPage,settings:settingsPage};
  $('#screen').innerHTML=(pages[tab]||homePage)();
  document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));
  $('#today').textContent=shortDate(today());
}
function recentVisits(n=4){
  const vs=state.visits.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n);
  if(!vs.length)return `<div class="card empty"><div class="empty-icon">♡</div><p>还没有探访记录</p><button type="button" class="btn soft" data-action="new-visit">记录第一次探访</button></div>`;
  return `<div class="card list">${vs.map(v=>`
    <div class="item"><div class="avatar">${v.star?'★':'♡'}</div>
      <div class="item-content"><div class="name">${esc(memberName(v.memberId))}${v.star?' ★':''}</div>
      <div class="desc">${esc(shortDate(v.date))} · ${esc(v.visitor||'未填写同工')}</div>
      ${v.log?`<div class="desc">${esc(v.log)}</div>`:''}</div>
      <button type="button" class="btn plain mini" data-action="edit-visit" data-id="${esc(v.id)}">编辑</button>
    </div>`).join('')}</div>`;
}
function homePage(){
  const s=stats(),a=attendanceStats(),week=currentWeekRange();
  const weekVisits=semesterVisits().filter(v=>inside(v.date,week)).length;
  const needs=activeMembers().map(m=>{
    const last=latestVisit(m.id),att=memberAttendance(m.id);
    const days=last?Math.floor((dateObj(today())-dateObj(last.date))/86400000):999;
    const score=(!last?4:days>=28?3:days>=14?1:0)+(att.total>=3&&att.rate<50?2:0);
    return {m,last,score};
  }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,4);

  return `
    ${!state.settings.configured?`<div class="notice">先设置学期日期与每人探访目标，再添加成员。</div>`:''}
    <div class="hero">
      <div class="muted">${esc(state.settings.semesterName)} · 探访目标</div>
      <div class="between" style="margin-top:13px">
        <div><div class="muted">完成率</div><div class="big">${Math.round(s.progress)}%</div></div>
        <div style="text-align:right"><div class="muted">已完成 / 总目标</div><div style="font-size:22px;font-weight:800">${s.done} / ${s.total}</div></div>
      </div>
      <div class="progress"><div style="width:${s.progress}%"></div></div>
      <div class="between muted"><span>还需 ${s.remaining} 次</span><span>${esc(shortDate(semester().start))}—${esc(shortDate(semester().end))}</span></div>
    </div>
    <div class="grid">
      <div class="metric"><div class="metric-label">本周探访</div><div class="metric-value">${weekVisits} 次</div><div class="metric-foot">平均每周 ${s.perWeek.toFixed(1)} 次</div></div>

/* 探访 */

  const stars=vs.filter(v=>v.star);
  return `
    <div class="head" style="margin-top:7px"><div><h1>探访计划</h1><div class="muted">${esc(state.settings.semesterName)}</div></div><button type="button" class="btn primary" data-action="new-visit">＋ 记录</button></div>
    <div class="card">
      <div class="between"><span class="muted">目标完成</span><span class="badge green">${Math.round(s.progress)}%</span></div>
      <div style="font-size:29px;font-weight:800;margin-top:5px">${s.done}<span class="muted"> / ${s.total} 次</span></div>
      <div class="progress"><div style="width:${s.progress}%"></div></div>
      <div class="grid">
        <div><div class="muted">尚需完成</div><div style="font-size:21px;font-weight:800">${s.remaining}</div></div>
        <div><div class="muted">平均每周 / 每月</div><div style="font-weight:750">${s.perWeek.toFixed(1)} / ${s.perMonth.toFixed(1)} 次</div></div>
      </div>
      <div class="muted" style="margin-top:12px">默认每人每学期 ${Number(state.settings.defaultTarget)||0} 次，可在个人档案单独调整。</div>
      <button type="button" class="text-btn" data-action="settings">修改默认目标 ›</button>
    </div>

        const t=targetFor(m),n=memberVisits(m.id).length,done=Math.min(t,n);
        return `<div class="item"><div class="avatar">${esc(initials(m.name))}</div><div class="item-content"><div class="name">${esc(m.name)}</div><div class="desc">${esc(categoryNames(m))} · 实际 ${n} 次</div><div class="progress"><div style="width:${t?done/t*100:0}%"></div></div></div><div style="font-weight:750">${done}/${t}</div><button type="button" class="btn plain mini" data-action="new-visit" data-member="${esc(m.id)}">探访</button></div>`;

function visitItem(v){
  return `<div class="item"><div class="avatar">${v.star?'★':'♡'}</div><div class="item-content">

      <div class="metric"><div class="metric-label">累计出席</div><div class="metric-value">${a.p}</div><div class="metric-foot">缺席 ${a.a} · 请假 ${a.l}</div></div>

      <label class="field" style="margin-top:14px">聚会日期（可修改）<input type="date" data-field="meeting-date" data-id="${esc(active.id)}" value="${esc(active.date)}"></label>

/* 每周日志，按月份与周次折叠 */
function weeklyPage(){
  const weeks=buildWeeks(semester()),todayStr=today();
  const groups={};
  weeks.forEach(w=>{const k=w.start.slice(0,7);(groups[k]||(groups[k]=[])).push(w)});
  const cur=weeks.find(w=>inside(todayStr,w));
  const curMonth=cur?.start.slice(0,7);
  return `
    <div class="head" style="margin-top:7px"><div><h1>每周日志</h1><div class="muted">自动汇总探访与聚会记录</div></div><button type="button" class="btn soft" data-action="current-week">本周</button></div>
    ${Object.keys(groups).length?Object.entries(groups).map(([month,ws])=>`
      <details ${month===curMonth?'open':''}>
        <summary><div class="month-head"><span>${Number(month.slice(5,7))} 月</span><span class="muted">${ws.length} 周　⌄</span></div></summary>
        <div class="details-body">
          ${ws.map(w=>{
            const log=state.weeklyLogs.find(l=>l.weekStart===w.start)||{};
            const vs=state.visits.filter(v=>inside(v.date,w));
            const ms=state.meetings.filter(m=>inside(m.weekStart||m.date,w));
            const active=inside(todayStr,w);
            return `<details class="week" ${active?'open':''}>
              <summary><div class="week-head"><div><b>${esc(shortDate(w.start))}—${esc(shortDate(w.end))}</b> ${active?'<span class="badge green">本周</span>':''}<div class="desc">探访 ${vs.length} 次 · 聚会 ${ms.length} 场</div></div><span class="muted">${log.summary?'已记录':'待填写'}　⌄</span></div></summary>
              <div class="details-body">
                ${vs.length?`<div class="muted">本周探访</div>${vs.map(v=>`<div class="item"><div class="avatar">${v.star?'★':'♡'}</div><div class="item-content"><div class="name">${esc(memberName(v.memberId))}</div><div class="desc">${esc(shortDate(v.date))} · ${esc(v.visitor||'')}</div></div></div>`).join('')}`:`<div class="muted">本周尚无探访记录</div>`}
                ${ms.length?`<div class="muted" style="margin-top:10px">本周聚会</div>${ms.map(m=>`<div class="desc">${esc(shortDate(m.date))} · ${esc(m.label)}</div>`).join('')}`:''}
                <form data-form="save-week" data-start="${esc(w.start)}" class="week-form">
                  <label class="field">工作总结<textarea name="summary" placeholder="本周完成了什么？">${esc(log.summary||'')}</textarea></label>
                  <label class="field">需要跟进<textarea name="concerns" placeholder="哪些成员需要继续关怀？">${esc(log.concerns||'')}</textarea></label>
                  <label class="field">下周计划<textarea name="next" placeholder="下一步行动">${esc(log.next||'')}</textarea></label>
                  <button type="submit" class="btn primary block">保存周报</button>
                </form>
              </div>
            </details>`;
          }).join('')}
        </div>
      </details>
    `).join(''):`<div class="card empty"><p>请先设置学期日期</p><button type="button" class="btn soft" data-action="settings">设置日期</button></div>`}`;
}

/* 弹窗：只有点击关闭按钮或背景才关闭 */
function openModal(html){
  const root=$('#modal');
  root.innerHTML=`<div class="modal-overlay"></div><section class="sheet"><div class="handle"></div>${html}</section>`;
  root.classList.add('open');
}
function closeModal(){
  const root=$('#modal');
  root.classList.remove('open');
  root.innerHTML='';
}
$('#modal').addEventListener('click',e=>{
  if(e.target.classList.contains('modal-overlay'))closeModal();
});

  const v=state.visits.find(x=>x.id===visitId)||{};
  openModal(`
    <div class="sheet-head"><h2>${visitId?'编辑探访':'记录探访'}</h2><button type="button" class="close" data-action="close">×</button></div>
    ${activeMembers().length?`
    <form data-form="visit" data-id="${esc(visitId)}">
      <div class="field-grid">
        <label class="field">日期<input name="date" type="date" required value="${esc(v.date||today())}"></label>
        <label class="field">被探访成员<select name="memberId" required><option value="">选择成员</option>${activeMembers().map(m=>`<option value="${esc(m.id)}" ${(v.memberId||memberId)===m.id?'selected':''}>${esc(m.name)}</option>`).join('')}</select></label>
      </div>
      <label class="field">探访同工<input name="visitor" value="${esc(v.visitor||'')}" placeholder="谁去探访？"></label>
      <label class="field">探访日志<textarea id="visit-log" name="log" placeholder="情况、代祷事项、后续行动…">${esc(v.log||'')}</textarea></label>
      <button type="button" class="btn plain mini" data-action="numbering">插入 1. 2. 3.</button>
      <label class="check-chip" style="margin:13px 0"><input type="checkbox" name="star" ${v.star?'checked':''}>★ 重点跟进</label>
      <button type="submit" class="btn primary block">保存探访</button>
    </form>`:`<div class="empty"><p>请先添加成员</p><button type="button" class="btn primary" data-action="new-member">添加成员</button></div>`}
  `);
}
function categoryForm(id=''){
  const c=state.categories.find(x=>x.id===id);
  openModal(`
    <div class="sheet-head"><h2>${c?'编辑分类':'新建分类'}</h2><button type="button" class="close" data-action="close">×</button></div>
    <form data-form="category" data-id="${esc(id)}">
      <label class="field">分类名称<input name="name" required maxlength="40" value="${esc(c?.name||'')}" placeholder="输入分类名称"></label>
      <button type="submit" class="btn primary block">保存分类</button>
    </form>
  `);
}
function profile(id){
  const m=state.members.find(x=>x.id===id);
  if(!m)return;
  const vs=memberVisits(m.id).sort((a,b)=>b.date.localeCompare(a.date));
  const a=memberAttendance(m.id),t=targetFor(m);
  openModal(`
    <div class="sheet-head"><h2>成员档案</h2><button type="button" class="close" data-action="close">×</button></div>
    <div class="card"><div class="row"><div class="avatar" style="width:50px;height:50px">${esc(initials(m.name))}</div><div class="flex1"><div style="font-size:20px;font-weight:800">${esc(m.name)}</div><div class="muted">${esc(categoryNames(m))}</div></div><button type="button" class="btn soft mini" data-action="edit-member" data-id="${esc(m.id)}">编辑</button></div>
      <hr><div class="grid"><div><div class="muted">探访完成</div><b style="font-size:22px">${Math.min(t,vs.length)}/${t}</b></div><div><div class="muted">出勤率</div><b style="font-size:22px">${a.p+a.a?Math.round(a.rate)+'%':'—'}</b></div></div>
    </div>
    <div class="card"><h3>基本资料</h3>${[['电话',m.phone],['学校',m.school],['班级',m.className],['寝室',m.dorm],['受洗',m.baptized==='yes'?'已受洗':m.baptized==='no'?'未受洗':'未记录'],['恩赐',m.gifts],['备注',m.note]].filter(x=>x[1]).map(x=>`<div class="item"><span class="muted" style="width:55px">${esc(x[0])}</span><span class="flex1">${esc(x[1])}</span></div>`).join('')||'<div class="muted">暂无其他资料</div>'}</div>
    <div class="head"><h3>探访记录</h3><button type="button" class="btn soft mini" data-action="new-visit" data-member="${esc(m.id)}">＋ 探访</button></div>
    <div class="card list">${vs.length?vs.slice(0,8).map(v=>`<div class="item"><div class="avatar">${v.star?'★':'♡'}</div><div class="item-content"><div class="name">${esc(dateText(v.date))} ${v.star?'★':''}</div><div class="desc">${esc(v.visitor||'')}</div><div class="desc">${esc(v.log||'')}</div></div></div>`).join(''):'<div class="empty"><p>尚无探访记录</p></div>'}</div>
    <div class="card"><h3>出勤统计</h3><div class="muted">出席 ${a.p} 次 · 缺席 ${a.a} 次 · 请假 ${a.l} 次</div></div>
    <div class="row">
      <button type="button" class="btn plain flex1" data-action="${m.archived?'restore-member':'archive-member'}" data-id="${esc(m.id)}">${m.archived?'恢复成员':'归档成员'}</button>
      <button type="button" class="btn danger flex1" data-action="delete-member" data-id="${esc(m.id)}">彻底删除</button>
    </div>
    <p class="muted" style="margin-top:10px">归档保留历史；彻底删除会移除关联记录。</p>
  `);
}

/* 按钮事件：统一委托，不让普通点击关闭弹窗 */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');
  if(!b)return;
  const a=b.dataset.action,id=b.dataset.id||'';

  if(a==='nav'){tab=b.dataset.tab;closeModal();render();window.scrollTo(0,0);return}
  if(a==='settings'){tab='settings';closeModal();render();window.scrollTo(0,0);return}
  if(a==='close'){closeModal();return}
  if(a==='new-member'){memberForm();return}
  if(a==='edit-member'){memberForm(id);return}
  if(a==='profile'){profile(id);return}
  if(a==='new-visit'){visitForm(b.dataset.member||'');return}
  if(a==='edit-visit'){visitForm('',id);return}
  if(a==='new-category'){categoryForm();return}
  if(a==='edit-category'){categoryForm(id);return}
  if(a==='category-filter'){categoryFilter=id;render();return}
  if(a==='archived'){archivedFilter=!archivedFilter;render();return}
  if(a==='current-week'){
    tab='weekly';render();
    const target=[...document.querySelectorAll('.week')].find(x=>x.open);
    if(target)target.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  if(a==='numbering'){
    const t=$('#visit-log');
    if(t){const s=t.selectionStart,e=t.selectionEnd;t.setRangeText('1. \n2. \n3. ',s,e,'end');t.focus()}
    return;
  }
  if(a==='star-visit'){
    const v=state.visits.find(x=>x.id===id);
    if(v){v.star=!v.star;save();render();say(v.star?'已标记跟进':'已取消星标')}
    return;
  }
  if(a==='attendance-status'){
    const mt=state.meetings.find(x=>x.id===b.dataset.meeting);
    if(mt){mt.records=mt.records||{};mt.records[b.dataset.member]=b.dataset.status;save();render()}
    return;
  }
  if(a==='delete-meeting'){
    const mt=state.meetings.find(x=>x.id===id);
    if(!mt)return;
    if(confirm('删除本周出勤场次？该场的出勤记录也会删除。')){
      state.settings.deletedAttendanceWeeks.push(mt.weekStart||mt.date);
      state.meetings=state.meetings.filter(x=>x.id!==id);
      state.settings.activeAttendanceWeek='';
      save();render();say('本场已删除');
    }
    return;
  }
  if(a==='archive-member'||a==='restore-member'){
    const m=state.members.find(x=>x.id===id);
    if(m){m.archived=a==='archive-member';save();closeModal();render();say(m.archived?'已归档':'已恢复')}
    return;
  }
  if(a==='delete-member'){
    const m=state.members.find(x=>x.id===id);
    if(!m)return;
    if(confirm(`彻底删除「${m.name}」及其探访和出勤记录？此操作不可撤销。`)){
      state.members=state.members.filter(x=>x.id!==id);
      state.visits=state.visits.filter(v=>v.memberId!==id);
      state.meetings.forEach(mt=>{if(mt.records)delete mt.records[id]});
      save();closeModal();render();say('成员已删除');
    }
    return;
  }
  if(a==='delete-category'){
    const c=state.categories.find(x=>x.id===id);
    if(!c||id==='uncategorized')return;
    if(confirm(`删除分类「${c.name}」？成员档案和历史记录会保留。`)){
      state.categories=state.categories.filter(x=>x.id!==id);
      state.members.forEach(m=>{
        m.categoryIds=(m.categoryIds||[]).filter(x=>x!==id);
        if(!m.categoryIds.length)m.categoryIds=['uncategorized'];
      });
      if(categoryFilter===id)categoryFilter='all';
      save();render();say('分类已删除');
    }
    return;
  }
  if(a==='export'){
    exportBackup();return;
  }
  if(a==='import'){
    importBackup();return;
  }
});

/* 表单事件 */
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');
  if(!f)return;
  e.preventDefault();
  const fd=new FormData(f);
  const d=Object.fromEntries(fd.entries());

  if(f.dataset.form==='settings'){
    if(!d.start||!d.end||d.start>d.end){say('请检查学期日期');return}
    state.settings.semesterName=(d.semesterName||'本学期').trim();
    state.settings.startDate=d.start;
    state.settings.endDate=d.end;
    state.settings.defaultTarget=Math.max(0,Number(d.defaultTarget)||0);
    state.settings.configured=true;
    save();
    tab=activeMembers().length?'home':'members';
    render();window.scrollTo(0,0);say('设置已保存');return;
  }

  if(f.dataset.form==='member'){
    const id=f.dataset.id;
    const old=state.members.find(m=>m.id===id);
    const name=(d.name||'').trim();
    if(!name){say('请填写姓名');return}
    let categoryIds=fd.getAll('categoryIds');
    if(!categoryIds.length)categoryIds=['uncategorized'];
    const m={
      ...(old||{}),id:id||uid(),name,categoryIds,
      targetOverride:d.targetOverride===''?null:Math.max(0,Number(d.targetOverride)),
      phone:(d.phone||'').trim(),school:(d.school||'').trim(),
      className:(d.className||'').trim(),dorm:(d.dorm||'').trim(),
      baptized:d.baptized||'unknown',gifts:(d.gifts||'').trim(),
      note:(d.note||'').trim(),archived:old?.archived||false
    };
    if(old)state.members=state.members.map(x=>x.id===id?m:x);
    else state.members.push(m);
    state.settings.configured=true;
    save();closeModal();render();say(old?'成员已更新':'成员已添加');return;
  }

  if(f.dataset.form==='visit'){
    if(!d.memberId){say('请选择被探访成员');return}
    const id=f.dataset.id;
    const old=state.visits.find(v=>v.id===id);
    const v={
      ...(old||{}),id:id||uid(),date:d.date||today(),
      memberId:d.memberId,visitor:(d.visitor||'').trim(),
      log:(d.log||'').trim(),star:fd.has('star')
    };
    if(old)state.visits=state.visits.map(x=>x.id===id?v:x);
    else state.visits.push(v);
    save();closeModal();render();say('探访记录已保存');return;
  }

  if(f.dataset.form==='category'){
    const name=(d.name||'').trim();
    if(!name){say('请填写分类名称');return}
    const id=f.dataset.id;
    const c=state.categories.find(x=>x.id===id);
    if(c)c.name=name;
    else state.categories.push({id:uid(),name});
    save();closeModal();render();say('分类已保存');return;
  }

  if(f.dataset.form==='save-week'){
    const start=f.dataset.start;
    const old=state.weeklyLogs.find(x=>x.weekStart===start);
    const log={
      ...(old||{}),id:old?.id||uid(),weekStart:start,
      summary:(d.summary||'').trim(),concerns:(d.concerns||'').trim(),
      next:(d.next||'').trim(),updatedAt:new Date().toISOString()
    };
    if(old)state.weeklyLogs=state.weeklyLogs.map(x=>x.weekStart===start?log:x);
    else state.weeklyLogs.push(log);
    save();render();say('周报已保存');return;
  }
});

/* 日期、出勤场次和搜索 */
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.field==='active-week'){
    state.settings.activeAttendanceWeek=el.value;save();render();return;
  }
  if(el.dataset.field==='meeting-date'){
    const m=state.meetings.find(x=>x.id===el.dataset.id);
    if(m&&el.value){m.date=el.value;save();render();say('日期已更新')}
    return;
  }
  if(el.dataset.field==='meeting-label'){
    const m=state.meetings.find(x=>x.id===el.dataset.id);
    if(m){m.label=el.value.trim()||'团契聚会';save();say('名称已保存')}
  }
});
document.addEventListener('input',e=>{
  if(e.target.dataset.field==='search'){
    query=e.target.value;
    const y=window.scrollY;
    render();
    const el=$('[data-field="search"]');
    if(el){el.focus();el.setSelectionRange(query.length,query.length)}
    window.scrollTo(0,y);
  }
});

/* 备份码：可跨设备迁移，不等于加密 */
async function exportBackup(){
  try{
    const bytes=new TextEncoder().encode(JSON.stringify(state));
    let bin='';
    for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
    const code='TXCARE2.'+btoa(bin);
    const area=$('#backup');
    if(area){area.value=code;area.focus();area.select()}
    try{await navigator.clipboard.writeText(code);say('备份码已复制')}
    catch{say('备份码已生成，请长按文本复制')}
  }catch{say('生成备份码失败')}
}
function importBackup(){
  const code=($('#backup')?.value||'').trim();
  if(!code.startsWith('TXCARE2.')){say('备份码格式不正确');return}
  if(!confirm('恢复将覆盖当前设备的全部资料。建议先导出当前备份，确定继续吗？'))return;
  try{
    const bin=atob(code.slice(8));
    const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));
    const parsed=JSON.parse(new TextDecoder().decode(bytes));
    if(!parsed||!Array.isArray(parsed.members)||!Array.isArray(parsed.visits)||!Array.isArray(parsed.categories))throw Error();
    state=normalize(parsed);
    save();closeModal();tab='home';render();say('数据恢复成功');
  }catch{say('恢复失败，请检查备份码是否完整')}
}

/* 启动 */
render();
setInterval(()=>{$('#today').textContent=shortDate(today())},60000);
