<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="同行">
<title>同行 · 团契关怀</title>

<style>
:root {
  --bg:#f5f6f2;
  --card:#fff;
  --ink:#202923;
  --muted:#818980;
  --line:#e8ebe5;
  --green:#245c46;
  --green-bg:#e9f2ec;
  --orange:#956a32;
  --orange-bg:#f7efe1;
  --red:#b64e45;
  --radius:18px;
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { scroll-behavior:smooth; }
body {
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",
    "Hiragino Sans GB","Microsoft YaHei",sans-serif;
  font-size:15px;
  line-height:1.5;
}
button,input,textarea,select { font:inherit; }
button { cursor:pointer; }
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible {
  outline:2px solid #80a58e;
  outline-offset:2px;
}
#app { max-width:560px; min-height:100dvh; margin:auto; padding-bottom:calc(86px + env(safe-area-inset-bottom)); }
.topbar {
  position:sticky; top:0; z-index:10;
  display:flex; align-items:center; justify-content:space-between;
  padding:13px 19px;
  background:rgba(245,246,242,.94);
  backdrop-filter:blur(15px);
}
.brand { display:flex; align-items:center; gap:10px; }
.brand-mark {
  width:35px; height:35px; border-radius:12px;
  background:var(--green); color:white;
  display:grid; place-items:center;
  font-size:19px; font-weight:600;
}
.brand-name { font-size:19px; font-weight:750; letter-spacing:.5px; }
.brand-sub { font-size:10px; color:var(--muted); letter-spacing:1.3px; }
.top-date { font-size:12px; color:var(--muted); }
.icon-btn {
  border:0; background:white; color:var(--ink);
  border-radius:12px; width:39px; height:39px;
  font-size:20px; display:grid; place-items:center;
}
main { padding:5px 16px 20px; }
h1,h2,h3,p { margin-top:0; }
h1 { font-size:25px; line-height:1.35; margin-bottom:5px; letter-spacing:-.5px; }
h2 { font-size:19px; margin-bottom:12px; }
h3 { font-size:15px; margin-bottom:8px; }
p { margin-bottom:10px; }
.muted { color:var(--muted); font-size:12px; }
.small { font-size:12px; }
.section { margin-top:23px; }
.section-head { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:11px; }
.section-head h2,.section-head h3 { margin:0; }
.card {
  background:var(--card); border:1px solid rgba(30,50,35,.045);
  border-radius:var(--radius); padding:16px; margin-bottom:11px;
}
.hero {
  background:var(--green); color:#fff; border-radius:23px;
  padding:21px 19px; margin:8px 0 13px;
}
.hero .muted { color:rgba(255,255,255,.72); }
.hero h1 { font-size:25px; }
.hero-number { font-size:37px; font-weight:750; letter-spacing:-1px; line-height:1.2; }
.hero-row { display:flex; align-items:end; justify-content:space-between; gap:10px; }
.grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.metric { background:white; border-radius:17px; padding:15px; min-width:0; }
.metric-label { color:var(--muted); font-size:12px; margin-bottom:8px; }
.metric-number { font-size:25px; font-weight:750; line-height:1.2; letter-spacing:-.5px; }
.metric-foot { font-size:11px; color:var(--muted); margin-top:7px; }
.progress { height:6px; background:#e9ece7; border-radius:10px; overflow:hidden; margin:12px 0 7px; }
.progress > div { height:100%; background:#72a185; border-radius:10px; }
.progress.dark { background:rgba(255,255,255,.2); }
.progress.dark > div { background:#d0e6d5; }
.quick-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:9px; }
.quick {
  border:1px solid var(--line); border-radius:16px;
  background:white; padding:14px 5px; text-align:center; color:var(--ink);
}
.quick-symbol { font-size:22px; color:var(--green); margin-bottom:5px; }
.quick-label { font-size:12px; font-weight:650; }
.btn {
  border:0; border-radius:12px; padding:11px 15px;
  font-weight:650; font-size:13px; display:inline-flex;
  align-items:center; justify-content:center; gap:6px;
}
.btn-primary { background:var(--green); color:white; }
.btn-light { background:var(--green-bg); color:var(--green); }
.btn-plain { background:#f2f4f0; color:var(--ink); }
.btn-danger { background:#fbecea; color:var(--red); }
.btn-small { padding:7px 10px; font-size:12px; border-radius:9px; }
.btn-block { width:100%; }
.text-btn { background:none; border:0; padding:6px 0; color:var(--green); font-size:13px; font-weight:650; }
.row { display:flex; align-items:center; gap:10px; }
.between { display:flex; justify-content:space-between; align-items:center; gap:10px; }
.flex1 { flex:1; min-width:0; }
.badge {
  display:inline-flex; align-items:center; gap:4px;
  border-radius:7px; background:#f0f2ee; color:#647066;
  padding:4px 7px; font-size:11px; white-space:nowrap;
}
.badge.green { background:var(--green-bg); color:var(--green); }
.badge.orange { background:var(--orange-bg); color:var(--orange); }
.badge.red { background:#fbecea; color:var(--red); }
.avatar {
  flex:0 0 42px; width:42px; height:42px; border-radius:14px;
  background:var(--green-bg); color:var(--green);
  display:grid; place-items:center; font-size:17px; font-weight:750;
}
.list { display:flex; flex-direction:column; }
.list-row {
  display:flex; align-items:center; gap:11px;
  padding:13px 0; border-bottom:1px solid var(--line);
}
.list-row:last-child { border-bottom:0; }
.list-row .content { flex:1; min-width:0; }
.list-row .name { font-size:14px; font-weight:650; overflow-wrap:anywhere; }
.list-row .desc { font-size:12px; color:var(--muted); margin-top:3px; }
.arrow { color:#a2aaa1; font-size:20px; }
.empty { text-align:center; padding:30px 15px; color:var(--muted); }
.empty-symbol { font-size:28px; margin-bottom:8px; color:#9eafa1; }
.empty p { font-size:12px; }
input,textarea,select {
  width:100%; min-width:0; border:1px solid #e2e7df;
  background:#fff; color:var(--ink); border-radius:11px;
  padding:11px 12px; font-size:16px;
}
textarea { min-height:95px; resize:vertical; line-height:1.6; }
label.field { display:block; font-size:12px; color:#59645b; margin-bottom:14px; }
.field > input,.field > textarea,.field > select { display:block; margin-top:6px; }
.field-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
.field-grid .field { min-width:0; }
.search { position:relative; margin-bottom:11px; }
.search input { padding-left:36px; background:white; }
.search::before { content:"⌕"; position:absolute; left:13px; top:7px; font-size:23px; color:var(--muted); }
.filter-row { display:flex; gap:7px; overflow-x:auto; padding:1px 0 10px; scrollbar-width:none; }
.filter-chip {
  flex-shrink:0; border:1px solid var(--line); border-radius:10px;
  padding:7px 11px; background:white; color:#687268; font-size:12px;
}
.filter-chip.active { background:var(--green); color:white; border-color:var(--green); }
.member-card { cursor:pointer; }
.member-card:active { transform:scale(.995); }
.status-btn {
  flex:1; border:1px solid var(--line); background:white; color:#818980;
  border-radius:9px; padding:9px 2px; font-size:12px;
}
.status-btn.active { background:var(--green-bg); border-color:#bfd7c6; color:var(--green); font-weight:750; }
.status-btn.absent.active { background:#fbecea; border-color:#efc6c0; color:var(--red); }
.status-btn.leave.active { background:var(--orange-bg); border-color:#e7d4b5; color:var(--orange); }
.status-options { display:flex; gap:5px; margin-top:10px; }
details { border:1px solid var(--line); background:white; border-radius:14px; margin-bottom:9px; overflow:hidden; }
summary { cursor:pointer; list-style:none; }
summary::-webkit-details-marker { display:none; }
details > summary { padding:14px; }
details > .details-body { padding:0 13px 14px; }
details[open] > summary { border-bottom:1px solid var(--line); }
.month-summary { display:flex; justify-content:space-between; align-items:center; font-weight:700; }
.week-summary { display:flex; justify-content:space-between; gap:8px; align-items:center; }
.week { margin-top:9px; border-radius:12px; background:#fafbf9; }
.week > summary { padding:12px; }
.week .details-body { padding:12px; }
.week .week-form { padding-top:12px; border-top:1px solid var(--line); margin-top:12px; }
.inline-check { display:flex; align-items:center; gap:8px; font-size:13px; margin:10px 0; }
.inline-check input { width:18px; height:18px; margin:0; accent-color:var(--green); }
.bottom-nav {
  position:fixed; z-index:20; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:560px; display:grid; grid-template-columns:repeat(5,1fr);
  background:rgba(255,255,255,.97); backdrop-filter:blur(16px);
  border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
}
.nav-item {
  border:0; background:transparent; color:#8a9389; padding:3px 0;
  display:flex; flex-direction:column; align-items:center; gap:3px;
  font-size:10px; min-width:0;
}
.nav-symbol { font-size:21px; line-height:1.2; }
.nav-item.active { color:var(--green); font-weight:750; }
.nav-item.active .nav-symbol { background:var(--green-bg); border-radius:10px; padding:3px 13px; }
.modal-root:empty { display:none; }
.modal-root {
  position:fixed; z-index:50; inset:0;
  background:rgba(21,31,24,.38); display:flex; align-items:flex-end; justify-content:center;
}
.sheet {
  width:100%; max-width:560px; max-height:92dvh; overflow-y:auto;
  background:var(--bg); border-radius:23px 23px 0 0;
  padding:8px 17px calc(22px + env(safe-area-inset-bottom));
  animation:slideUp .18s ease-out;
}
.sheet.fullscreen { max-height:100dvh; height:100dvh; border-radius:0; padding-top:14px; }
@keyframes slideUp { from { transform:translateY(20px); opacity:.6; } to { transform:translateY(0); opacity:1; } }
.sheet-handle { width:36px; height:4px; background:#d5dbd3; border-radius:5px; margin:3px auto 16px; }
.sheet-head { display:flex; justify-content:space-between; align-items:center; margin-bottom:18px; }
.sheet-head h2 { margin:0; }
.close-btn { width:33px; height:33px; border:0; background:#e9ece7; border-radius:50%; font-size:20px; }
.sheet-section { margin:18px 0; }
.sheet-section > h3 { margin-bottom:11px; }
.category-row { display:grid; grid-template-columns:minmax(0,1fr) 70px 76px 30px; gap:6px; align-items:center; margin:8px 0; }
.category-row input { padding:9px 6px; font-size:14px; }
.category-row button { border:0; background:#fbecea; color:var(--red); border-radius:8px; height:36px; }
.notice { background:#edf2ec; color:#506254; padding:11px 12px; border-radius:11px; font-size:12px; line-height:1.65; }
.toast {
  position:fixed; z-index:100; bottom:calc(85px + env(safe-area-inset-bottom));
  left:50%; transform:translateX(-50%); max-width:90vw;
  background:#26392d; color:white; padding:11px 16px;
  border-radius:12px; font-size:13px; box-shadow:0 5px 25px #0002;
}
.tutorial-step { display:flex; gap:12px; margin:15px 0; align-items:flex-start; }
.tutorial-num {
  flex:0 0 29px; width:29px; height:29px; display:grid; place-items:center;
  border-radius:10px; background:var(--green-bg); color:var(--green); font-weight:750;
}
hr { border:0; border-top:1px solid var(--line); margin:16px 0; }
@media (min-width:561px) {
  body { padding:15px 0; }
  #app { min-height:calc(100dvh - 30px); border-radius:25px; overflow:hidden; box-shadow:0 5px 45px #2030240b; }
  .bottom-nav { bottom:15px; border-radius:0 0 25px 25px; }
  .sheet { border-radius:23px; margin-bottom:15px; }
  .modal-root { align-items:center; padding:15px; }
}
</style>
</head>

<body>
<div id="app">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">同</div>
      <div>
        <div class="brand-name">同行</div>
        <div class="brand-sub">CARE & FELLOWSHIP</div>
      </div>
    </div>
    <div class="row">
      <span class="top-date" id="today-label"></span>
      <button class="icon-btn" data-action="settings" aria-label="设置">⚙</button>
    </div>
  </header>

  <main id="screen"></main>

  <nav class="bottom-nav" id="bottom-nav">
    <button class="nav-item active" data-action="nav" data-tab="home">
      <span class="nav-symbol">⌂</span><span>首页</span>
    </button>
    <button class="nav-item" data-action="nav" data-tab="visits">
      <span class="nav-symbol">♡</span><span>探访</span>
    </button>
    <button class="nav-item" data-action="nav" data-tab="attendance">
      <span class="nav-symbol">✓</span><span>出勤</span>
    </button>
    <button class="nav-item" data-action="nav" data-tab="members">
      <span class="nav-symbol">♙</span><span>成员</span>
    </button>
    <button class="nav-item" data-action="nav" data-tab="weekly">
      <span class="nav-symbol">≡</span><span>周报</span>
    </button>
  </nav>
</div>

<div class="modal-root" id="modal-root"></div>
<div id="toast-root"></div>

<script>
'use strict';

const $ = s => document.querySelector(s);
const DAY = 86400000;
const STORAGE_KEY = 'tongxing_care_v1';

function localISO(date = new Date()) {
  return date.getFullYear() + '-' +
    String(date.getMonth()+1).padStart(2,'0') + '-' +
    String(date.getDate()).padStart(2,'0');
}
function parseDate(value) {
  if (!value) return new Date();
  return new Date(value + 'T12:00:00');
}
function addDays(value, days) {
  const d = parseDate(value);
  d.setDate(d.getDate()+days);
  return localISO(d);
}
function todayISO() { return localISO(new Date()); }
function dateText(value, withYear=false) {
  if (!value) return '未设置';
  const d = parseDate(value);
  return d.getFullYear() + '年' + (d.getMonth()+1) + '月' + d.getDate() + '日';
}
function shortDate(value) {
  if (!value) return '';
  const d = parseDate(value);
  return (d.getMonth()+1) + '/' + d.getDate();
}
function humanToday() {
  const d = new Date();
  return ['日','一','二','三','四','五','六'][d.getDay()] + ' · ' +
    (d.getMonth()+1) + '月' + d.getDate() + '日';
}
function uid() {
  return (crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Date.now().toString(36) + Math.random().toString(36).slice(2,10);
}
function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
}
function validRange(range) {
  return !!(range && range.start && range.end && range.start <= range.end);
}
function within(date, range) {
  return !!date && validRange(range) && date >= range.start && date <= range.end;
}
function dayCount(range) {
  if (!validRange(range)) return 1;
  return Math.max(1, Math.floor((parseDate(range.end)-parseDate(range.start))/DAY)+1);
}
function weekCount(range) {
  return Math.max(1, Math.ceil(dayCount(range)/7));
}
function newDefaultState() {
  const start = todayISO();
  return {
    version:1,
    settings:{
      semesterName:'本学期',
      startDate:start,
      endDate:addDays(start,111),
      independentAttendance:false,
      independentWeekly:false,
      ranges:{
        attendance:{start,end:addDays(start,111)},
        weekly:{start,end:addDays(start,111)}
      },
      activeMeetingId:''
    },
    categories:[
      {id:'youth',name:'青年成员',target:3,extraCount:0},
      {id:'ordinary',name:'普通成员',target:2,extraCount:0},
      {id:'new',name:'新朋友',target:4,extraCount:0},
      {id:'other',name:'未分类',target:2,extraCount:0}
    ],
    members:[],
    visits:[],
    meetings:[],
    weeklyLogs:[],
    tutorialSeen:false
  };
}
function normalizeState(data) {
  const base = newDefaultState();
  if (!data || typeof data !== 'object') return base;
  const s = {...base,...data};
  s.settings = {...base.settings,...(data.settings||{})};
  s.settings.ranges = {...base.settings.ranges,...(data.settings?.ranges||{})};
  s.categories = Array.isArray(data.categories) ? data.categories : base.categories;
  s.members = Array.isArray(data.members) ? data.members : [];
  s.visits = Array.isArray(data.visits) ? data.visits : [];
  s.meetings = Array.isArray(data.meetings) ? data.meetings : [];
  s.weeklyLogs = Array.isArray(data.weeklyLogs) ? data.weeklyLogs : [];
  return s;
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? normalizeState(JSON.parse(raw)) : null;
  } catch (e) {
    return null;
  }
}
let state = loadState() || newDefaultState();
let currentTab = 'home';
let memberQuery = '';
let memberCategory = 'all';
let showArchived = false;
let toastTimer = null;

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (e) {
    toast('本地保存失败，请尽快导出备份码');
  }
}
function toast(message) {
  const root = $('#toast-root');
  root.innerHTML = '<div class="toast">' + esc(message) + '</div>';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => root.innerHTML='', 2600);
}
function activeMembers() {
  return state.members.filter(m => !m.archived);
}
function categoryOf(member) {
  return state.categories.find(c => c.id === member.categoryId) || {
    name:'未分类', target:2, extraCount:0
  };
}
function targetFor(member) {
  if (member.targetOverride !== null &&
      member.targetOverride !== undefined &&
      member.targetOverride !== '') {
    return Math.max(0, Number(member.targetOverride) || 0);
  }
  return Math.max(0, Number(categoryOf(member).target) || 0);
}
function visitRange() {
  return {start:state.settings.startDate,end:state.settings.endDate};
}
function moduleRange(module) {
  if (module === 'attendance' && state.settings.independentAttendance) {
    return state.settings.ranges.attendance;
  }
  if (module === 'weekly' && state.settings.independentWeekly) {
    return state.settings.ranges.weekly;
  }
  return visitRange();
}
function visitsInRange(range=visitRange()) {
  return state.visits.filter(v => within(v.date, range));
}
function memberVisits(memberId, range=visitRange()) {
  return visitsInRange(range).filter(v => v.memberId === memberId);
}
function getTargetStats() {
  const range = visitRange();
  const members = activeMembers();
  const visits = visitsInRange(range);
  const byMember = {};
  visits.forEach(v => {
    if (v.memberId) byMember[v.memberId] = (byMember[v.memberId] || 0) + 1;
  });

  let total = 0, done = 0, people = 0;
  members.forEach(m => {
    const target = targetFor(m);
    total += target;
    done += Math.min(target, byMember[m.id] || 0);
    if (target > 0) people++;
  });
  state.categories.forEach(c => {
    const extra = Math.max(0, Number(c.extraCount)||0);
    const target = Math.max(0, Number(c.target)||0);
    total += extra * target;
    people += extra;
  });

  const days = dayCount(range);
  const weeks = weekCount(range);
  return {
    total,done,remaining:Math.max(0,total-done),
    people,actual:visits.length,
    progress:total ? Math.min(100,done/total*100) : 0,
    perWeek:total/weeks,
    peoplePerWeek:people/weeks,
    perMonth:total*30.4375/days
  };
}
function meetingRange(range=moduleRange('attendance')) {
  return state.meetings
    .filter(m => within(m.date,range))
    .sort((a,b) => b.date.localeCompare(a.date));
}
function attendanceSummary(range=moduleRange('attendance')) {
  let present=0, absent=0, leave=0, unmarked=0;
  meetingRange(range).forEach(meeting => {
    activeMembers().forEach(m => {
      const status = meeting.records?.[m.id] || 'unmarked';
      if (status==='present') present++;
      else if (status==='absent') absent++;
      else if (status==='leave') leave++;
      else unmarked++;
    });
  });
  const rate = present+absent ? present/(present+absent)*100 : 0;
  return {present,absent,leave,unmarked,rate,meetings:meetingRange(range).length};
}
function memberAttendance(memberId, range=moduleRange('attendance')) {
  let present=0, absent=0, leave=0, total=0;
  meetingRange(range).forEach(meeting => {
    const status = meeting.records?.[memberId] || 'unmarked';
    if (status==='present') { present++; total++; }
    if (status==='absent') { absent++; total++; }
    if (status==='leave') leave++;
  });
  return {
    present,absent,leave,total,
    rate:present+absent ? present/(present+absent)*100 : 0
  };
}
function latestVisit(memberId) {
  return state.visits.filter(v => v.memberId===memberId)
    .sort((a,b)=>b.date.localeCompare(a.date))[0] || null;
}
function currentWeek(range=visitRange()) {
  const today = todayISO();
  if (validRange(range) && today>=range.start && today<=range.end) {
    const index = Math.floor((parseDate(today)-parseDate(range.start))/DAY/7);
    const start = addDays(range.start,index*7);
    const end = start > range.end ? range.end :
      (addDays(start,6) > range.end ? range.end : addDays(start,6));
    return {start,end};
  }
  const d = parseDate(today);
  const weekday = (d.getDay()+6)%7;
  const start = addDays(today,-weekday);
  return {start,end:addDays(start,6)};
}
function buildWeeks(range) {
  if (!validRange(range)) return [];
  const out = [];
  let start = range.start;
  while (start <= range.end && out.length < 80) {
    const end = addDays(start,6) > range.end ? range.end : addDays(start,6);
    out.push({start,end});
    start = addDays(start,7);
  }
  return out;
}

/* -------------------- 每周工作日志 -------------------- */
function renderWeekly() {
  const range=moduleRange('weekly');
  const weeks=buildWeeks(range);
  const today=todayISO();
  const groups={};
  weeks.forEach(w=>{
    const key=w.start.slice(0,7);
    if (!groups[key]) groups[key]=[];
    groups[key].push(w);
  });
  const current=weeks.find(w=>today>=w.start&&today<=w.end);
  const currentMonth=current ? current.start.slice(0,7) : Object.keys(groups)[0];

  return `
    <div class="section-head" style="margin-top:8px">
      <div><h1>每周日志</h1><div class="muted">${esc(state.settings.semesterName)} · 自动按周归档</div></div>
      <button class="btn btn-light" data-action="current-week">本周</button>
    </div>
    <div class="notice">每周自动汇总探访与聚会记录。你只需补充总结、需要跟进的问题和下周计划。</div>
    <section class="section">
      ${weeks.length ? Object.entries(groups).map(([month,monthWeeks])=>`
        <details ${month===currentMonth?'open':''}>
          <summary><div class="month-summary"><span>${Number(month.slice(5,7))} 月</span><span class="muted">${monthWeeks.length} 周　⌄</span></div></summary>
          <div class="details-body">
            ${monthWeeks.map(w=>{
              const log=state.weeklyLogs.find(l=>l.weekStart===w.start)||{};
              const visits=state.visits.filter(v=>within(v.date,w));
              const meetings=state.meetings.filter(m=>within(m.date,w));
              const isCurrent=today>=w.start&&today<=w.end;
              return `<details class="week" ${isCurrent?'open':''}>
                <summary>
                  <div class="week-summary">
                    <div>
                      <div style="font-weight:700">${esc(shortDate(w.start))} — ${esc(shortDate(w.end))} ${isCurrent?'<span class="badge green">本周</span>':''}</div>
                      <div class="muted" style="margin-top:4px">探访 ${visits.length} 次 · 聚会 ${meetings.length} 场</div>
                    </div>
                    <span class="muted">${log.summary?'已记录':'待填写'}　⌄</span>
                  </div>
                </summary>
                <div class="details-body">
                  ${visits.length ? `<div class="muted" style="margin-bottom:7px">本周探访</div>
                    ${visits.map(v=>`<div class="list-row" style="padding:8px 0"><div class="content"><div class="name">${esc(memberName(v.memberId))}${v.star?' ★':''}</div><div class="desc">${esc(shortDate(v.date))} · ${esc(v.visitor||'')}</div></div></div>`).join('')}` : `<div class="muted">本周尚无探访记录</div>`}
                  ${meetings.length ? `<div class="muted" style="margin:10px 0 5px">本周聚会</div>${meetings.map(m=>`<div class="desc" style="margin:5px 0">${esc(shortDate(m.date))} · ${esc(m.label||'团契聚会')}</div>`).join('')}` : ''}
                  <form data-form="save-week" data-week-start="${esc(w.start)}" class="week-form">
                    <label class="field">工作总结<textarea name="summary" placeholder="本周做了什么？">${esc(log.summary||'')}</textarea></label>
                    <label class="field">需要跟进<textarea name="concerns" placeholder="哪些成员需要继续关怀？">${esc(log.concerns||'')}</textarea></label>
                    <label class="field">下周计划<textarea name="next" placeholder="下周准备做什么？">${esc(log.next||'')}</textarea></label>
                    <button class="btn btn-primary btn-block" type="submit">保存本周日志</button>
                  </form>
                </div>
              </details>`;
            }).join('')}
          </div>
        </details>
      `).join('') : `<div class="card empty"><p>请先设置周报的日期范围</p><button class="btn btn-light" data-action="settings">设置日期</button></div>`}
    </section>`;
}

/* -------------------- 页面渲染 -------------------- */
function render() {
  const screen=$('#screen');
  const pages={
    home:renderHome,
    visits:renderVisits,
    attendance:renderAttendance,
    members:renderMembers,
    weekly:renderWeekly
  };
  screen.innerHTML=(pages[currentTab]||renderHome)();
  document.querySelectorAll('.nav-item').forEach(btn=>{
    btn.classList.toggle('active',btn.dataset.tab===currentTab);
  });
  if (currentTab==='members') renderMemberList();
  $('#today-label').textContent=humanToday();
}

/* -------------------- 操作事件 -------------------- */
document.addEventListener('click', async e => {
  const btn=e.target.closest('[data-action]');
  if (!btn) return;
  const action=btn.dataset.action;
  const id=btn.dataset.id||'';

  if (action==='nav') {
    currentTab=btn.dataset.tab;
    closeModal(); render(); window.scrollTo({top:0,behavior:'smooth'}); return;
  }
  if (action==='settings') { openSettings(); return; }
  if (action==='close-modal') {
    if (e.target===btn || btn.classList.contains('close-btn')) closeModal();
    return;
  }
  if (action==='new-member') { openMemberForm(); return; }
  if (action==='edit-member') { openMemberForm(id); return; }
  if (action==='profile') { openProfile(id); return; }
  if (action==='new-visit') { openVisitForm(id); return; }
  if (action==='new-meeting') { openMeetingForm(); return; }
  if (action==='add-category') { openCategoryForm(); return; }
  if (action==='category-filter') {
    memberCategory=id; render(); return;
  }
  if (action==='toggle-archived') {
    showArchived=!showArchived; render(); return;
  }
  if (action==='insert-numbering') {
    const ta=$('#visit-log');
    if (ta) {
      const start=ta.selectionStart, end=ta.selectionEnd;
      const text='1. \n2. \n3. ';
      ta.setRangeText(text,start,end,'end');
      ta.focus();
    }
    return;
  }
  if (action==='attendance-status') {
    const meeting=getActiveMeeting();
    if (!meeting) return;
    meeting.records=meeting.records||{};
    meeting.records[btn.dataset.member]=btn.dataset.status;
    saveState(); render(); return;
  }
  if (action==='toggle-star') {
    const v=state.visits.find(x=>x.id===id);
    if (v) { v.star=!v.star; saveState(); render(); toast(v.star?'已加入重点跟进':'已取消星标'); }
    return;
  }
  if (action==='archive-member') {
    const m=state.members.find(x=>x.id===id);
    if (m) {
      m.archived=true; saveState(); closeModal(); render(); toast('成员已归档，历史记录保留');
    }
    return;
  }
  if (action==='restore-member') {
    const m=state.members.find(x=>x.id===id);
    if (m) { m.archived=false; saveState(); closeModal(); render(); toast('成员已恢复'); }
    return;
  }
  if (action==='delete-member') {
    const m=state.members.find(x=>x.id===id);
    if (m && confirm('确定彻底删除「'+m.name+'」？该成员关联的探访和出勤记录也会删除，无法撤销。')) {
      state.members=state.members.filter(x=>x.id!==id);
      state.visits=state.visits.filter(x=>x.memberId!==id);
      state.meetings.forEach(mt=>{ if(mt.records) delete mt.records[id]; });
      saveState(); closeModal(); render(); toast('成员及关联记录已删除');
    }
    return;
  }
  if (action==='remove-category') {
    const c=state.categories.find(x=>x.id===id);
    if (!c) return;
    if (state.categories.length<=1) { toast('至少保留一个分类'); return; }
    if (activeMembers().some(m=>m.categoryId===id) || Number(c.extraCount)>0) {
      toast('请先转移该分类成员并清零待录入人数'); return;
    }
    if (confirm('删除分类「'+c.name+'」？')) {
      state.categories=state.categories.filter(x=>x.id!==id);
      saveState(); openSettings(); render(); toast('分类已删除');
    }
    return;
  }
  if (action==='current-week') {
    currentTab='weekly'; render();
    const target=$('#screen details.week[open]');
    if (target) target.scrollIntoView({behavior:'smooth',block:'center'});
    else window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  if (action==='dismiss-tutorial') {
    state.tutorialSeen=true; saveState(); closeModal(); render(); return;
  }
  if (action==='tutorial-settings') {
    state.tutorialSeen=true; saveState(); openSettings(); return;
  }
  if (action==='tutorial-member') {
    state.tutorialSeen=true; saveState(); openMemberForm(); return;
  }
  if (action==='replay-tutorial') { openTutorial(); return; }
  if (action==='export-code') {
    const area=$('#backup-code');
    if (!area) return;
    try {
      const bytes=new TextEncoder().encode(JSON.stringify(state));
      let binary='';
      for(let i=0;i<bytes.length;i+=0x8000) {
        binary+=String.fromCharCode(...bytes.subarray(i,i+0x8000));
      }
      const code='TXCARE1.'+btoa(binary);
      area.value=code;
      area.focus(); area.select();
      try {
        await navigator.clipboard.writeText(code);
        toast('备份码已生成并复制');
      } catch {
        toast('备份码已生成，请长按文本复制');
      }
    } catch(err) {
      toast('生成失败，请稍后重试');
    }
    return;
  }
  if (action==='import-code') {
    const area=$('#backup-code');
    const code=(area?.value||'').trim();
    if (!code.startsWith('TXCARE1.')) { toast('备份码格式不正确'); return; }
    if (!confirm('恢复备份会覆盖本设备当前资料。建议先导出当前备份，确定继续吗？')) return;
    try {
      const binary=atob(code.slice(8));
      const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
      const parsed=JSON.parse(new TextDecoder().decode(bytes));
      if (!parsed || !Array.isArray(parsed.members) || !Array.isArray(parsed.visits)) {
        throw new Error('invalid');
      }
      state=normalizeState(parsed);
      saveState(); closeModal(); render(); toast('资料恢复成功');
    } catch(err) {
      toast('无法读取备份码，请检查是否完整复制');
    }
    return;
  }
});

/* -------------------- 表单提交 -------------------- */
document.addEventListener('submit', e => {
  const form=e.target.closest('form[data-form]');
  if (!form) return;
  e.preventDefault();
  const fd=new FormData(form);
  const data=Object.fromEntries(fd.entries());
  const type=form.dataset.form;

  if (type==='save-member') {
    const id=form.dataset.id;
    const name=(data.name||'').trim();
    if (!name) { toast('请填写成员姓名'); return; }
    const categoryId=data.categoryId || state.categories[0]?.id;
    const existing=state.members.find(m=>m.id===id);
    const member={
      ...(existing||{}),
      id:id||uid(),
      name,
      categoryId,
      targetOverride:data.targetOverride===''?null:Number(data.targetOverride),
      phone:(data.phone||'').trim(),
      baptized:data.baptized||'unknown',
      school:(data.school||'').trim(),
      className:(data.className||'').trim(),
      dorm:(data.dorm||'').trim(),
      gifts:(data.gifts||'').trim(),
      note:(data.note||'').trim(),
      archived:existing?.archived||false
    };
    if (!existing) {
      const cat=state.categories.find(c=>c.id===categoryId);
      if (cat && Number(cat.extraCount)>0) cat.extraCount--;
      state.members.push(member);
    } else {
      state.members=state.members.map(m=>m.id===id?member:m);
    }
    state.tutorialSeen=true;
    saveState(); closeModal(); render(); toast(existing?'成员资料已更新':'成员已添加');
    return;
  }

  if (type==='save-visit') {
    if (!data.memberId) { toast('请选择被探访成员'); return; }
    state.visits.push({
      id:uid(),date:data.date||todayISO(),
      memberId:data.memberId,visitor:(data.visitor||'').trim(),
      log:(data.log||'').trim(),star:fd.has('star')
    });
    saveState(); closeModal(); render(); toast('探访记录已保存');
    return;
  }

  if (type==='save-meeting') {
    const meeting={
      id:uid(),date:data.date||todayISO(),
      label:(data.label||'团契聚会').trim(),
      records:{}
    };
    state.meetings.push(meeting);
    state.settings.activeMeetingId=meeting.id;
    state.tutorialSeen=true;
    saveState(); currentTab='attendance'; closeModal(); render();
    toast('聚会已创建，请登记出勤');
    return;
  }

  if (type==='save-week') {
    const weekStart=form.dataset.weekStart;
    const existing=state.weeklyLogs.find(l=>l.weekStart===weekStart);
    const log={
      ...(existing||{}),
      id:existing?.id||uid(),
      weekStart,
      summary:(data.summary||'').trim(),
      concerns:(data.concerns||'').trim(),
      next:(data.next||'').trim(),
      updatedAt:new Date().toISOString()
    };
    if (existing) state.weeklyLogs=state.weeklyLogs.map(l=>l.weekStart===weekStart?log:l);
    else state.weeklyLogs.push(log);
    saveState(); render(); toast('本周日志已保存');
    return;
  }

  if (type==='save-settings') {
    if (!data.startDate || !data.endDate || data.startDate>data.endDate) {
      toast('请检查学期起止日期'); return;
    }
    const independentAttendance=fd.has('independentAttendance');
    const independentWeekly=fd.has('independentWeekly');
    const ra={start:data.attStart||data.startDate,end:data.attEnd||data.endDate};
    const rw={start:data.weekStart||data.startDate,end:data.weekEnd||data.endDate};
    if (independentAttendance && !validRange(ra)) { toast('请检查出勤日期'); return; }
    if (independentWeekly && !validRange(rw)) { toast('请检查周报日期'); return; }

    state.settings.semesterName=(data.semesterName||'本学期').trim();
    state.settings.startDate=data.startDate;
    state.settings.endDate=data.endDate;
    state.settings.independentAttendance=independentAttendance;
    state.settings.independentWeekly=independentWeekly;
    state.settings.ranges={
      attendance:independentAttendance?ra:{start:data.startDate,end:data.endDate},
      weekly:independentWeekly?rw:{start:data.startDate,end:data.endDate}
    };
    saveState(); closeModal(); render(); toast('设置已保存');
    return;
  }

  if (type==='save-category') {
    const name=(data.name||'').trim();
    if (!name) { toast('请填写分类名称'); return; }
    state.categories.push({
      id:uid(),name,
      target:Math.max(0,Number(data.target)||0),
      extraCount:Math.max(0,Number(data.extraCount)||0)
    });
    saveState(); openSettings(); render(); toast('分类已添加');
    return;
  }
});

/* -------------------- 其他输入变化 -------------------- */
document.addEventListener('change', e => {
  const el=e.target;
  if (el.matches('[data-field="active-meeting"]')) {
    state.settings.activeMeetingId=el.value;
    saveState(); render(); return;
  }
  if (el.matches('[data-cat-id][data-cat-field]')) {
    const c=state.categories.find(x=>x.id===el.dataset.catId);
    if (!c) return;
    const field=el.dataset.catField;
    if (field==='name') c.name=el.value.trim()||'未命名分类';
    else c[field]=Math.max(0,Number(el.value)||0);
    saveState(); render(); return;
  }
});

document.addEventListener('input', e => {
  const el=e.target;
  if (el.matches('[data-field="member-search"]')) {
    memberQuery=el.value;
    renderMemberList();
  }
});

$('#modal-root').addEventListener('click', e => {
  if (e.target.classList.contains('modal-backdrop')) closeModal();
});

/* -------------------- 启动 -------------------- */
render();

if (!state.tutorialSeen &&
    state.members.length===0 &&
    state.visits.length===0 &&
    state.meetings.length===0) {
  openTutorial();
}

setInterval(() => {
  const el=$('#today-label');
  if (el) el.textContent=humanToday();
},60000);
</script>
</body>
</html>
