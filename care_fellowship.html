    <header class="topbar"><div class="crumb">同行 <span style="padding:0 5px;color:#b6c0b8">/</span> <strong id="crumbCurrent">总览</strong></div><div class="top-actions"><div class="save-indicator"><span></span><b id="saveStatus">本地加密保存</b></div><div class="term-pill" id="termPill">学期未设置</div></div></header>
    <div id="appContent"></div>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
(() => {
'use strict';
const STORAGE_KEY = 'tongxing_care_v1_encrypted';
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => [...root.querySelectorAll(sel)];
let db = null, vaultKey = null, vaultSalt = null, view = 'dashboard';
let memberFormOpen = false, editingMemberId = null, editingVisitId = null, editingAttendanceId = null, editingWeeklyId = null;
let categoryFormOpen = false, weeklyFormOpen = false, selectedWeekStart = null, memberSearch = '', memberCategoryFilter = 'all', memberStatusFilter = 'active';
let returnReminderDays = 0, saveChain = Promise.resolve(), toastTimer = null;
const viewTitles = {dashboard:'总览',visits:'探访计划',attendance:'出勤记录',members:'成员档案',weekly:'每周日志',settings:'设置与备份'};
const statusLabels = {present:'出席',absent:'缺席',excused:'请假',unrecorded:'未记录'};
const statusPills = {present:'green',absent:'red',excused:'gold',unrecorded:''};
function esc(v){return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function id(prefix='id'){return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function localDate(s){if(!s)return new Date();const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d,12,0,0);}
function isoDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function addDays(s,n){const d=localDate(s);d.setDate(d.getDate()+n);return isoDate(d);}
function fmtDate(s, short=false){if(!s)return '未设置';const d=localDate(s);return short?`${d.getMonth()+1}/${d.getDate()}`:`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;}
function fmtDateRange(a,b){return `${fmtDate(a)} — ${fmtDate(b)}`;}
function daysBetween(a,b){return Math.round((localDate(b)-localDate(a))/86400000);}
function defaultTerm(){const now=new Date(), y=now.getFullYear(), m=now.getMonth();const start=m>=6?`${y}-07-01`:`${y}-01-01`;const end=m>=6?`${y}-12-31`:`${y}-06-30`;return {start,end,name:`${y}${m>=6?'下半年':'上半年'}学期`};}
function defaultDB(){const t=defaultTerm();return {version:1,settings:{termStart:t.start,termEnd:t.end,termName:t.name,lastOpenedAt:null,planningExtraMembers:0,planningExtraTarget:2,reminderDay:'MO',reminderTime:'09:00',categories:[{id:'cat_general',name:'普通成员',target:2},{id:'cat_youth',name:'青年成员',target:2},{id:'cat_new',name:'新朋友',target:3},{id:'cat_senior',name:'年长成员',target:2}]},moduleRanges:{visits:{independent:false,start:t.start,end:t.end},attendance:{independent:false,start:t.start,end:t.end},weekly:{independent:false,start:t.start,end:t.end}},members:[],visits:[],attendanceSessions:[],weeklyLogs:[],goalPlan:null};}
function normalizeDB(d){const base=defaultDB();if(!d||typeof d!=='object')return base;const out={...base,...d};out.settings={...base.settings,...(d.settings||{})};out.settings.categories=Array.isArray(out.settings.categories)&&out.settings.categories.length?out.settings.categories:base.settings.categories;out.moduleRanges={...base.moduleRanges,...(d.moduleRanges||{})};for(const k of ['visits','attendance','weekly'])out.moduleRanges[k]={...base.moduleRanges[k],...(out.moduleRanges[k]||{})};out.members=Array.isArray(d.members)?d.members:[];out.visits=Array.isArray(d.visits)?d.visits:[];out.attendanceSessions=Array.isArray(d.attendanceSessions)?d.attendanceSessions:[];out.weeklyLogs=Array.isArray(d.weeklyLogs)?d.weeklyLogs:[];return out;}
function bytesToB64(bytes){let bin='';for(let i=0;i<bytes.length;i++)bin+=String.fromCharCode(bytes[i]);return btoa(bin);}
function b64ToBytes(str){const bin=atob(str);const arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);return arr;}
async function deriveKey(password,salt){if(!window.crypto||!crypto.subtle)throw new Error('当前浏览器不支持所需的本地加密功能，请使用新版 Chrome、Edge 或 Safari。');const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encryptBlob(data,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(data)));return {app:'tongxing-care',version:1,salt:bytesToB64(salt),iv:bytesToB64(iv),ciphertext:bytesToB64(new Uint8Array(cipher)),updatedAt:new Date().toISOString()};}
async function decryptBlob(blob,password){if(!blob||blob.app!=='tongxing-care'||!blob.salt||!blob.iv||!blob.ciphertext)throw new Error('这不是有效的“同行”加密备份文件。');const salt=b64ToBytes(blob.salt),iv=b64ToBytes(blob.iv),key=await deriveKey(password,salt);const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,b64ToBytes(blob.ciphertext));return {data:normalizeDB(JSON.parse(new TextDecoder().decode(plain))),key,salt};}
function setSaveStatus(t){const el=$('#saveStatus');if(el)el.textContent=t;}
function persist(){if(!db||!vaultKey||!vaultSalt)return;const snapshot=JSON.stringify(db);saveChain=saveChain.then(async()=>{const blob=await encryptBlob(JSON.parse(snapshot),vaultKey,vaultSalt);localStorage.setItem(STORAGE_KEY,JSON.stringify(blob));setSaveStatus('本地加密保存');}).catch(err=>{console.error(err);setSaveStatus('保存失败');showToast('本地保存失败。请先导出可用备份，并检查浏览器存储权限。',4200);});}
function showToast(message,ms=2600){const el=$('#toast');if(!el)return;el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),ms);}
function gateTemplate(mode,error=''){const create=mode==='create';return `<div class="gate-brand"><div class="brand-mark"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 27S4.5 20.2 4.5 11.7A6.2 6.2 0 0 1 16 8.4a6.2 6.2 0 0 1 11.5 3.3C27.5 20.2 16 27 16 27Z"/><path d="M16 9v11M11 14h10"/></svg></div><div><div class="brand-name" style="color:var(--ink);font-size:20px">同行</div><div class="brand-sub" style="color:var(--muted)">CARE & FELLOWSHIP</div></div></div><div class="eyebrow">本地加密资料库</div><h1>${create?'创建你的关怀资料库':'欢迎回来'}</h1><p>${create?'第一次使用，请设置一个独立的储存码。成员资料会加密后保存在当前浏览器中，不会自动上传到网络。':'请输入储存码解锁本地资料库。储存码不会保存在资料库中。'}</p><form id="gateForm" data-mode="${create?'create':'unlock'}"><div class="field"><label for="gatePassword">${create?'设置储存码':'储存码'}</label><input id="gatePassword" name="password" type="password" autocomplete="${create?'new-password':'current-password'}" minlength="8" required placeholder="至少 8 个字符"></div>${create?`<div class="field"><label for="gateConfirm">再次输入储存码</label><input id="gateConfirm" name="confirm" type="password" autocomplete="new-password" minlength="8" required placeholder="再次确认，避免输错"></div>`:''}<button class="btn primary" type="submit">${create?'创建并进入资料库':'解锁资料库'} <span>→</span></button></form>${error?`<p class="gate-error">${esc(error)}</p>`:''}<p class="gate-note">隐私提示：请勿使用容易猜到的密码。忘记储存码可能导致资料无法恢复；请在设置中定期导出加密备份。此版本无需网络服务，但资料与当前浏览器的本地存储绑定。</p>`;}
function showGate(mode,error=''){ $('#appShell').classList.add('hidden');$('#vaultGate').classList.remove('hidden');$('#gateCard').innerHTML=gateTemplate(mode,error); }
function openApp(){ $('#vaultGate').classList.add('hidden');$('#appShell').classList.remove('hidden');const prev=db.settings.lastOpenedAt;if(prev){const gap=Math.floor((Date.now()-new Date(prev).getTime())/86400000);if(gap>=7)returnReminderDays=gap;}db.settings.lastOpenedAt=new Date().toISOString();persist();render(); }
async function init(){try{const saved=localStorage.getItem(STORAGE_KEY);if(saved){showGate('unlock');}else{showGate('create');}}catch(e){showGate('create','浏览器暂时无法读取本地存储，请检查隐私模式或站点存储权限。');}}
function getRange(module){const r=db.moduleRanges[module];if(r&&r.independent)return {start:r.start||db.settings.termStart,end:r.end||db.settings.termEnd,independent:true};return {start:db.settings.termStart,end:db.settings.termEnd,independent:false};}
function inRange(date,range){return !!date&&date>=range.start&&date<=range.end;}
function activeMembers(){return db.members.filter(m=>m.active!==false);}
function memberById(mid){return db.members.find(m=>m.id===mid);}
function categoryById(cid){return db.settings.categories.find(c=>c.id===cid)||{name:'未分类',target:0};}
function targetForMember(m){if(m.targetOverride!==null&&m.targetOverride!==undefined&&m.targetOverride!=='')return Math.max(0,Number(m.targetOverride)||0);return Math.max(0,Number(categoryById(m.categoryId).target)||0);}
function visitRecordsInRange(range){return db.visits.filter(v=>inRange(v.date,range));}
function visitCounts(range,onlyActive=true){const counts={};for(const v of visitRecordsInRange(range)){const m=memberById(v.memberId);if(onlyActive&&(!m||m.active===false))continue;counts[v.memberId]=(counts[v.memberId]||0)+1;}return counts;}
function goalMetrics(){const range=getRange('visits'),members=activeMembers(),counts=visitCounts(range,true);let target=0,completedToward=0,remaining=0,over=0,eligible=0;for(const m of members){const t=targetForMember(m),c=counts[m.id]||0;target+=t;if(t>0)eligible++;completedToward+=Math.min(c,t);remaining+=Math.max(t-c,0);over+=Math.max(c-t,0);}const estimatedMembers=Math.max(0,Number(db.settings.planningExtraMembers)||0),estimatedPerTarget=Math.max(0,Number(db.settings.planningExtraTarget)||0),estimatedTarget=estimatedMembers*estimatedPerTarget;target+=estimatedTarget;remaining+=estimatedTarget;if(estimatedTarget>0)eligible+=estimatedMembers;const actual=Object.values(counts).reduce((a,b)=>a+b,0);const days=Math.max(1,daysBetween(range.start,range.end)+1),weeks=Math.max(1,days/7),months=Math.max(1,days/30.4375);return {range,members,counts,target,completedToward,remaining,over,actual,eligible,estimatedMembers,estimatedTarget,days,weeks,months,rate:target?Math.round(completedToward/target*100):0,perWeek:target/weeks,perMonth:target/months,peoplePerWeek:eligible/weeks,peoplePerMonth:eligible/months};}
function goalSignature(){const range=getRange('visits');return JSON.stringify({start:range.start,end:range.end,members:activeMembers().map(m=>[m.id,targetForMember(m)]).sort((a,b)=>a[0].localeCompare(b[0])),planningExtraMembers:Number(db.settings.planningExtraMembers)||0,planningExtraTarget:Number(db.settings.planningExtraTarget)||0});}
function attendanceMetrics(){const range=getRange('attendance'),sessions=db.attendanceSessions.filter(s=>inRange(s.date,range)).sort((a,b)=>a.date.localeCompare(b.date));let present=0,absent=0,excused=0,unrecorded=0;for(const s of sessions)for(const m of activeMembers()){const st=(s.records||{})[m.id]||'unrecorded';if(st==='present')present++;else if(st==='absent')absent++;else if(st==='excused')excused++;else unrecorded++;}const denominator=present+absent;return {range,sessions,present,absent,excused,unrecorded,denominator,rate:denominator?Math.round(present/denominator*100):0};}
function memberAttendanceStats(mid){const range=getRange('attendance'),sessions=db.attendanceSessions.filter(s=>inRange(s.date,range));let present=0,absent=0,excused=0;for(const s of sessions){const st=(s.records||{})[mid]||'unrecorded';if(st==='present')present++;if(st==='absent')absent++;if(st==='excused')excused++;}const d=present+absent;return {present,absent,excused,rate:d?Math.round(present/d*100):null,recorded:d+excused};}
function weekRanges(start,end){const arr=[];if(!start||!end||start>end)return arr;let s=start,guard=0;while(s<=end&&guard++<100){const e=addDays(s,6)>end?end:addDays(s,6);arr.push({start:s,end:e});s=addDays(s,7);}return arr;}
function currentWeekRange(){const now=todayISO();const range=getRange('weekly');const weeks=weekRanges(range.start,range.end);return weeks.find(w=>now>=w.start&&now<=w.end)||weeks[0]||{start:range.start,end:range.end};}
function lastVisitDate(mid){const arr=db.visits.filter(v=>v.memberId===mid).sort((a,b)=>b.date.localeCompare(a.date));return arr[0]?.date||null;}
function getMemberVisitStats(mid){const range=getRange('visits'),count=db.visits.filter(v=>v.memberId===mid&&inRange(v.date,range)).length;const m=memberById(mid);const target=m?targetForMember(m):0;return {count,target,remaining:Math.max(target-count,0),rate:target?Math.min(100,Math.round(count/target*100)):0};}
function avatarText(name){const s=String(name||'?').trim();return esc(s.slice(-1)||'?');}
function dateRangeControl(module,label){const r=db.moduleRanges[module],range=getRange(module);return `<div class="range-strip"><div class="range-info"><div class="range-symbol">⌁</div><div><strong>${esc(label)}时间范围</strong><span>${esc(fmtDateRange(range.start,range.end))} · ${range.independent?'独立范围':'跟随统一学期'}</span></div></div>${range.independent?`<form class="range-form" id="rangeForm_${module}" data-module="${module}"><div class="field"><label>开始日期</label><input type="date" name="start" value="${esc(range.start)}" required></div><div class="field"><label>结束日期</label><input type="date" name="end" value="${esc(range.end)}" required></div><button class="btn small-btn primary" type="submit">应用</button><button class="btn small-btn" type="button" data-action="toggle-range" data-module="${module}">恢复统一</button></form>`:`<button class="btn small-btn" type="button" data-action="toggle-range" data-module="${module}">设置独立范围</button>`}</div>`;}
function emptyState(icon,title,desc,button=''){return `<div class="empty"><div class="empty-icon">${icon}</div><strong>${esc(title)}</strong><div>${esc(desc)}</div>${button?`<div style="margin-top:13px">${button}</div>`:''}</div>`;}
function statCard(label,value,foot,icon){return `<div class="card stat-card"><div class="stat-top"><div class="stat-label">${esc(label)}</div><div class="stat-icon">${icon}</div></div><div class="stat-value">${value}</div><div class="stat-foot">${foot}</div></div>`;}
function renderDashboard(){const g=goalMetrics(),a=attendanceMetrics(),thisWeek=currentWeekRange();const visitsThisWeek=db.visits.filter(v=>inRange(v.date,thisWeek)).length;const sessionsThisWeek=db.attendanceSessions.filter(s=>inRange(s.date,thisWeek)).length;const lastVisits=visitRecordsInRange(g.range).sort((x,y)=>y.date.localeCompare(x.date)).slice(0,4);const unvisited=g.members.filter(m=>targetForMember(m)>0&&(g.counts[m.id]||0)===0).length;const confirmed=db.goalPlan&&db.goalPlan.signature===goalSignature();const term=fmtDateRange(db.settings.termStart,db.settings.termEnd);return `<div class="page-head"><div><div class="eyebrow">本周关怀 · 计划与复盘</div><h1>让每一份关怀，都有着落。</h1><p>把成员放在计划中心，让探访、出勤与每周跟进形成连续的关怀记录。</p></div><div class="page-actions"><button class="btn" data-view="settings">学期设置</button><button class="btn primary" data-view="visits">＋ 记录探访</button></div></div>${returnReminderDays>=7?`<div class="callout"><strong>欢迎回来。</strong> 距离上次打开同行约 ${returnReminderDays} 天。建议先检查本周探访、出勤与待跟进事项。<button class="btn small-btn" style="margin-left:8px" data-action="dismiss-return">知道了</button></div>`:''}<section class="hero-card"><div><div class="eyebrow">${esc(db.settings.termName||'当前学期')}</div><h2>关怀不是一次性的行动，<br>而是持续看见一个人。</h2><p>当前学期范围：${esc(term)}。先设定清楚目标，再用每一次真实记录，检视团队有没有照顾到每一位成员。</p><div class="footer-actions"><button class="btn primary" data-view="visits">查看探访进度 <span>→</span></button><button class="btn" data-view="members">查看成员档案</button></div></div><div class="hero-side"><div class="progress-head"><span>本学期探访目标完成率</span><strong>${g.rate}%</strong></div><div class="progress-track"><div class="progress-fill" style="width:${g.rate}%"></div></div><div class="progress-meta"><span>已完成目标 ${g.completedToward}</span><span>总目标 ${g.target}</span></div><div style="display:flex;justify-content:space-between;gap:12px;margin-top:18px;padding-top:14px;border-top:1px solid #dce7dd"><div><div class="small muted">每周平均目标</div><strong style="font-size:20px">${g.perWeek.toFixed(1)} <span class="small muted">次</span></strong></div><div><div class="small muted">待完成</div><strong style="font-size:20px;color:${g.remaining?'#9b6b1c':'var(--green)'}">${g.remaining} <span class="small muted">次</span></strong></div></div></div></section><div class="grid stats-grid">${statCard('规划成员数',g.members.length+g.estimatedMembers,`档案 ${g.members.length} 人 · 估算 ${g.estimatedMembers} 人`,'♧')}${statCard('实际探访',g.actual,`目标完成 ${g.completedToward} 次`,'♡')}${statCard('尚未完成',g.remaining,`另有 ${g.over} 次超出个人目标`,'↗')}${statCard('整体出勤率',`${a.rate}%`,`本学期 ${a.sessions.length} 场聚会`,'▦')}</div><div class="grid two-col"><section class="card card-pad"><div class="section-head"><div><h2>本周工作概况</h2><p>${esc(fmtDateRange(thisWeek.start,thisWeek.end))}</p></div><span class="pill green">本周</span></div><div class="list-stack"><div class="mini-row"><div class="stat-icon">♡</div><div class="mini-main"><div class="mini-title">探访记录</div><div class="mini-sub">本周实际完成的探访次数</div></div><div class="mini-value">${visitsThisWeek} 次</div></div><div class="mini-row"><div class="stat-icon" style="background:var(--blue-bg);color:var(--blue)">▦</div><div class="mini-main"><div class="mini-title">聚会记录</div><div class="mini-sub">本周已登记的聚会场次</div></div><div class="mini-value">${sessionsThisWeek} 场</div></div><div class="mini-row"><div class="stat-icon" style="background:var(--gold-bg);color:#916b24">◎</div><div class="mini-main"><div class="mini-title">尚未被探访</div><div class="mini-sub">本学期目标大于 0，但还没有探访记录</div></div><div class="mini-value">${unvisited} 人</div></div></div><div style="margin-top:14px"><button class="btn" data-view="weekly">打开每周日志 →</button></div></section><section class="card card-pad"><div class="section-head"><div><h2>最近探访</h2><p>根据已记录的日期排序</p></div><button class="btn small-btn" data-view="visits">全部记录</button></div>${lastVisits.length?`<div class="list-stack">${lastVisits.map(v=>{const m=memberById(v.memberId);return `<div class="mini-row"><div class="avatar">${avatarText(m?.name||v.memberNameSnapshot)}</div><div class="mini-main"><div class="mini-title">${esc(m?.name||v.memberNameSnapshot||'已归档成员')} ${v.starred?'<span class="star">★</span>':''}</div><div class="mini-sub">${esc(fmtDate(v.date))} · ${esc(currentVisitorNames(v).join('、')||'未填写探访同工')}</div></div><div class="mini-value">已记录</div></div>`}).join('')}</div>`:emptyState('♡','还没有探访记录','记录第一次探访后，这里会显示最近的关怀动态。',`<button class="btn primary" data-view="visits">记录第一次探访</button>`)}</section></div><div style="margin-top:15px" class="callout blue"><strong>工作提醒：</strong> ${confirmed?'当前探访目标已确认。':'探访目标尚未确认；请在“探访计划”中检查分类与个人目标，再确认本学期计划。'}${g.members.length===0?' 当前还没有成员档案，可以先录入成员。':''}</div>`;}

function renderPlanningEstimate(g){return `<section class="card card-pad" style="margin-top:16px"><div class="section-head"><div><h2>未建档成员估算</h2><p>如果暂时不想录入所有成员，可以先用人数估算目标；录入档案后请把估算人数调回 0，避免重复计算。</p></div><span class="pill gold">可选</span></div><form id="planningEstimateForm"><div class="form-grid"><div class="field"><label>尚未录入档案的人数</label><input name="planningExtraMembers" type="number" min="0" max="9999" value="${Number(db.settings.planningExtraMembers)||0}" required></div><div class="field"><label>估算成员每人每学期探访目标</label><input name="planningExtraTarget" type="number" min="0" max="999" value="${Number(db.settings.planningExtraTarget)||0}" required></div></div><div class="form-actions"><button class="btn primary" type="submit">保存估算</button></div></form><div class="small muted">当前额外估算：${g.estimatedMembers} 人 · ${g.estimatedTarget} 次探访目标。估算成员没有个人记录，不能用于出勤统计。</div></section>`;}

function renderCategorySettings(){return `<section class="card card-pad" style="margin-top:16px"><div class="section-head"><div><h2>分类与默认探访目标</h2><p>每个成员只能有一个“目标分类”，避免同一成员被重复计入总目标。</p></div><button class="btn small-btn" data-action="add-category">＋ 新增分类</button></div>${categoryFormOpen?`<form id="categoryForm" class="form-grid" style="padding:13px;background:#f7faf6;border-radius:12px;margin-bottom:13px"><div class="field"><label>分类名称</label><input name="name" required maxlength="40" placeholder="例如：初信者"></div><div class="field"><label>每人每学期探访目标（次）</label><input name="target" type="number" min="0" max="999" value="2" required></div><div class="form-actions full"><button class="btn" type="button" data-action="cancel-category">取消</button><button class="btn primary" type="submit">添加分类</button></div></form>`:''}<form id="categorySettingsForm"><div class="category-grid">${db.settings.categories.map(c=>`<div class="category-item"><div class="field"><label>分类名称</label><input name="name_${esc(c.id)}" value="${esc(c.name)}" required maxlength="40"></div><div class="field" style="max-width:110px"><label>目标 / 人</label><input name="target_${esc(c.id)}" type="number" min="0" max="999" value="${Number(c.target)||0}" required></div></div>`).join('')}</div><div class="form-actions"><button class="btn primary" type="submit">保存分类与目标</button></div></form></section>`;}
function renderVisits(){const g=goalMetrics(),range=g.range;const editing=editingVisitId?db.visits.find(v=>v.id===editingVisitId):null;const active=activeMembers();const selectedVisitors=editing?.visitorIds||[];const editTarget=editing?memberById(editing.memberId):null;const currentVisits=visitRecordsInRange(range).sort((a,b)=>b.date.localeCompare(a.date));const confirmed=db.goalPlan&&db.goalPlan.signature===goalSignature();return `<div class="page-head"><div><div class="eyebrow">模块 01 / 计划与执行</div><h1>探访计划</h1><p>先确定每个人应被关怀的频率，再用真实记录衡量进度。目标由成员档案与分类规则自动汇总。</p></div><div class="page-actions"><button class="btn" data-action="export-backup">导出加密备份</button><button class="btn primary" data-action="toggle-visit-form">${editing?'取消编辑':'+ 记录探访'}</button></div></div>${dateRangeControl('visits','探访计划')}${editing||window.showVisitForm?renderVisitForm(editing,active):''}<div class="grid stats-grid">${statCard('总目标',g.target,`${g.eligible} 位成员有探访目标`,'◎')}${statCard('实际探访',g.actual,`计入目标 ${g.completedToward} 次`,'♡')}${statCard('待完成目标',g.remaining,`超出个人目标 ${g.over} 次`,'↗')}${statCard('目标完成率',`${g.rate}%`,`每周约 ${g.perWeek.toFixed(1)} 次`,'◷')}</div><div class="grid two-col"><section class="card card-pad"><div class="section-head"><div><h2>目标执行进度</h2><p>按成员逐一计算，避免分类目标重复统计</p></div><span class="pill ${confirmed?'green':'gold'}">${confirmed?'目标已确认':'待确认'}</span></div><div class="progress-track" style="height:11px"><div class="progress-fill" style="width:${g.rate}%"></div></div><div class="progress-meta"><span>${g.completedToward} / ${g.target} 次目标已完成</span><span>${g.remaining} 次待完成</span></div><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:18px"><div class="mini-row" style="display:block"><div class="small muted">平均每周需探访</div><strong style="font-size:22px">${g.perWeek.toFixed(1)} <span class="small muted">次</span></strong><div class="small muted">约 ${g.peoplePerWeek.toFixed(1)} 位不同成员 / 周</div></div><div class="mini-row" style="display:block"><div class="small muted">平均每月需探访</div><strong style="font-size:22px">${g.perMonth.toFixed(1)} <span class="small muted">次</span></strong><div class="small muted">约 ${g.peoplePerMonth.toFixed(1)} 位不同成员 / 月</div></div></div><div style="margin-top:15px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" data-action="confirm-goal">${confirmed?'重新确认当前目标':'确认本学期目标'}</button><span class="small muted" style="align-self:center">成员、分类目标或日期变更后，需要重新确认。</span></div></section><section class="card card-pad"><div class="section-head"><div><h2>个人目标清单</h2><p>可在成员档案中为个人设置目标覆盖值</p></div></div>${g.members.length?`<div class="list-stack">${g.members.slice().sort((a,b)=>{const ar=g.counts[a.id]||0,br=g.counts[b.id]||0;return (ar/Math.max(1,targetForMember(a)))-(br/Math.max(1,targetForMember(b)));}).slice(0,8).map(m=>{const t=targetForMember(m),c=g.counts[m.id]||0,rate=t?Math.min(100,Math.round(c/t*100)):100;return `<div><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:5px"><div style="font-size:12px;font-weight:750">${esc(m.name)} <span class="muted" style="font-weight:400">· ${esc(categoryById(m.categoryId).name)}</span></div><div style="font-size:11px;font-weight:750">${c}/${t}</div></div><div class="progress-track" style="height:6px;margin:0"><div class="progress-fill" style="width:${rate}%;background:${rate>=100?'#7b9d80':'var(--green)'}"></div></div></div>`}).join('')}</div>${g.members.length>8?`<div style="margin-top:12px"><button class="btn small-btn" data-view="members">查看全部成员</button></div>`:''}`:emptyState('♧','先建立成员档案','目标是按成员计算的。请先添加成员，再为各分类设定每学期目标。',`<button class="btn primary" data-view="members">添加成员</button>`)}</section></div>${renderPlanningEstimate(g)}${renderCategorySettings()}<section class="card card-pad" style="margin-top:16px"><div class="section-head"><div><h2>探访记录</h2><p>${esc(fmtDateRange(range.start,range.end))} · 每条记录计为一次探访</p></div><span class="pill">${currentVisits.length} 条记录</span></div>${currentVisits.length?`<div class="record-list">${currentVisits.map(v=>renderVisitRecord(v)).join('')}</div>`:emptyState('♡','还没有探访记录','每次探访完成后，请记录被探访成员、探访同工与日期。')}</section>`;}
function renderVisitForm(editing,active){const visitors=editing?.visitorIds||[];return `<section class="card card-pad form-card"><div class="section-head"><div><h2>${editing?'编辑探访记录':'记录一次探访'}</h2><p>日志内容会自动出现在对应周的工作日志中。</p></div><button class="btn small-btn" type="button" data-action="cancel-visit-form">取消</button></div><form id="visitForm"><input type="hidden" name="id" value="${esc(editing?.id||'')}"><div class="form-grid"><div class="field"><label>被探访成员 *</label><select name="memberId" required><option value="">选择成员</option>${active.map(m=>`<option value="${esc(m.id)}" ${editing?.memberId===m.id?'selected':''}>${esc(m.name)} · ${esc(categoryById(m.categoryId).name)}</option>`).join('')}</select></div><div class="field"><label>探访日期 *</label><input type="date" name="date" required value="${esc(editing?.date||todayISO())}"></div><div class="field full"><label>探访同工（可多选）</label><div class="tag-list" style="border:1px solid #dfe6df;border-radius:11px;padding:10px;max-height:155px;overflow:auto">${active.length?active.map(m=>`<label class="inline-check" style="padding:4px 6px;border-radius:7px;background:${visitors.includes(m.id)?'#e5f0e6':'#f8faf7'}"><input type="checkbox" name="visitorIds" value="${esc(m.id)}" ${visitors.includes(m.id)?'checked':''}>${esc(m.name)}</label>`).join(''):'<span class="muted small">请先添加成员档案</span>'}</div><div class="small muted">如果探访同工不在成员名单中，可在下方备注中补充。</div></div><div class="field full"><label>关怀日志</label><textarea id="visitNotes" name="notes" placeholder="记录谈话重点、实际需要、代祷事项与后续跟进……">${esc(editing?.notes||'')}</textarea><div class="note-helper"><button class="btn small-btn" type="button" data-action="insert-numbering">插入 1 / 2 / 3 标点</button><span class="small muted" style="align-self:center">建议记录事实与后续行动，避免不必要的敏感细节。</span></div></div><div class="field full"><label class="inline-check"><input type="checkbox" name="starred" ${editing?.starred?'checked':''}> 标记为重点跟进</label></div></div><div class="form-actions"><button class="btn" type="button" data-action="cancel-visit-form">取消</button><button class="btn primary" type="submit">${editing?'保存修改':'保存探访记录'}</button></div></form></section>`;}
function currentVisitorNames(v){const names=(v.visitorIds||[]).map(mid=>memberById(mid)?.name).filter(Boolean);return names.length?names:(v.visitorNamesSnapshot||[]);}
function renderVisitRecord(v){const m=memberById(v.memberId);const name=m?.name||v.memberNameSnapshot||'已归档成员';const visitors=currentVisitorNames(v).join('、')||'未填写';return `<details class="record"><summary><div class="record-date">${esc(fmtDate(v.date,true))}<br><span style="font-size:9px;font-weight:500">${esc(localDate(v.date).getFullYear())}</span></div><div class="record-main"><strong>${esc(name)} ${v.starred?'<span class="star">★ 重点跟进</span>':''}</strong><span>探访同工：${esc(visitors)}</span></div><span class="chevron">⌄</span></summary><div class="record-detail"><div class="small muted">记录日期：${esc(fmtDate(v.date))}</div><div class="record-notes">${esc(v.notes||'暂无文字日志')}</div><div class="record-actions"><button class="btn small-btn" data-action="edit-visit" data-id="${esc(v.id)}">编辑</button><button class="btn small-btn" data-action="toggle-star" data-id="${esc(v.id)}">${v.starred?'取消重点标记':'标记为重点'}</button><button class="btn small-btn danger" data-action="delete-visit" data-id="${esc(v.id)}">删除记录</button></div></div></details>`;}
function renderMembers(){const categories=db.settings.categories;const list=db.members.filter(m=>memberStatusFilter==='archived'?m.active===false:m.active!==false).filter(m=>memberCategoryFilter==='all'||m.categoryId===memberCategoryFilter).filter(m=>{const q=memberSearch.trim().toLowerCase();if(!q)return true;return [m.name,m.phone,m.school,m.className,m.dorm,categoryById(m.categoryId).name,m.gifts,m.notes].some(x=>String(x||'').toLowerCase().includes(q));});return `<div class="page-head"><div><div class="eyebrow">模块 03 / 统一成员资料</div><h1>成员档案</h1><p>所有模块共用这一份成员名单。归档成员会从当前目标中移出，但历史记录仍然保留。</p></div><div class="page-actions"><button class="btn" data-action="export-members-csv">导出成员 CSV</button><button class="btn primary" data-action="add-member">＋ 添加成员</button></div></div>${memberFormOpen?renderMemberForm(editingMemberId?memberById(editingMemberId):null):''}<div class="toolbar"><div class="field"><label>搜索成员</label><input id="memberSearch" type="search" value="${esc(memberSearch)}" placeholder="姓名、电话、学校、寝室或备注"></div><div class="field" style="max-width:190px"><label>目标分类</label><select id="memberCategoryFilter"><option value="all">全部分类</option>${categories.map(c=>`<option value="${esc(c.id)}" ${memberCategoryFilter===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field" style="max-width:150px"><label>成员状态</label><select id="memberStatusFilter"><option value="active" ${memberStatusFilter==='active'?'selected':''}>当前成员</option><option value="archived" ${memberStatusFilter==='archived'?'selected':''}>已归档</option></select></div></div><div class="section-head"><div><h2>${memberStatusFilter==='archived'?'已归档成员':'当前成员'} <span class="muted" style="font-weight:500">${list.length}</span></h2><p>点开卡片可查看档案、探访与出勤数据。</p></div></div><div id="memberList" class="member-grid">${list.length?list.map(m=>renderMemberCard(m)).join(''):emptyState('♧',memberSearch?'没有找到匹配成员':'还没有成员档案',memberSearch?'尝试更换搜索关键词或分类。':'先录入成员，探访计划与出勤记录才有统一的数据来源。',memberStatusFilter==='active'?`<button class="btn primary" data-action="add-member">添加第一位成员</button>`:'')}</div>`;}
function renderMemberForm(m){const cats=db.settings.categories;return `<section class="card card-pad form-card"><div class="section-head"><div><h2>${m?'编辑成员档案':'添加成员'}</h2><p>姓名和分类是计划与统计的基础字段。</p></div><button class="btn small-btn" data-action="cancel-member">取消</button></div><form id="memberForm"><input type="hidden" name="id" value="${esc(m?.id||'')}"><div class="form-grid"><div class="field"><label>姓名 *</label><input name="name" required maxlength="80" value="${esc(m?.name||'')}" placeholder="成员姓名"></div><div class="field"><label>目标分类 *</label><select name="categoryId" required>${cats.map(c=>`<option value="${esc(c.id)}" ${(m?.categoryId||cats[0]?.id)===c.id?'selected':''}>${esc(c.name)}（默认 ${Number(c.target)||0} 次）</option>`).join('')}</select></div><div class="field"><label>联系电话</label><input name="phone" value="${esc(m?.phone||'')}" placeholder="可留空"></div><div class="field"><label>学校 / 工作单位</label><input name="school" value="${esc(m?.school||'')}" placeholder="学校或单位"></div><div class="field"><label>班级 / 年级</label><input name="className" value="${esc(m?.className||'')}" placeholder="例如：高二（3）班"></div><div class="field"><label>寝室号 / 住址提示</label><input name="dorm" value="${esc(m?.dorm||'')}" placeholder="按实际需要填写"></div><div class="field"><label>是否受洗</label><select name="baptized"><option value="unknown" ${(m?.baptized||'unknown')==='unknown'?'selected':''}>未填写</option><option value="yes" ${m?.baptized==='yes'?'selected':''}>已受洗</option><option value="no" ${m?.baptized==='no'?'selected':''}>尚未受洗</option></select></div><div class="field"><label>恩赐 / 服侍方向</label><input name="gifts" value="${esc(m?.gifts||'')}" placeholder="例如：接待、音乐、关怀"></div><div class="field"><label>个人探访目标覆盖（次）</label><input name="targetOverride" type="number" min="0" max="999" value="${esc(m?.targetOverride??'')}" placeholder="留空则使用分类默认目标"></div><div class="field"><label>档案状态</label><div class="input" style="background:#f8faf7;color:var(--muted)">${m?.active===false?'已归档':'当前成员'}</div></div><div class="field full"><label>自定义备注</label><textarea name="notes" placeholder="只记录开展关怀确有需要的信息。">${esc(m?.notes||'')}</textarea></div></div><div class="form-actions"><button class="btn" type="button" data-action="cancel-member">取消</button><button class="btn primary" type="submit">${m?'保存成员资料':'添加成员'}</button></div></form></section>`;}
function renderMemberCard(m){const vs=getMemberVisitStats(m.id),as=memberAttendanceStats(m.id);const range=getRange('visits');const bapt=m.baptized==='yes'?'已受洗':m.baptized==='no'?'尚未受洗':'未填写';const countAll=db.visits.filter(v=>v.memberId===m.id&&inRange(v.date,range)).length;return `<details class="card member-card"><summary class="member-summary"><div class="avatar">${avatarText(m.name)}</div><div class="member-summary-main"><strong>${esc(m.name)}</strong><div class="subline">${esc(categoryById(m.categoryId).name)} · ${esc(m.school||'未填写学校/单位')}</div></div><div class="member-summary-side"><strong>${countAll}/${vs.target} 次</strong><span>探访进度</span></div><span class="chevron">⌄</span></summary><div class="member-details"><div class="member-kpis"><div class="member-kpi"><strong>${countAll}</strong><span>本期探访次数</span></div><div class="member-kpi"><strong>${as.rate===null?'—':as.rate+'%'}</strong><span>出勤率</span></div><div class="member-kpi"><strong>${vs.remaining}</strong><span>待探访次数</span></div></div><div class="detail-grid"><div class="detail-cell"><span>联系电话</span><strong>${esc(m.phone||'未填写')}</strong></div><div class="detail-cell"><span>班级 / 年级</span><strong>${esc(m.className||'未填写')}</strong></div><div class="detail-cell"><span>寝室 / 住址提示</span><strong>${esc(m.dorm||'未填写')}</strong></div><div class="detail-cell"><span>受洗情况</span><strong>${esc(bapt)}</strong></div><div class="detail-cell"><span>恩赐 / 服侍方向</span><strong>${esc(m.gifts||'未填写')}</strong></div><div class="detail-cell"><span>最近一次探访</span><strong>${esc(fmtDate(lastVisitDate(m.id)))}</strong></div><div class="detail-cell full"><span>备注</span><strong>${esc(m.notes||'暂无备注')}</strong></div></div><div class="member-actions"><button class="btn small-btn" data-action="edit-member" data-id="${esc(m.id)}">编辑档案</button><button class="btn small-btn" data-action="member-history" data-id="${esc(m.id)}">查看探访记录</button>${m.active===false?`<button class="btn small-btn primary" data-action="restore-member" data-id="${esc(m.id)}">恢复成员</button>`:`<button class="btn small-btn" data-action="archive-member" data-id="${esc(m.id)}">归档成员</button>`}</div></div></details>`;}
function renderAttendance(){const a=attendanceMetrics(),editing=editingAttendanceId?db.attendanceSessions.find(s=>s.id===editingAttendanceId):null;const sessions=a.sessions.slice().sort((x,y)=>y.date.localeCompare(x.date));const chart=sessions.slice(-8).map(s=>{let p=0,d=0;for(const m of activeMembers()){const st=(s.records||{})[m.id]||'unrecorded';if(st==='present'){p++;d++;}else if(st==='absent')d++;}return {date:s.date,p,d,rate:d?Math.round(p/d*100):0};});return `<div class="page-head"><div><div class="eyebrow">模块 02 / 聚会参与情况</div><h1>出勤记录</h1><p>按每场聚会记录成员状态。请假不计入出勤率分母，未记录不自动视为出席或缺席。</p></div><div class="page-actions"><button class="btn primary" data-action="new-attendance">＋ 记录一场聚会</button></div></div>${dateRangeControl('attendance','出勤记录')}${editing||window.showAttendanceForm?renderAttendanceForm(editing):''}<div class="grid stats-grid">${statCard('聚会场次',a.sessions.length,`统计范围内的已建档聚会`,'▦')}${statCard('出席人次',a.present,`另有 ${a.absent} 人次缺席`,'✓')}${statCard('整体出勤率',`${a.rate}%`,`按出席 ÷（出席＋缺席）计算`,'◷')}${statCard('请假人次',a.excused,`${a.unrecorded} 人次尚未记录`,'○')}</div><div class="grid two-col"><section class="card card-pad"><div class="section-head"><div><h2>出勤率趋势</h2><p>最近 8 场聚会，按每场已记录状态计算</p></div></div>${chart.length?`<div class="chart-list">${chart.map(x=>`<div class="chart-row"><div class="chart-label">${esc(fmtDate(x.date,true))}</div><div class="chart-track"><div class="chart-fill" style="width:${x.rate}%"></div></div><div class="chart-value">${x.rate}%</div></div>`).join('')}</div>`:emptyState('▦','暂无趋势数据','录入聚会日期并登记成员状态后，这里会显示变化趋势。')}</section><section class="card card-pad"><div class="section-head"><div><h2>成员出勤概况</h2><p>只计算已记录的出席与缺席</p></div><button class="btn small-btn" data-view="members">成员档案</button></div>${activeMembers().length?`<div class="list-stack">${activeMembers().map(m=>{const s=memberAttendanceStats(m.id);return `<div class="mini-row"><div class="avatar">${avatarText(m.name)}</div><div class="mini-main"><div class="mini-title">${esc(m.name)}</div><div class="mini-sub">出席 ${s.present} · 缺席 ${s.absent} · 请假 ${s.excused}</div></div><div class="mini-value">${s.rate===null?'—':s.rate+'%'}</div></div>`}).join('')}</div>`:emptyState('♧','暂无成员','先添加成员，才能统计个人出勤。')}</section></div><section class="card card-pad" style="margin-top:16px"><div class="section-head"><div><h2>聚会记录列表</h2><p>点编辑可修正日期、主题与成员状态。</p></div><span class="pill">${sessions.length} 场</span></div>${sessions.length?`<div class="table-wrap"><table><thead><tr><th>日期</th><th>聚会主题</th><th>出席</th><th>缺席</th><th>请假</th><th>操作</th></tr></thead><tbody>${sessions.map(s=>{let p=0,ab=0,ex=0;for(const m of activeMembers()){const st=(s.records||{})[m.id]||'unrecorded';if(st==='present')p++;if(st==='absent')ab++;if(st==='excused')ex++;}return `<tr><td>${esc(fmtDate(s.date))}</td><td><strong>${esc(s.title||'团契聚会')}</strong></td><td><span class="pill green">${p}</span></td><td><span class="pill red">${ab}</span></td><td><span class="pill gold">${ex}</span></td><td><button class="btn small-btn" data-action="edit-attendance" data-id="${esc(s.id)}">编辑</button> <button class="btn small-btn danger" data-action="delete-attendance" data-id="${esc(s.id)}">删除</button></td></tr>`}).join('')}</tbody></table></div>`:emptyState('▦','还没有聚会记录','先创建一场聚会，再批量登记出席状态。',`<button class="btn primary" data-action="new-attendance">记录第一场聚会</button>`)}</section>`;}
function renderAttendanceForm(s){const members=activeMembers();return `<section class="card card-pad form-card"><div class="section-head"><div><h2>${s?'编辑聚会记录':'记录一场聚会'}</h2><p>可以先点击“全员标记出席”，再修改缺席或请假的成员。</p></div><button class="btn small-btn" data-action="cancel-attendance">取消</button></div><form id="attendanceForm"><input type="hidden" name="id" value="${esc(s?.id||'')}"><div class="form-grid"><div class="field"><label>聚会日期 *</label><input name="date" type="date" required value="${esc(s?.date||todayISO())}"></div><div class="field"><label>聚会主题 / 名称</label><input name="title" value="${esc(s?.title||'团契聚会')}" placeholder="例如：周五团契"></div></div><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin:17px 0 7px"><h3 style="margin:0">成员出勤状态</h3><button class="btn small-btn" type="button" data-action="all-present">全员标记出席</button></div>${members.length?members.map(m=>{const status=(s?.records||{})[m.id]||'unrecorded';return `<div class="attendance-form-row"><div class="attendance-person"><div class="avatar">${avatarText(m.name)}</div><div><strong>${esc(m.name)}</strong><span>${esc(categoryById(m.categoryId).name)}</span></div></div><select class="status-select" name="status_${esc(m.id)}"><option value="unrecorded" ${status==='unrecorded'?'selected':''}>未记录</option><option value="present" ${status==='present'?'selected':''}>出席</option><option value="absent" ${status==='absent'?'selected':''}>缺席</option><option value="excused" ${status==='excused'?'selected':''}>请假</option></select></div>`}).join(''):`${emptyState('♧','没有当前成员','请先到成员档案中添加成员。')}`}<div class="form-actions"><button class="btn" type="button" data-action="cancel-attendance">取消</button><button class="btn primary" type="submit">保存聚会记录</button></div></form></section>`;}
function renderWeekly(){const range=getRange('weekly'),weeks=weekRanges(range.start,range.end);if(!selectedWeekStart||!weeks.some(w=>w.start===selectedWeekStart)){const now=todayISO();selectedWeekStart=(weeks.find(w=>now>=w.start&&now<=w.end)||weeks[0]||{start:range.start}).start;}const selected=weeks.find(w=>w.start===selectedWeekStart)||weeks[0]||{start:range.start,end:range.end};const log=db.weeklyLogs.find(l=>l.weekStart===selected.start);const editing=editingWeeklyId?db.weeklyLogs.find(l=>l.id===editingWeeklyId):null;const weekVisits=db.visits.filter(v=>v.date>=selected.start&&v.date<=selected.end).sort((a,b)=>a.date.localeCompare(b.date));const weekAttendance=db.attendanceSessions.filter(s=>s.date>=selected.start&&s.date<=selected.end).sort((a,b)=>a.date.localeCompare(b.date));return `<div class="page-head"><div><div class="eyebrow">模块 04 / 每周复盘与跟进</div><h1>每周工作日志</h1><p>每周以学期开始日期为起点，按连续七天划分。探访与聚会记录会自动汇入对应周次。</p></div><div class="page-actions"><button class="btn primary" data-action="edit-weekly" data-id="${esc(log?.id||'')}" data-week="${esc(selected.start)}">${log?'编辑本周日志':'＋ 写本周日志'}</button></div></div>${dateRangeControl('weekly','每周日志')}${editing||weeklyFormOpen?renderWeeklyForm(editing,selected):''}<div class="week-grid"><section class="card card-pad"><div class="section-head"><div><h2>学期周次</h2><p>${weeks.length} 周 · 选择一周查看工作记录</p></div></div>${weeks.length?`<div class="week-select-list">${weeks.map((w,i)=>{const l=db.weeklyLogs.find(x=>x.weekStart===w.start);const vc=db.visits.filter(v=>v.date>=w.start&&v.date<=w.end).length;return `<button class="week-choice ${selected.start===w.start?'active':''}" data-action="select-week" data-week="${esc(w.start)}"><div><strong>第 ${i+1} 周 · ${esc(fmtDateRange(w.start,w.end))}</strong><span>${l?'已写工作日志':'尚未写日志'} · ${vc} 次探访</span></div><span>${l?'✓':'＋'}</span></button>`}).join('')}</div>`:emptyState('▤','尚未设置日期范围','请先在设置中确定学期开始与结束日期。')}</section><section class="card card-pad"><div class="section-head"><div><h2>第 ${Math.max(1,weeks.findIndex(w=>w.start===selected.start)+1)} 周</h2><p>${esc(fmtDateRange(selected.start,selected.end))}</p></div><span class="pill ${log?'green':'gold'}">${log?'已记录':'待记录'}</span></div><div class="week-detail-block"><h3>♡ 探访摘要 <span class="pill">${weekVisits.length} 次</span></h3>${weekVisits.length?weekVisits.map(v=>`<p>• ${esc(fmtDate(v.date,true))}　${esc(memberById(v.memberId)?.name||v.memberNameSnapshot||'已归档成员')}${v.starred?' ★':''}</p>`).join(''):'<p class="muted">本周暂无探访记录。</p>'}</div><div class="week-detail-block"><h3>▦ 聚会摘要 <span class="pill">${weekAttendance.length} 场</span></h3>${weekAttendance.length?weekAttendance.map(s=>`<p>• ${esc(fmtDate(s.date,true))}　${esc(s.title||'团契聚会')}</p>`).join(''):'<p class="muted">本周暂无聚会记录。</p>'}</div><div class="week-detail-block"><h3>▤ 工作总结</h3><p>${esc(log?.content||'尚未填写本周工作总结。')}</p></div><div class="form-actions"><button class="btn primary" data-action="edit-weekly" data-id="${esc(log?.id||'')}" data-week="${esc(selected.start)}">${log?'编辑工作日志':'填写工作日志'}</button></div></section></div>`;}

function renderSettings(){const s=db.settings;return `<div class="page-head"><div><div class="eyebrow">隐私、学期与数据管理</div><h1>设置与备份</h1><p>管理统一学期日期、手机提醒、储存码与加密备份。数据只保存在当前浏览器的本地存储中。</p></div></div><section class="card card-pad" style="margin-bottom:16px"><div class="section-head"><div><h2>统一学期设置</h2><p>其他模块默认使用这里的时间范围，可单独覆盖。</p></div><span class="pill green">全局默认</span></div><form id="globalTermForm"><div class="form-grid"><div class="field full"><label>学期名称</label><input name="termName" value="${esc(s.termName||'')}" maxlength="80" placeholder="例如：2026 秋季学期"></div><div class="field"><label>学期开始日期 *</label><input name="termStart" type="date" value="${esc(s.termStart)}" required></div><div class="field"><label>学期结束日期 *</label><input name="termEnd" type="date" value="${esc(s.termEnd)}" required></div></div><div class="form-actions"><button class="btn primary" type="submit">保存学期设置</button></div></form></section><section class="card card-pad" style="margin-bottom:16px"><div class="section-head"><div><h2>每周手机提醒</h2><p>下载日历提醒文件并导入手机日历，由手机日历在设定时间提醒。</p></div><span class="pill blue">无需后台运行</span></div><div class="callout blue">单独的 HTML 文件不能可靠地在完全关闭浏览器时检测“已一周未打开”并主动推送。日历提醒是本地版较可靠的替代方案；它会按固定周期提醒，不会自动判断软件是否已打开。</div><form id="reminderForm"><div class="reminder-grid"><div class="field"><label>每周提醒日</label><select name="reminderDay">${[['MO','星期一'],['TU','星期二'],['WE','星期三'],['TH','星期四'],['FR','星期五'],['SA','星期六'],['SU','星期日']].map(([v,l])=>`<option value="${v}" ${s.reminderDay===v?'selected':''}>${l}</option>`).join('')}</select></div><div class="field"><label>提醒时间</label><input type="time" name="reminderTime" value="${esc(s.reminderTime||'09:00')}" required></div></div><div class="form-actions" style="justify-content:space-between"><button class="btn" type="submit">保存提醒设置</button><button class="btn primary" type="button" data-action="download-ics">下载每周提醒 .ics</button></div></form></section><section class="card card-pad" style="margin-bottom:16px"><div class="section-head"><div><h2>加密资料库与备份</h2><p>备份文件本身已经加密，恢复时需要输入对应储存码。</p></div><span class="pill green">AES-GCM</span></div><div class="setting-row"><div><h3>导出加密备份</h3><p>建议在学期中定期导出，并保存到安全的位置。备份文件不是明文，不应与储存码一起发送。</p></div><button class="btn primary" data-action="export-backup">导出 JSON 备份</button></div><div class="setting-row"><div><h3>导入加密备份</h3><p>从其他设备或浏览器恢复。导入会覆盖当前资料库，请先导出当前备份。</p></div><button class="btn" data-action="show-import">选择备份文件</button></div><div id="importPanel" class="hidden" style="padding:14px;background:#f7faf6;border-radius:13px;margin-top:12px"><form id="importForm"><div class="form-grid"><div class="field full"><label>加密备份文件</label><input type="file" name="backupFile" accept=".json,application/json" required></div><div class="field full"><label>该备份对应的储存码</label><input type="password" name="backupPassword" required minlength="8" autocomplete="current-password" placeholder="输入备份创建时使用的储存码"></div></div><div class="form-actions"><button class="btn" type="button" data-action="hide-import">取消</button><button class="btn primary" type="submit">验证并恢复</button></div></form></div><div class="setting-row"><div><h3>修改储存码</h3><p>当前资料库解锁后可更换储存码。请记住新储存码；旧备份仍需要旧储存码解锁。</p></div><button class="btn" data-action="show-change-code">修改储存码</button></div><div id="changeCodePanel" class="hidden" style="padding:14px;background:#f7faf6;border-radius:13px;margin-top:12px"><form id="changeCodeForm"><div class="form-grid"><div class="field"><label>新储存码</label><input type="password" name="newPassword" required minlength="8" autocomplete="new-password"></div><div class="field"><label>再次输入新储存码</label><input type="password" name="confirmPassword" required minlength="8" autocomplete="new-password"></div></div><div class="form-actions"><button class="btn" type="button" data-action="hide-change-code">取消</button><button class="btn primary" type="submit">更新储存码并重新加密</button></div></form></div></section><section class="card card-pad"><div class="section-head"><div><h2>隐私与使用说明</h2><p>本地优先，但仍需要正确管理设备与备份。</p></div></div><div class="setting-row"><div><h3>数据存在哪里？</h3><p>加密后的数据存放在当前浏览器的本地存储中，不会自动发送到服务器。换浏览器、清理浏览器数据、使用无痕模式，或移动 HTML 文件后，可能无法直接看到原资料。</p></div></div><div class="setting-row"><div><h3>加密能保护什么？</h3><p>资料库使用储存码派生加密密钥，保存的是密文。解锁后，资料会在当前页面内存中供软件使用；请锁定设备，不要把储存码交给无关人员。</p></div></div><div class="setting-row"><div><h3>删除成员如何处理？</h3><p>当前版本提供“归档”而不是直接抹除历史记录。归档成员不再计入当前目标，但既有探访和出勤记录会保留，避免误删造成历史数据断裂。</p></div></div><div class="setting-row"><div><h3>重要提醒</h3><p>本地加密不能替代设备本身的登录密码、磁盘加密和安全习惯。请定期导出加密备份，并把储存码与备份分开保管。</p></div></div><div class="form-actions"><button class="btn danger" data-action="lock-app">立即锁定资料库</button></div></section><div class="footer-note">同行 · 本地版 1.0　|　不依赖外部脚本、字体或云端服务</div>`;}
function render(){if(!db)return;$('#crumbCurrent').textContent=viewTitles[view]||'总览';$('#termPill').textContent=db.settings.termName||fmtDateRange(db.settings.termStart,db.settings.termEnd);$$('#mainNav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));window.showVisitForm=window.showVisitForm||false;window.showAttendanceForm=window.showAttendanceForm||false;let html='';if(view==='dashboard')html=renderDashboard();if(view==='visits')html=renderVisits();if(view==='attendance')html=renderAttendance();if(view==='members')html=renderMembers();if(view==='weekly')html=renderWeekly();if(view==='settings')html=renderSettings();$('#appContent').innerHTML=html;}
function downloadFile(name,content,type='application/octet-stream'){const blob=new Blob([content],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
async function exportBackup(){try{await saveChain;const raw=localStorage.getItem(STORAGE_KEY);if(!raw){showToast('当前没有找到本地加密资料库。');return;}downloadFile(`同行-加密备份-${todayISO()}.json`,JSON.stringify(JSON.parse(raw),null,2),'application/json');showToast('已导出加密备份文件。');}catch(e){showToast('导出失败：'+e.message);}}
function exportMembersCSV(){const rows=[['姓名','分类','电话','学校/单位','班级/年级','寝室/住址提示','受洗情况','恩赐/服侍方向','个人目标覆盖','备注']];for(const m of db.members){rows.push([m.name,categoryById(m.categoryId).name,m.phone,m.school,m.className,m.dorm,m.baptized==='yes'?'已受洗':m.baptized==='no'?'尚未受洗':'未填写',m.gifts,m.targetOverride??'',m.notes]);}const csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');downloadFile(`同行-成员档案-${todayISO()}.csv`,csv,'text/csv;charset=utf-8');showToast('已导出成员 CSV。注意：CSV 为明文，请妥善保管。');}
function createICS(){const day=db.settings.reminderDay||'MO',time=db.settings.reminderTime||'09:00';const [hh,mm]=time.split(':').map(Number);const days={SU:0,MO:1,TU:2,WE:3,TH:4,FR:5,SA:6};const now=new Date();let dt=new Date(now.getFullYear(),now.getMonth(),now.getDate(),hh,mm,0);let ahead=(days[day]-dt.getDay()+7)%7;if(ahead===0&&dt<=now)ahead=7;dt.setDate(dt.getDate()+ahead);const pad=n=>String(n).padStart(2,'0');const stamp=`${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`;const utc=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z$/,'Z');const escICS=s=>String(s).replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Tongxing//Care Reminder//ZH-CN','CALSCALE:GREGORIAN','METHOD:PUBLISH','BEGIN:VEVENT',`UID:tongxing-care-${Date.now()}@local`,`DTSTAMP:${utc}`,`DTSTART:${stamp}`,'DURATION:PT15M',`RRULE:FREQ=WEEKLY;BYDAY=${day}`,`SUMMARY:${escICS('团契关怀工作提醒')}`,`DESCRIPTION:${escICS('打开“同行”检查本周探访计划、出勤记录与每周日志。')}`,'BEGIN:VALARM','TRIGGER:-PT0M','ACTION:DISPLAY',`DESCRIPTION:${escICS('检查本周探访、出勤与跟进事项')}`,'END:VALARM','END:VEVENT','END:VCALENDAR',''].join('\r\n');downloadFile('同行-每周关怀提醒.ics',ics,'text/calendar;charset=utf-8');showToast('已生成日历文件。请在手机上打开并添加到日历。');}
function memberHistory(id){const m=memberById(id);if(!m)return;view='visits';editingVisitId=null;window.showVisitForm=false;render();const list=$('#appContent .record-list');if(list){const records=$$('.record',list);records.forEach(el=>{const t=el.textContent||'';if(t.includes(m.name))el.open=true;});list.scrollIntoView({behavior:'smooth',block:'start'});}showToast(`已切换到探访记录；查找成员：${m.name}`);}
function handleClick(e){const nav=e.target.closest('[data-view]');if(nav){view=nav.dataset.view;memberFormOpen=false;editingMemberId=null;editingVisitId=null;editingAttendanceId=null;editingWeeklyId=null;weeklyFormOpen=false;window.showVisitForm=false;window.showAttendanceForm=false;categoryFormOpen=false;render();return;}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,idv=b.dataset.id;
if(a==='lock-app'){if(confirm('锁定资料库？未提交的表单内容不会保存。')){vaultKey=null;vaultSalt=null;db=null;view='dashboard';showGate(localStorage.getItem(STORAGE_KEY)?'unlock':'create');}return;}
if(a==='export-backup'){exportBackup();return;}
if(a==='export-members-csv'){exportMembersCSV();return;}
if(a==='add-member'){memberFormOpen=true;editingMemberId=null;render();$('#appContent .form-card')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
if(a==='edit-member'){editingMemberId=idv;memberFormOpen=true;render();$('#appContent .form-card')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
if(a==='cancel-member'){memberFormOpen=false;editingMemberId=null;render();return;}
if(a==='archive-member'){const m=memberById(idv);if(m&&confirm(`将“${m.name}”归档？历史探访和出勤记录会保留，但该成员不再计入当前成员数与目标。`)){m.active=false;persist();render();showToast('成员已归档，历史记录已保留。');}return;}
if(a==='restore-member'){const m=memberById(idv);if(m){m.active=true;persist();render();showToast('成员已恢复到当前名单。');}return;}
if(a==='member-history'){memberHistory(idv);return;}
if(a==='toggle-visit-form'){if(editingVisitId){editingVisitId=null;window.showVisitForm=false;}else window.showVisitForm=!window.showVisitForm;render();return;}
if(a==='cancel-visit-form'){editingVisitId=null;window.showVisitForm=false;render();return;}
if(a==='edit-visit'){editingVisitId=idv;window.showVisitForm=true;render();$('#appContent .form-card')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
if(a==='delete-visit'){const v=db.visits.find(x=>x.id===idv);if(v&&confirm('确定删除这条探访记录？删除后无法从软件中撤销。')){db.visits=db.visits.filter(x=>x.id!==idv);persist();render();showToast('探访记录已删除。');}return;}
if(a==='toggle-star'){const v=db.visits.find(x=>x.id===idv);if(v){v.starred=!v.starred;persist();render();showToast(v.starred?'已标记为重点跟进。':'已取消重点标记。');}return;}
if(a==='insert-numbering'){const t=$('#visitNotes');if(t){const addition='1. \n2. \n3. ';const start=t.selectionStart??t.value.length;const end=t.selectionEnd??t.value.length;t.value=t.value.slice(0,start)+addition+t.value.slice(end);t.focus();t.selectionStart=t.selectionEnd=start+addition.length;}return;}
if(a==='confirm-goal'){db.goalPlan={signature:goalSignature(),confirmedAt:new Date().toISOString()};persist();render();showToast('当前探访目标已确认。');return;}
if(a==='add-category'){categoryFormOpen=true;render();return;}
if(a==='cancel-category'){categoryFormOpen=false;render();return;}
if(a==='toggle-range'){const k=b.dataset.module,r=db.moduleRanges[k];if(!r)return;if(r.independent){r.independent=false;r.start=db.settings.termStart;r.end=db.settings.termEnd;}else{r.independent=true;r.start=db.settings.termStart;r.end=db.settings.termEnd;}persist();render();showToast(r.independent?'已启用独立日期范围。':'已恢复跟随统一学期。');return;}
if(a==='new-attendance'){editingAttendanceId=null;window.showAttendanceForm=true;render();$('#appContent .form-card')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
if(a==='edit-attendance'){editingAttendanceId=idv;window.showAttendanceForm=true;render();$('#appContent .form-card')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
if(a==='cancel-attendance'){editingAttendanceId=null;window.showAttendanceForm=false;render();return;}
if(a==='all-present'){const f=$('#attendanceForm');if(f)$$('select[name^="status_"]',f).forEach(s=>s.value='present');showToast('已将当前成员全部标记为出席，请检查并调整例外情况。');return;}
if(a==='delete-attendance'){const s=db.attendanceSessions.find(x=>x.id===idv);if(s&&confirm('确定删除这场聚会的出勤记录？')){db.attendanceSessions=db.attendanceSessions.filter(x=>x.id!==idv);persist();render();showToast('聚会记录已删除。');}return;}
if(a==='select-week'){selectedWeekStart=b.dataset.week;editingWeeklyId=null;render();return;}
if(a==='edit-weekly'){const week=b.dataset.week||selectedWeekStart;selectedWeekStart=week;editingWeeklyId=idv||null;weeklyFormOpen=true;render();$('#appContent .form-card')?.scrollIntoView({behavior:'smooth',block:'start'});return;}
if(a==='cancel-weekly'){editingWeeklyId=null;weeklyFormOpen=false;render();return;}
if(a==='dismiss-return'){returnReminderDays=0;render();return;}
if(a==='download-ics'){createICS();return;}
if(a==='show-import'){const p=$('#importPanel');p?.classList.remove('hidden');return;}
if(a==='hide-import'){const p=$('#importPanel');p?.classList.add('hidden');return;}
if(a==='show-change-code'){$('#changeCodePanel')?.classList.remove('hidden');return;}
if(a==='hide-change-code'){$('#changeCodePanel')?.classList.add('hidden');return;}
}
async function handleSubmit(e){const f=e.target;if(!f||!f.id)return;const formId=f.id;if(['gateForm','memberForm','visitForm','attendanceForm','weeklyForm','globalTermForm','categorySettingsForm','categoryForm','planningEstimateForm','rangeForm_visits','rangeForm_attendance','rangeForm_weekly','reminderForm','importForm','changeCodeForm'].includes(formId))e.preventDefault();else return;
try{
if(formId==='gateForm'){const fd=new FormData(f),password=String(fd.get('password')||'');if(password.length<8){showGate(f.dataset.mode,'储存码至少需要 8 个字符。');return;}if(f.dataset.mode==='create'){if(password!==String(fd.get('confirm')||'')){showGate('create','两次输入的储存码不一致。');return;}const salt=crypto.getRandomValues(new Uint8Array(16));vaultKey=await deriveKey(password,salt);vaultSalt=salt;db=defaultDB();localStorage.setItem(STORAGE_KEY,JSON.stringify(await encryptBlob(db,vaultKey,vaultSalt)));openApp();showToast('本地加密资料库已创建。');}else{const raw=localStorage.getItem(STORAGE_KEY);if(!raw){showGate('create','没有找到现有资料库，请创建新的资料库或先恢复加密备份。');return;}try{const opened=await decryptBlob(JSON.parse(raw),password);db=opened.data;vaultKey=opened.key;vaultSalt=opened.salt;openApp();showToast('资料库已解锁。');}catch(err){showGate('unlock','储存码不正确，或资料库文件已损坏。请再试一次。');}}return;}
if(formId==='memberForm'){const fd=new FormData(f),mid=String(fd.get('id')||'');const obj={id:mid||id('member'),name:String(fd.get('name')||'').trim(),categoryId:String(fd.get('categoryId')||db.settings.categories[0]?.id||''),phone:String(fd.get('phone')||'').trim(),school:String(fd.get('school')||'').trim(),className:String(fd.get('className')||'').trim(),dorm:String(fd.get('dorm')||'').trim(),baptized:String(fd.get('baptized')||'unknown'),gifts:String(fd.get('gifts')||'').trim(),targetOverride:String(fd.get('targetOverride')||'').trim()===''?null:Math.max(0,Number(fd.get('targetOverride'))||0),notes:String(fd.get('notes')||'').trim(),active:true};if(!obj.name){showToast('请填写成员姓名。');return;}const existing=db.members.find(m=>m.id===mid);if(existing){Object.assign(existing,obj);existing.active=true;}else db.members.push(obj);memberFormOpen=false;editingMemberId=null;persist();render();showToast(existing?'成员档案已更新。':'成员已添加。');return;}
if(formId==='visitForm'){const fd=new FormData(f),visitId=String(fd.get('id')||''),member=memberById(String(fd.get('memberId')||''));if(!member){showToast('请先选择被探访成员。');return;}const visitorIds=$$('input[name="visitorIds"]:checked',f).map(x=>x.value);const obj={id:visitId||id('visit'),memberId:member.id,memberNameSnapshot:member.name,visitorIds,visitorNamesSnapshot:visitorIds.map(mid=>memberById(mid)?.name).filter(Boolean),date:String(fd.get('date')||todayISO()),starred:fd.get('starred')==='on',notes:String(fd.get('notes')||'').trim(),updatedAt:new Date().toISOString()};const existing=db.visits.find(v=>v.id===visitId);if(existing)Object.assign(existing,obj);else db.visits.push({...obj,createdAt:new Date().toISOString()});editingVisitId=null;window.showVisitForm=false;persist();render();showToast(existing?'探访记录已更新。':'探访记录已保存。');return;}
if(formId==='attendanceForm'){const fd=new FormData(f),sid=String(fd.get('id')||''),records={};for(const m of activeMembers())records[m.id]=String(fd.get('status_'+m.id)||'unrecorded');const obj={id:sid||id('attendance'),date:String(fd.get('date')||todayISO()),title:String(fd.get('title')||'').trim()||'团契聚会',records,updatedAt:new Date().toISOString()};const existing=db.attendanceSessions.find(s=>s.id===sid);if(existing){existing.date=obj.date;existing.title=obj.title;existing.records={...(existing.records||{}),...records};existing.updatedAt=obj.updatedAt;}else db.attendanceSessions.push({...obj,createdAt:new Date().toISOString()});editingAttendanceId=null;window.showAttendanceForm=false;persist();render();showToast(existing?'聚会记录已更新。':'聚会出勤已保存。');return;}
if(formId==='weeklyForm'){const fd=new FormData(f),lid=String(fd.get('id')||''),ws=String(fd.get('weekStart')||selectedWeekStart),wr=weekRanges(getRange('weekly').start,getRange('weekly').end).find(w=>w.start===ws)||{start:ws,end:addDays(ws,6)};const obj={id:lid||id('weekly'),weekStart:wr.start,weekEnd:wr.end,content:String(fd.get('content')||'').trim(),updatedAt:new Date().toISOString()};const existing=db.weeklyLogs.find(l=>l.id===lid||l.weekStart===wr.start);if(existing)Object.assign(existing,obj);else db.weeklyLogs.push({...obj,createdAt:new Date().toISOString()});selectedWeekStart=wr.start;editingWeeklyId=null;weeklyFormOpen=false;persist();render();showToast('每周工作日志已保存。');return;}
if(formId==='globalTermForm'){const fd=new FormData(f),start=String(fd.get('termStart')),end=String(fd.get('termEnd'));if(start>end){showToast('结束日期不能早于开始日期。');return;}db.settings.termStart=start;db.settings.termEnd=end;db.settings.termName=String(fd.get('termName')||'').trim()||'当前学期';for(const k of ['visits','attendance','weekly'])if(!db.moduleRanges[k].independent){db.moduleRanges[k].start=start;db.moduleRanges[k].end=end;}db.goalPlan=null;persist();render();showToast('统一学期设置已保存；请检查探访目标并重新确认。');return;}
if(formId==='categorySettingsForm'){for(const c of db.settings.categories){const name=String(new FormData(f).get('name_'+c.id)||'').trim();const target=Number(new FormData(f).get('target_'+c.id));if(!name||!Number.isFinite(target)||target<0){showToast('请检查分类名称和目标数字。');return;}c.name=name;c.target=target;}db.goalPlan=null;persist();render();showToast('分类与默认探访目标已保存。');return;}
if(formId==='planningEstimateForm'){const fd=new FormData(f),people=Number(fd.get('planningExtraMembers')),target=Number(fd.get('planningExtraTarget'));if(!Number.isFinite(people)||people<0||!Number.isFinite(target)||target<0){showToast('请输入有效的估算人数与目标。');return;}db.settings.planningExtraMembers=Math.floor(people);db.settings.planningExtraTarget=Math.floor(target);db.goalPlan=null;persist();render();showToast('未建档成员估算已保存；请重新确认探访目标。');return;}
if(formId==='categoryForm'){const fd=new FormData(f),name=String(fd.get('name')||'').trim(),target=Number(fd.get('target'));if(!name||!Number.isFinite(target)||target<0){showToast('请填写有效的分类名称与目标。');return;}db.settings.categories.push({id:id('cat'),name,target});categoryFormOpen=false;db.goalPlan=null;persist();render();showToast('新分类已添加。');return;}
if(formId.startsWith('rangeForm_')){const module=formId.replace('rangeForm_',''),fd=new FormData(f),start=String(fd.get('start')),end=String(fd.get('end'));if(start>end){showToast('结束日期不能早于开始日期。');return;}db.moduleRanges[module].start=start;db.moduleRanges[module].end=end;db.goalPlan=null;persist();render();showToast('独立日期范围已更新。');return;}
if(formId==='reminderForm'){const fd=new FormData(f);db.settings.reminderDay=String(fd.get('reminderDay')||'MO');db.settings.reminderTime=String(fd.get('reminderTime')||'09:00');persist();render();showToast('提醒设置已保存。');return;}
if(formId==='importForm'){const fd=new FormData(f),file=fd.get('backupFile'),password=String(fd.get('backupPassword')||'');if(!file||!file.size){showToast('请选择一个加密备份文件。');return;}if(!confirm('导入会覆盖当前资料库。建议确认已导出当前备份后继续。确定导入吗？'))return;const text=await file.text();const opened=await decryptBlob(JSON.parse(text),password);await saveChain;db=opened.data;vaultKey=opened.key;vaultSalt=opened.salt;localStorage.setItem(STORAGE_KEY,JSON.stringify(JSON.parse(text)));$('#importPanel')?.classList.add('hidden');persist();render();showToast('加密备份已验证并恢复。');return;}
if(formId==='changeCodeForm'){const fd=new FormData(f),p=String(fd.get('newPassword')||''),c=String(fd.get('confirmPassword')||'');if(p.length<8){showToast('新储存码至少需要 8 个字符。');return;}if(p!==c){showToast('两次输入的新储存码不一致。');return;}await saveChain;const salt=crypto.getRandomValues(new Uint8Array(16)),key=await deriveKey(p,salt);vaultKey=key;vaultSalt=salt;await new Promise(resolve=>{saveChain=saveChain.then(async()=>{const blob=await encryptBlob(db,vaultKey,vaultSalt);localStorage.setItem(STORAGE_KEY,JSON.stringify(blob));resolve();}).catch(err=>{showToast('重新加密失败：'+err.message);resolve();});});$('#changeCodePanel')?.classList.add('hidden');render();showToast('储存码已更新，资料库已使用新密钥重新加密。');return;}
}catch(err){console.error(err);showToast('操作未完成：'+(err.message||'请检查输入后重试。'),4200);}
}
function handleChange(e){const t=e.target;if(t.id==='memberCategoryFilter'){memberCategoryFilter=t.value;updateMemberListOnly();}if(t.id==='memberStatusFilter'){memberStatusFilter=t.value;updateMemberListOnly();}if(t.id==='memberSearch'){memberSearch=t.value;updateMemberListOnly();}}
function updateMemberListOnly(){const list=$('#memberList');if(!list)return;const categories=db.settings.categories;const members=db.members.filter(m=>memberStatusFilter==='archived'?m.active===false:m.active!==false).filter(m=>memberCategoryFilter==='all'||m.categoryId===memberCategoryFilter).filter(m=>{const q=memberSearch.trim().toLowerCase();if(!q)return true;return [m.name,m.phone,m.school,m.className,m.dorm,categoryById(m.categoryId).name,m.gifts,m.notes].some(x=>String(x||'').toLowerCase().includes(q));});list.innerHTML=members.length?members.map(m=>renderMemberCard(m)).join(''):emptyState('♧',memberSearch?'没有找到匹配成员':'还没有成员档案',memberSearch?'尝试更换搜索关键词或分类。':'先录入成员，探访计划与出勤记录才有统一的数据来源。',memberStatusFilter==='active'?`<button class="btn primary" data-action="add-member">添加第一位成员</button>`:'');}
document.addEventListener('click',handleClick);document.addEventListener('submit',handleSubmit);document.addEventListener('change',handleChange);document.addEventListener('input',handleChange);
window.addEventListener('storage',e=>{if(e.key===STORAGE_KEY&&vaultKey){showToast('检测到此浏览器的本地资料库发生变化。为避免覆盖，请导出备份并重新解锁。',5000);}});
init();
})();
